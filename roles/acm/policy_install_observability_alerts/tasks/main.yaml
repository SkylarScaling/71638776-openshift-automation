---
- name: Deploy Global-to-Regional Alerting Policy
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'regional-alerts-policy.yaml.j2') }}"
  changed_when: true

- name: Deploy Placement and Binding for Regional Hubs
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'regional-alerts-placement.yaml.j2') }}"
  changed_when: true
