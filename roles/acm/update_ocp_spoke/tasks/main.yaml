---
# ==============================================================================
# UPDATE OCP ON A HIVE/ACM-MANAGED SPOKE
#
# ClusterCurator (the Red Hat-documented ACM upgrade mechanism) does NOT work
# for a disconnected spoke: confirmed live it validates spec.upgrade.
# desiredUpdate against the spoke ClusterVersion's availableUpdates/
# conditionalUpdates, which are both empty with no reachable Cincinnati graph
# (RetrievedUpdates=False, RemoteFailed) -- the curator job fails in ~40s
# with "Provided version is not valid" and the spoke's ClusterVersion is
# never touched at all. Worse, the ClusterCurator's own
# status.conditions[clustercurator-job].status is "True" even on that
# failure (only .reason distinguishes success from Job_failed), so a status
# == "True" wait silently "succeeds" and the real failure only surfaces
# ~2 hours later when the managed-cluster-version poll times out.
#
# Fixed by driving the spoke's own ClusterVersion directly instead, exactly
# like ocp/update_ocp_hub does for the hub itself (an explicit
# --to-image=<digest> bypasses the Cincinnati graph requirement entirely) --
# just targeting the spoke's own kubeconfig rather than the hub's.
# ClusterImageSet is still created below for visibility/consistency with
# initial provisioning, but is not load-bearing for this upgrade path.
#
# Prerequisites: ocp/mirror_update_content must have run first in this play.
# ==============================================================================

- name: Check current OCP version reported for this managed cluster
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get managedclusterinfo {{ ocp_cluster.name }} -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.distributionInfo.ocp.version}' 2>/dev/null || true
  register: _spoke_current_version
  changed_when: false

# Same insights-operator ClusterVersion-override gap as update_ocp_hub.
# Operate on the spoke's own kubeconfig directly (same convention as
# ocp/patch_cluster_idms's per-spoke tasks), not target_kubeconfig (the hub).
- name: Determine if this run is a minor version bump for this spoke
  ansible.builtin.set_fact:
    _spoke_is_minor_bump: >-
      {{ (_spoke_current_version.stdout | trim | regex_replace('^(\d+\.\d+)\..*$', '\1')) != (openshift_version | string) }}

- name: Check if the insights-operator ClusterVersion override is currently set on the spoke
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterversion version
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    -o jsonpath='{.spec.overrides[?(@.name=="insights-operator")].unmanaged}'
  register: _spoke_insights_override_check
  changed_when: false
  when: _spoke_is_minor_bump | bool

- name: Temporarily remove the insights-operator override on the spoke for the minor version upgrade
  ansible.builtin.shell: |
    set -e
    KCFG="{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig"
    CURRENT=$({{ bin_dir }}/oc get clusterversion version --kubeconfig "$KCFG" -o json)
    UPDATED=$(echo "$CURRENT" | jq -c \
      '.spec.overrides = ((.spec.overrides // []) | map(select(.name != "insights-operator")))')
    echo "$UPDATED" | {{ bin_dir }}/oc apply --kubeconfig "$KCFG" -f -
  args:
    executable: /bin/bash
  register: _spoke_insights_override_removed
  changed_when: true
  when:
    - _spoke_is_minor_bump | bool
    - _spoke_insights_override_check.stdout | default('') | trim == "true"

- name: Refresh Manual-mode cloud credentials for the minor version upgrade
  ansible.builtin.include_role:
    name: ocp/update_manual_cloud_credentials
  vars:
    target_kubeconfig: "{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig"
  when: _spoke_is_minor_bump | bool

# Registry-config is a control-node-local read against quay.io/the mirror
# registry (oc adm release info / oc image info), not an in-cluster call --
# any cluster's mirror-workspace auth.json works for verifying any other
# cluster's Sigstore artifact, so reuse the hub's update workspace rather
# than standing up a spoke-specific one.
- name: Acknowledge the Sigstore admin-gate for this spoke's minor version upgrade
  ansible.builtin.include_role:
    name: ocp/ack_release_signature_gate
  vars:
    target_kubeconfig: "{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig"
    _release_registry_config: "{{ working_dir }}/oc-mirror-workspace-update/containers/auth.json"
    _release_sig_mirror_dest_prefix: "{{ quay_registry_url }}/{{ quay_mirror_org }}"
  when: _spoke_is_minor_bump | bool

- name: Create ClusterImageSet pointing at the mirrored release in Quay
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'cluster-image-set.yaml.j2') }}"
  changed_when: true
  when: _spoke_current_version.stdout | trim != (openshift_version ~ '.' ~ ocp_patch_version)

- name: Resolve the target release image's digest
  ansible.builtin.shell: >
    {{ bin_dir }}/oc adm release info
    quay.io/openshift-release-dev/ocp-release:{{ openshift_version }}.{{ ocp_patch_version }}-x86_64
    --registry-config={{ working_dir }}/oc-mirror-workspace-update/containers/auth.json
    --insecure=true
    -o jsonpath='{.digest}'
  register: _spoke_update_release_digest
  changed_when: false
  failed_when: false
  when: _spoke_current_version.stdout | trim != (openshift_version ~ '.' ~ ocp_patch_version)

- name: Set target release image reference (by digest when resolvable, else the tag)
  ansible.builtin.set_fact:
    _spoke_update_release_image: >-
      {{
        (_spoke_update_release_image_tag.split(':')[:-1] | join(':') ~ '@' ~ (_spoke_update_release_digest.stdout | trim))
        if (_spoke_update_release_digest.stdout | default('') | trim != '')
        else _spoke_update_release_image_tag
      }}
  vars:
    _spoke_update_release_image_tag: "{{ quay_registry_url }}/{{ quay_mirror_org }}/openshift/release-images:{{ openshift_version }}.{{ ocp_patch_version }}-x86_64"
  when: _spoke_current_version.stdout | trim != (openshift_version ~ '.' ~ ocp_patch_version)

- name: Look for an oc-mirror release signature ConfigMap for this version
  ansible.builtin.find:
    paths: "{{ working_dir }}/oc-mirror-workspace-update/working-dir/cluster-resources"
    patterns: "*signature*.yaml"
    file_type: file
  register: _spoke_signature_files
  when: _spoke_current_version.stdout | trim != (openshift_version ~ '.' ~ ocp_patch_version)

- name: Apply release signature ConfigMap(s) to the spoke if oc-mirror generated any
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig -f {{ item.path }}"
  loop: "{{ _spoke_signature_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: true
  when: _spoke_signature_files.files | default([]) | length > 0

# Same Red Hat-documented --force fallback as ocp/update_ocp_hub when no
# signature ConfigMap exists for this release -- the image's provenance is
# already established by the mirroring chain.
- name: Trigger ClusterVersion update on the spoke to the mirrored release image
  ansible.builtin.shell: >
    {{ bin_dir }}/oc adm upgrade
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    --allow-explicit-upgrade
    --to-image={{ _spoke_update_release_image }}
    {{ '' if _spoke_signature_files.files | default([]) | length > 0 else '--force' }}
  register: _spoke_upgrade_trigger
  changed_when: true
  when: _spoke_current_version.stdout | trim != (openshift_version ~ '.' ~ ocp_patch_version)

# Same MCO-safe wait pattern as ocp/update_ocp_hub: wait for Progressing=True
# (detection window) before waiting for completion, so a stale condition
# can't pass the completion check immediately.
- name: Wait for the spoke's ClusterVersion to begin Progressing (CVO detection window)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterversion version
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    -o jsonpath='{.status.conditions[?(@.type=="Progressing")].status}'
  register: _spoke_cv_progressing_start
  until: _spoke_cv_progressing_start.stdout == "True"
  retries: "{{ update_ocp_spoke_detect_retries }}"
  delay: "{{ update_ocp_spoke_detect_delay }}"
  changed_when: false
  failed_when: false
  when: _spoke_current_version.stdout | trim != (openshift_version ~ '.' ~ ocp_patch_version)

- name: Wait for the spoke's ClusterVersion update to complete (this can take 60+ minutes)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterversion version
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    -o jsonpath='{.status.history[0].state}={.status.desired.version}'
  register: _spoke_cv_complete
  until: _spoke_cv_complete.stdout == ("Completed=" ~ openshift_version ~ "." ~ ocp_patch_version)
  retries: "{{ update_ocp_spoke_poll_retries }}"
  delay: "{{ update_ocp_spoke_poll_delay }}"
  changed_when: false
  when: _spoke_current_version.stdout | trim != (openshift_version ~ '.' ~ ocp_patch_version)

# ClusterVersion reporting "Completed" doesn't guarantee every node has
# finished rolling through MCO yet -- confirmed live (postflight MCP-settle
# check failed immediately after this point with master/worker both
# False=True, i.e. still mid-rollout). ocp/update_ocp_hub already waits for
# both MCPs to settle after its own ClusterVersion-complete wait; this spoke
# rewrite (commit 88db1d7) missed copying that step across. Add it here too.
- name: Wait for the spoke's master MachineConfigPool to settle after the update
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp master
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}={.status.conditions[?(@.type=="Updating")].status}'
  register: _spoke_master_mcp_settled
  until: _spoke_master_mcp_settled.stdout == "True=False"
  retries: "{{ update_ocp_spoke_mcp_settle_retries }}"
  delay: "{{ update_ocp_spoke_mcp_settle_delay }}"
  changed_when: false

- name: Wait for the spoke's worker MachineConfigPool to settle after the update
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp worker
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}={.status.conditions[?(@.type=="Updating")].status}'
  register: _spoke_worker_mcp_settled
  until: _spoke_worker_mcp_settled.stdout == "True=False"
  retries: "{{ update_ocp_spoke_mcp_settle_retries }}"
  delay: "{{ update_ocp_spoke_mcp_settle_delay }}"
  changed_when: false

- name: Wait for the managed cluster to report the target version
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get managedclusterinfo {{ ocp_cluster.name }} -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.distributionInfo.ocp.version}'
  register: _spoke_final_version
  until: _spoke_final_version.stdout == (openshift_version ~ '.' ~ ocp_patch_version)
  retries: "{{ update_ocp_spoke_poll_retries }}"
  delay: "{{ update_ocp_spoke_poll_delay }}"
  changed_when: false

# Restore the override and re-scale insights-operator back to 0, same
# reasoning as update_ocp_hub's equivalent steps.
- name: Restore the insights-operator override on the spoke after the minor version upgrade
  ansible.builtin.shell: |
    set -e
    KCFG="{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig"
    CURRENT=$({{ bin_dir }}/oc get clusterversion version --kubeconfig "$KCFG" -o json)
    UPDATED=$(echo "$CURRENT" | jq -c \
      '.spec.overrides = ((.spec.overrides // []) + [{
        "kind": "Deployment",
        "group": "apps",
        "name": "insights-operator",
        "namespace": "openshift-insights",
        "unmanaged": true
      }])')
    echo "$UPDATED" | {{ bin_dir }}/oc apply --kubeconfig "$KCFG" -f -
  args:
    executable: /bin/bash
  changed_when: true
  when: _spoke_insights_override_removed is changed

- name: Re-scale the Insights Operator Deployment to zero on the spoke after the upgrade
  ansible.builtin.shell: >
    {{ bin_dir }}/oc scale deployment insights-operator
    -n openshift-insights
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    --replicas=0
  register: _spoke_insights_rescale
  changed_when: "'scaled' in _spoke_insights_rescale.stdout"
  failed_when: false
  when: _spoke_insights_override_removed is changed

- name: Display spoke update summary
  ansible.builtin.debug:
    msg:
      - "Spoke {{ ocp_cluster.name }} OpenShift update complete"
      - "Target version: {{ openshift_version }}.{{ ocp_patch_version }}"
