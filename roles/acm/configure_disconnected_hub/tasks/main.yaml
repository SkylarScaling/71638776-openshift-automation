---
- name: Create ClusterImageSet pointing to mirrored release
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'cluster-image-set.yaml.j2') }}"
  changed_when: true

- name: Verify ClusterImageSet was created
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterimageset img{{ openshift_version }}.{{ ocp_patch_version }}-x86-64-appsub
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _cis_check
  changed_when: false
  until: _cis_check.stdout != ""
  retries: 5
  delay: 5

# Hive provisioner pods pull the installer image from the mirror registry.
# Without trusting the mirror CA here, the pull fails silently and Hive reports
# "Cluster install failed but installer log was not captured" (UnknownError).
- name: Create mirror registry CA Secret for Hive (hive namespace)
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: mirror-registry-ca
        namespace: hive
      data:
        ca.crt: "{{ mirror_registry_ca_bundle | b64encode }}"
  changed_when: true
  no_log: true

- name: Patch HiveConfig to trust mirror registry CA
  ansible.builtin.shell: >
    {{ bin_dir }}/oc patch hiveconfig hive
    --kubeconfig {{ target_kubeconfig }}
    --type=merge
    -p '{"spec":{"additionalCertificateAuthorities":[{"name":"mirror-registry-ca"}]}}'
  changed_when: true

- name: Display disconnected hub configuration summary
  ansible.builtin.debug:
    msg:
      - "Disconnected hub configuration complete"
      - "ClusterImageSet: img{{ openshift_version }}.{{ ocp_patch_version }}-x86-64-appsub"
      - "Release image: {{ mirror_registry_url }}/{{ mirror_base_path }}/openshift-release-dev/ocp-release:{{ openshift_version }}.{{ ocp_patch_version }}-x86_64"
