---
- name: Wait for ACM CRDs to be fully registered by the Operator
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get crd managedclustersetbindings.cluster.open-cluster-management.io
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _crd_check
  changed_when: false
  until: _crd_check.stdout != ""
  retries: 60  # Wait up to 10 minutes (60 * 10s)
  delay: 10

- name: Deploy Argo CD Installation Policy to Regional Hub
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'argocd-policy.yaml.j2') }}"
  changed_when: true
