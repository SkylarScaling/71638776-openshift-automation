---
# DYNAMICALLY DISCOVER CLUSTER IMAGE SET
- name: Query Hub for available ClusterImageSets
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterimageset
    --kubeconfig {{ target_kubeconfig }}
    -o json 2>/dev/null || echo '{"items":[]}'
  register: _image_sets_raw
  changed_when: false

- name: Dynamically set the ClusterImageSet fact based on inventory version
  ansible.builtin.set_fact:
    spoke_clusterimageset_name: >-
      {{
        (_image_sets_raw.stdout | from_json)['items'] |
        selectattr('metadata.name', 'search', openshift_version ~ '.' ~ ocp_patch_version) |
        map(attribute='metadata.name') |
        first | default('')
      }}

- name: Verify that a matching ClusterImageSet was found
  ansible.builtin.assert:
    that:
      - spoke_clusterimageset_name != ""
    fail_msg: >
      Could not find a ClusterImageSet on the Hub matching version {{ openshift_version }}.{{ ocp_patch_version }}.
      Ensure the configure_disconnected_hub role has been run to create the mirrored ClusterImageSet.

- name: Ensure target ManagedClusterSet exists on the Hub
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', '00-managed-clusterset.yaml.j2') }}"
  changed_when: true

- name: Create ManagedCluster object
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', '01-managed-cluster.yaml.j2') }}"
  changed_when: true

- name: Create Spoke Cluster Namespace
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', '02-namespace.yaml.j2') }}"
  changed_when: true

- name: Create Required Secrets (AWS Creds, Pull Secret, Install-Config with Disconnected Settings)
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', '03-secrets.yaml.j2') }}"
  changed_when: true
  no_log: true

# See roles/acm/create_manual_cloud_credentials_configmap for why this is
# needed: the Cluster VPC has no route to iam.amazonaws.com, so CCO mint mode
# can never succeed here, same as the hub.
- name: Pre-create Manual-mode cloud credential manifestsConfigMap
  ansible.builtin.include_role:
    name: acm/create_manual_cloud_credentials_configmap
  when: disconnected.network_lockdown.enabled | default(true)

# The install pod's HTTP_PROXY/HTTPS_PROXY env vars (below) apply to every
# outbound call it makes, not just AWS API calls — including its own
# in-cluster Kubernetes API calls (hiveutil install-manager talks to the hub
# apiserver by service-network IP before it ever touches AWS). Without the
# hub's actual service/cluster network CIDRs in NO_PROXY, squid denies that
# first call with a 403 and the install pod dies before setting infraID
# (confirmed live — hardcoding a guessed CIDR here previously broke this).
- name: Discover hub service/cluster network CIDRs for NO_PROXY scoping (network lockdown)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get network.config cluster
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.spec.serviceNetwork[*]} {.spec.clusterNetwork[*].cidr}'
  register: _hub_network_cidrs
  changed_when: false
  when: disconnected.network_lockdown.enabled | default(true)

# NO_PROXY CIDR entries only match when the request host is a literal IP —
# Go's proxy matcher (golang.org/x/net/http/httpproxy) never resolves
# hostnames against a CIDR. The installer polls the spoke's own API by name
# (api.<cluster>.<base_domain>:6443), so the Cluster VPC CIDR above does NOT
# cover it: squid denies the CONNECT with a 403 (hostname isn't in its
# .amazonaws.com allowlist either), and the install fails KubeAPIWaitFailed
# after a 20m wait even though the cluster bootstrapped fine (confirmed
# live — worker nodes existed, created by the in-cluster machine-api, minutes
# after the installer had already given up blind). A single domain-suffix
# entry for the spoke's own domain covers api., api-int., and *.apps. together.
- name: Set spoke installer NO_PROXY fact (network lockdown)
  ansible.builtin.set_fact:
    spoke_installer_no_proxy: >-
      {{ ([disconnected.network_lockdown.vpc_cidr | default('10.90.0.0/16'), jumphost_private_ip]
          + _hub_network_cidrs.stdout.split()
          + ['.' ~ ocp_cluster.name ~ '.' ~ base_domain,
             '.svc', '.cluster.local', 'localhost', '127.0.0.1', '169.254.169.254'])
         | select('ne', '') | join(',') }}
  when: disconnected.network_lockdown.enabled | default(true)

# installAttemptsLimit: 1 means Hive sets ProvisionStopped=True after the single
# attempt fails. oc apply leaves the ClusterDeployment in-place on re-runs, so
# Hive sees the limit already exhausted and never creates a new ClusterProvision.
# Delete the stopped ClusterDeployment before applying so Hive starts fresh.
- name: Check if ClusterDeployment is already ProvisionStopped
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterdeployment {{ ocp_cluster.name }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="ProvisionStopped")].status}|{.spec.clusterMetadata.infraID}'
    2>/dev/null || true
  register: _cd_stopped_check
  changed_when: false

# Hive's AWS deprovision runs in-process inside hive-controllers (no separate
# pod), which — under lockdown — has no more route to IAM/EC2/Route53 than
# anything else on a hub node. `oc delete` would hang indefinitely waiting on
# the finalizer while hive-controllers' cleanup call times out.
#
# Clean up the real AWS resources ourselves first (from the jumphost, which
# has actual AWS access), then set preserveOnDelete (a mutable field) so
# Hive drops the finalizer without attempting its own cleanup. Skipping the
# cleanup step entirely (relying on preserveOnDelete alone) was tried and
# caused a real incident: a leaked private hosted zone from one failed
# attempt made every subsequent attempt fail with "ConflictingDomainExists"
# for over a day before it was noticed, while the leaked EC2
# instances/load balancer kept running. (Giving hive-controllers itself a
# proxied path instead was considered and rejected: HTTP_PROXY/HTTPS_PROXY
# env vars would apply to ALL of its outbound calls, including to the
# Kubernetes API server, and getting NO_PROXY scoped safely enough to not
# break that is far riskier than running this cleanup ourselves.)
- name: Clean up orphaned AWS resources from the stopped attempt (network lockdown)
  ansible.builtin.include_role:
    name: aws/cleanup_orphaned_cluster_resources
  vars:
    _cleanup_infra_id: "{{ _cd_stopped_check.stdout.split('|')[1] | default('') | trim }}"
    _cleanup_cluster_name: "{{ ocp_cluster.name }}"
  when:
    - (_cd_stopped_check.stdout.split('|')[0] | default('')) == "True"
    - disconnected.network_lockdown.enabled | default(true)
    - (_cd_stopped_check.stdout.split('|')[1] | default('') | trim) != ''

- name: Set preserveOnDelete on stopped ClusterDeployment (network lockdown — avoid a hung deprovision)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc patch clusterdeployment {{ ocp_cluster.name }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    --type=merge -p '{"spec":{"preserveOnDelete":true}}'
  changed_when: true
  when:
    - (_cd_stopped_check.stdout.split('|')[0] | default('')) == "True"
    - disconnected.network_lockdown.enabled | default(true)

- name: Delete stopped ClusterDeployment so Hive can provision fresh
  ansible.builtin.shell: >
    {{ bin_dir }}/oc delete clusterdeployment {{ ocp_cluster.name }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    --wait=true --timeout=5m
  changed_when: true
  when: (_cd_stopped_check.stdout.split('|')[0] | default('')) == "True"

- name: Create ClusterDeployment object
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', '04-cluster-deployment.yaml.j2') }}"
  register: _cd_apply
  changed_when: _cd_apply.rc == 0
  failed_when: false

# Most of ClusterDeployment.spec is immutable after creation (e.g.
# Provisioning.InstallerEnv, added by this playbook's AWS-API-proxy fix) —
# `oc apply` against a pre-existing object created before that field existed
# is rejected by Hive's admission webhook. Safe to delete and recreate only
# if the cluster never finished installing; refuse if it did, since deleting
# an Installed ClusterDeployment triggers Hive to deprovision the real cluster.
- name: Recover from an immutable ClusterDeployment.spec rejection
  when:
    - _cd_apply.rc != 0
    - "'is immutable' in _cd_apply.stderr"
  block:
    - name: Check whether the existing ClusterDeployment already finished installing
      ansible.builtin.shell: >
        {{ bin_dir }}/oc get clusterdeployment {{ ocp_cluster.name }}
        -n {{ ocp_cluster.name }}
        --kubeconfig {{ target_kubeconfig }}
        -o jsonpath='{.status.installed}|{.spec.clusterMetadata.infraID}' 2>/dev/null || true
      register: _cd_installed_check
      changed_when: false

    - name: Fail rather than delete an already-installed ClusterDeployment
      ansible.builtin.fail:
        msg: >-
          ClusterDeployment {{ ocp_cluster.name }} rejected an immutable spec
          change, but status.installed=true — refusing to delete/recreate a
          cluster that already finished installing. Resolve the desired spec
          change manually (e.g. patch a supported field, or deliberately
          delete the ClusterDeployment yourself if a rebuild is intended).
      when: (_cd_installed_check.stdout.split('|')[0] | trim) == 'true'

    # See the matching comment on the ProvisionStopped path above — cleaning
    # up for real, rather than relying on preserveOnDelete alone, is what
    # prevents a leaked private hosted zone from blocking every future
    # attempt with ConflictingDomainExists.
    - name: Clean up orphaned AWS resources before recreating (network lockdown)
      ansible.builtin.include_role:
        name: aws/cleanup_orphaned_cluster_resources
      vars:
        _cleanup_infra_id: "{{ _cd_installed_check.stdout.split('|')[1] | default('') | trim }}"
        _cleanup_cluster_name: "{{ ocp_cluster.name }}"
      when:
        - disconnected.network_lockdown.enabled | default(true)
        - (_cd_installed_check.stdout.split('|')[1] | default('') | trim) != ''

    - name: Set preserveOnDelete on the not-yet-installed ClusterDeployment (network lockdown — avoid a hung deprovision)
      ansible.builtin.shell: >
        {{ bin_dir }}/oc patch clusterdeployment {{ ocp_cluster.name }}
        -n {{ ocp_cluster.name }}
        --kubeconfig {{ target_kubeconfig }}
        --type=merge -p '{"spec":{"preserveOnDelete":true}}'
      changed_when: true
      when: disconnected.network_lockdown.enabled | default(true)

    - name: Delete the not-yet-installed ClusterDeployment so the new spec can apply
      ansible.builtin.shell: >
        {{ bin_dir }}/oc delete clusterdeployment {{ ocp_cluster.name }}
        -n {{ ocp_cluster.name }}
        --kubeconfig {{ target_kubeconfig }}
        --wait=true --timeout=5m
      changed_when: true

    - name: Re-apply the ClusterDeployment object
      ansible.builtin.shell:
        cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
        stdin: "{{ lookup('template', '04-cluster-deployment.yaml.j2') }}"
      changed_when: true

- name: Fail if ClusterDeployment apply failed for an unrelated reason
  ansible.builtin.fail:
    msg: "{{ _cd_apply.stderr }}"
  when:
    - _cd_apply.rc != 0
    - "'is immutable' not in _cd_apply.stderr"

- name: Create MachinePool object for Worker Nodes
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', '05-machine-pool.yaml.j2') }}"
  changed_when: true

- name: Wait for ClusterDeployment to start provisioning
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterdeployment {{ ocp_cluster.name }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.provisionRef.name}' 2>/dev/null || true
  register: _cd_provision_ref
  changed_when: false
  until: _cd_provision_ref.stdout != ""
  retries: 60
  delay: 10
  # ignore_errors so the diagnostics block below runs on exhaustion
  ignore_errors: true

- name: Collect diagnostics when Hive never started provisioning
  when: _cd_provision_ref.stdout == ""
  block:
    - name: Show ClusterDeployment conditions (why Hive might not start)
      ansible.builtin.shell: >
        {{ bin_dir }}/oc get clusterdeployment {{ ocp_cluster.name }}
        -n {{ ocp_cluster.name }}
        --kubeconfig {{ target_kubeconfig }}
        -o jsonpath='{range .status.conditions[*]}{.type}={.status} ({.reason}): {.message}{"\n"}{end}'
        2>/dev/null || echo "(ClusterDeployment not found)"
      register: _cd_no_prov_conditions
      changed_when: false

    - name: Display ClusterDeployment conditions
      ansible.builtin.debug:
        msg: "{{ _cd_no_prov_conditions.stdout_lines }}"

    - name: Show hive-controllers pod status
      ansible.builtin.shell: >
        {{ bin_dir }}/oc get pods -n hive
        --kubeconfig {{ target_kubeconfig }}
        -l app=hive-controllers
        -o wide 2>/dev/null || true
      register: _hive_ctrl_pods
      changed_when: false

    - name: Display hive-controllers pod status
      ansible.builtin.debug:
        msg: "{{ _hive_ctrl_pods.stdout_lines }}"

    - name: Show recent hive-controllers logs
      ansible.builtin.shell: >
        {{ bin_dir }}/oc logs -n hive
        --kubeconfig {{ target_kubeconfig }}
        -l app=hive-controllers
        --tail=50 2>/dev/null | grep -i "error\|warn\|clusterdeployment\|provision" || echo "(no relevant logs)"
      register: _hive_ctrl_logs
      changed_when: false
      failed_when: false

    - name: Display hive-controllers logs
      ansible.builtin.debug:
        msg: "{{ _hive_ctrl_logs.stdout_lines }}"

    # InstallImagesNotResolved=True means Hive's own imageset job (which
    # resolves the ClusterImageSet's releaseImage before a ClusterProvision
    # can even be created) failed or hung — usually a bad/unmirrored
    # releaseImage pull spec, not a hive-controllers/validation problem. Call
    # it out explicitly: the generic failure message below sends people
    # looking at hive-controllers and ClusterDeployment validation instead.
    - name: Surface imageset job pod details if image resolution failed
      when: "'InstallImagesNotResolved=True' in _cd_no_prov_conditions.stdout"
      block:
        - name: Show imageset job pod events
          ansible.builtin.shell: >
            {{ bin_dir }}/oc get pods -n {{ ocp_cluster.name }}
            --kubeconfig {{ target_kubeconfig }}
            -l hive.openshift.io/imageset=true
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
            | xargs -I{} {{ bin_dir }}/oc describe pod {} -n {{ ocp_cluster.name }} --kubeconfig {{ target_kubeconfig }}
            2>/dev/null || true
          register: _imageset_pod_details
          changed_when: false

        - name: Display imageset job pod details
          ansible.builtin.debug:
            msg: "{{ _imageset_pod_details.stdout_lines }}"

        - name: Fail — releaseImage could not be resolved for {{ ocp_cluster.name }}
          ansible.builtin.fail:
            msg: >-
              Hive's imageset job failed to pull/resolve the ClusterImageSet's
              releaseImage (InstallImagesNotResolved=True) — see pod details
              above, usually an ImagePullBackOff with a "repository not found"
              or auth error. This means the releaseImage pull spec on the
              ClusterImageSet doesn't match what's actually in the mirror
              registry (check roles/acm/configure_disconnected_hub's
              ClusterImageSet template against oc-mirror's generated
              idms-oc-mirror.yaml), not a hive-controllers or validation issue.

    - name: Fail — Hive never started provisioning for {{ ocp_cluster.name }}
      ansible.builtin.fail:
        msg: >-
          hive-controllers did not create a ClusterProvision for {{ ocp_cluster.name }}
          within 10 minutes. Check ClusterDeployment conditions and hive-controllers
          pod status above. Common causes: hive-controllers pod not running,
          ClusterDeployment validation error, or installAttemptsLimit already reached
          from a previous failed run (delete and recreate the ClusterDeployment).

# Same NoZones problem as the hub (see aws/create_apps_wildcard_dns_record):
# the in-cluster ingress operator has no path to Route53 from the isolated
# Cluster VPC, so it can never create *.apps itself, and Hive's install never
# reaches Provisioned=True while ingress stays unavailable waiting on it. The
# IngressController-Unmanaged manifest (packaged into the same manifestsConfigMap
# as the Manual-mode credential Secrets, above) stops it from trying; this
# creates the record instead — from the jumphost, which has real AWS access.
#
# aws/create_apps_wildcard_dns_record normally discovers the infra ID via
# `oc get infrastructure` against the target cluster itself, but the jumphost
# has no route to the spoke's API yet at this point (that SG ingress rule is
# only opened post-install, by the playbook, once the spoke's kubeconfig is
# extracted — too late here). Hive sets status.infraID on the ClusterDeployment
# directly, readable from the Hub (already reachable), as soon as infrastructure
# exists — well before Provisioned=True — so get it from there instead and
# hand it off the same way the hub does (a synthetic metadata.json; the role
# only ever reads the .infraID key out of it).
#
# It lives at spec.clusterMetadata.infraID, not status.infraID — confirmed
# against the ClusterDeployment CRD schema (the only infraID field in it) and
# its own additionalPrinterColumns; status.infraID doesn't exist on this
# object at all, so the old path could never have succeeded regardless of
# how long it polled.
#
# Under network lockdown, Hive tears down and recreates ALL AWS
# infrastructure for each retry attempt (installAttemptsLimit, see
# 04-cluster-deployment.yaml.j2) — a new infra ID, a new private hosted zone,
# and a new *.apps load balancer every time. Doing the infra-ID wait / PHZ
# association / wildcard-DNS steps only once, before a single long wait for
# the final outcome, left every retry after the first with no *.apps record
# and no jumphost-VPC zone association at all — structurally doomed
# regardless of why the first attempt failed (confirmed live: a fresh hosted
# zone appeared for attempt 2 with no corresponding DNS work ever done for
# it).
#
# An earlier version of this loop was keyed on "one iteration per Hive
# attempt", using ProvisionFailed=True to decide an attempt was over and move
# to the next one. That reintroduced exactly the race the original single-task
# comment below already warned about: ProvisionFailed=True lingers from the
# attempt that just ended until Hive resets it once the NEXT attempt starts,
# so the loop advanced to "attempt N+1" instantly, before attempt N+1 (or even
# the real attempt N) had done anything — confirmed live: the loop reached its
# spare iteration still looking at the SAME infra ID an earlier iteration had
# already handled, with ProvisionStopped still False (Hive genuinely still
# mid-attempt), and timed out waiting for a change that was never coming that
# soon.
#
# Poll on a fixed interval instead: every cycle, read infra ID and conditions
# together in one call. The infra ID is a fact Hive sets once per attempt's
# AWS infrastructure (not a racy status condition) — redo PHZ/DNS whenever it
# changes from the last one we handled, independent of what the conditions
# say. Stop once Provisioned=True or ProvisionStopped=True appears.
- name: Ensure local working directory exists for the spoke
  ansible.builtin.file:
    path: "{{ install_dir }}/{{ ocp_cluster.name }}"
    state: directory
    mode: '0755'
  when: disconnected.network_lockdown.enabled | default(true)

- name: Initialize provisioning poll tracking facts
  ansible.builtin.set_fact:
    _spoke_last_infra_id: ''
    _spoke_install_done: false
  when: disconnected.network_lockdown.enabled | default(true)

- name: Poll Hive provisioning until it finishes, redoing DNS whenever the infra ID changes
  ansible.builtin.include_tasks: wait_and_configure_spoke_attempt.yml
  loop: "{{ range(0, spoke_provision_poll_max_iterations) | list }}"
  loop_control:
    loop_var: _spoke_poll_iteration
    label: "poll {{ _spoke_poll_iteration }}"
  when: disconnected.network_lockdown.enabled | default(true)

- name: Fail if provisioning never reached a terminal state within the time budget
  ansible.builtin.fail:
    msg: >-
      ClusterDeployment {{ ocp_cluster.name }} never reached Provisioned or
      ProvisionStopped after {{ spoke_provision_poll_max_iterations }} polls
      ({{ (spoke_provision_poll_max_iterations * spoke_provision_poll_interval / 60) | round(1) }}
      minutes). Check `oc get clusterdeployment -n {{ ocp_cluster.name }}` manually.
  when:
    - disconnected.network_lockdown.enabled | default(true)
    - not (_spoke_install_done | default(false))

- name: Wait for OpenShift cluster installation to complete or fail (Takes 35-45+ minutes) [non-lockdown]
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterdeployment {{ ocp_cluster.name }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}' 2>/dev/null || true
  register: _cd_conditions
  changed_when: false
  # ProvisionFailed=True is per-attempt and gets reset when a retry starts — using it
  # as the exit condition causes a race: Ansible exits between attempt N failing and
  # Hive resetting the condition before attempt N+1 starts.
  # ProvisionStopped=True is only set after all retry attempts are exhausted (or
  # installAttemptsLimit is reached), making it the correct final-failure signal.
  until: >
    ('Provisioned=True' in _cd_conditions.stdout) or
    ('ProvisionStopped=True' in _cd_conditions.stdout)
  retries: 90
  delay: 60
  when: not (disconnected.network_lockdown.enabled | default(true))

- name: Get provisioning failure details
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterdeployment {{ ocp_cluster.name }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='Reason: {.status.conditions[?(@.type=="ProvisionFailed")].reason}{"\nMessage: "}{.status.conditions[?(@.type=="ProvisionFailed")].message}'
    2>/dev/null || true
  register: _cd_fail_details
  changed_when: false
  when: "'ProvisionStopped=True' in _cd_conditions.stdout"

- name: Collect ClusterProvision object details
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterprovision
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{range .items[*]}name={.metadata.name} stage={.spec.stage} attempt={.spec.attempt}{"\n"}conditions={range .status.conditions[*]}{.type}={.status}({.reason}): {.message}{"\n"}{end}installLog={.spec.installLog}{"\n\n"}{end}'
    2>/dev/null || true
  register: _cp_details
  changed_when: false
  when: "'ProvisionStopped=True' in _cd_conditions.stdout"

- name: Display ClusterProvision details
  ansible.builtin.debug:
    msg: "{{ _cp_details.stdout_lines }}"
  when:
    - "'ProvisionStopped=True' in _cd_conditions.stdout"
    - _cp_details.stdout | default('') != ''

- name: Collect provisioner Job status (persists after pods are deleted)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get job
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -l hive.openshift.io/cluster-deployment-name={{ ocp_cluster.name }}
    -o jsonpath='{range .items[-1:]}{.metadata.name}: active={.status.active} succeeded={.status.succeeded} failed={.status.failed}
    image={.spec.template.spec.initContainers[0].image}{"\n"}{end}'
    2>/dev/null || echo "(no provisioner Job found)"
  register: _prov_job
  changed_when: false
  when: "'ProvisionStopped=True' in _cd_conditions.stdout"

- name: Display provisioner Job status
  ansible.builtin.debug:
    msg: "{{ _prov_job.stdout_lines }}"
  when:
    - "'ProvisionStopped=True' in _cd_conditions.stdout"
    - _prov_job.stdout | default('') != ''

- name: Get provisioner pod name for failed ClusterProvision
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get pod
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -l hive.openshift.io/cluster-deployment-name={{ ocp_cluster.name }}
    -o jsonpath='{.items[-1:].metadata.name}' 2>/dev/null || true
  register: _prov_pod_name
  changed_when: false
  when: "'ProvisionStopped=True' in _cd_conditions.stdout"

- name: Collect provisioner pod logs
  ansible.builtin.shell: >
    {{ bin_dir }}/oc logs {{ _prov_pod_name.stdout }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    --all-containers --tail=100 2>&1 || true
  register: _prov_pod_logs
  changed_when: false
  when:
    - "'ProvisionStopped=True' in _cd_conditions.stdout"
    - _prov_pod_name.stdout | default('') != ''

- name: Display provisioner pod logs
  ansible.builtin.debug:
    msg: "{{ _prov_pod_logs.stdout_lines | default(['(no logs)']) }}"
  when:
    - "'ProvisionStopped=True' in _cd_conditions.stdout"
    - _prov_pod_name.stdout | default('') != ''

- name: Collect provisioner pod events
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get events
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    --sort-by='.lastTimestamp'
    --field-selector "involvedObject.name={{ _prov_pod_name.stdout }}"
    2>/dev/null | tail -20 || true
  register: _prov_pod_events
  changed_when: false
  when:
    - "'ProvisionStopped=True' in _cd_conditions.stdout"
    - _prov_pod_name.stdout | default('') != ''

- name: Display provisioner pod events
  ansible.builtin.debug:
    msg: "{{ _prov_pod_events.stdout_lines | default(['(no events)']) }}"
  when:
    - "'ProvisionStopped=True' in _cd_conditions.stdout"
    - _prov_pod_name.stdout | default('') != ''

- name: Fail immediately if provisioning errored out
  ansible.builtin.fail:
    msg: "Provisioning for {{ ocp_cluster.name }} failed!\n{{ _cd_fail_details.stdout | default('No details available.') }}"
  when: "'ProvisionStopped=True' in _cd_conditions.stdout"

- name: Ensure Observability Namespace exists on the Spoke via ManifestWork
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: work.open-cluster-management.io/v1
      kind: ManifestWork
      metadata:
        name: "{{ ocp_cluster.name }}-observability-namespace"
        namespace: "{{ ocp_cluster.name }}"
      spec:
        workload:
          manifests:
            - apiVersion: v1
              kind: Namespace
              metadata:
                name: open-cluster-management-observability
  changed_when: true

- name: Push disconnected CatalogSource and OperatorHub config to Spoke via ManifestWork
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: work.open-cluster-management.io/v1
      kind: ManifestWork
      metadata:
        name: "{{ ocp_cluster.name }}-disconnected-config"
        namespace: "{{ ocp_cluster.name }}"
      spec:
        workload:
          manifests:
            - apiVersion: config.openshift.io/v1
              kind: OperatorHub
              metadata:
                name: cluster
              spec:
                disableAllDefaultSources: true
            - apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                name: redhat-operators
                namespace: openshift-marketplace
              spec:
                sourceType: grpc
                image: "{{ mirror_registry_url }}/{{ mirror_base_path }}/redhat/redhat-operator-index:v{{ openshift_version }}"
                displayName: "Red Hat Operators (Mirrored)"
                publisher: "Red Hat (Mirrored)"
                updateStrategy:
                  registryPoll:
                    interval: 30m
  changed_when: true

- name: Report successful provisioning
  ansible.builtin.debug:
    msg: "Cluster {{ ocp_cluster.name }} has been successfully provisioned by ACM (disconnected)!"
