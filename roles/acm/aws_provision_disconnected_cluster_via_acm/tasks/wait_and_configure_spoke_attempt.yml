---
# One invocation = one poll cycle (not one Hive attempt — see the comment on
# the including task for why attempt-keyed looping was tried and abandoned).
# Looped from main.yaml on a fixed interval until a terminal ClusterDeployment
# condition appears. Every task below is a no-op once _spoke_install_done is
# set, so later iterations fall straight through without doing any work.

- name: "Poll {{ _spoke_poll_iteration }}: read the ClusterDeployment's current infra ID and conditions"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterdeployment {{ ocp_cluster.name }}
    -n {{ ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.spec.clusterMetadata.infraID}|{range .status.conditions[*]}{.type}={.status} {end}'
    2>/dev/null || true
  register: _spoke_poll
  changed_when: false
  when: not (_spoke_install_done | default(false))

- name: "Poll {{ _spoke_poll_iteration }}: set current infra ID and conditions facts"
  ansible.builtin.set_fact:
    _spoke_current_infra_id: "{{ _spoke_poll.stdout.split('|')[0] | default('') | trim }}"
    _cd_conditions: {"stdout": "{{ _spoke_poll.stdout.split('|')[1] | default('') | trim }}"}
  when: not (_spoke_install_done | default(false))

- name: "Poll {{ _spoke_poll_iteration }}: associate the new infra ID's private DNS zone with the jumphost VPC"
  ansible.builtin.include_role:
    name: aws/associate_private_zone_with_jumphost
  vars:
    private_zone_domain: "{{ ocp_cluster.name }}.{{ base_domain }}"
    _pz_infra_id: "{{ _spoke_current_infra_id }}"
  when:
    - not (_spoke_install_done | default(false))
    - _spoke_current_infra_id != ''
    - _spoke_current_infra_id != _spoke_last_infra_id

- name: "Poll {{ _spoke_poll_iteration }}: write synthetic metadata.json carrying the new infra ID"
  ansible.builtin.copy:
    dest: "{{ install_dir }}/{{ ocp_cluster.name }}/metadata-infraid-only.json"
    mode: '0644'
    content: "{{ {'infraID': _spoke_current_infra_id} | to_json }}"
  when:
    - not (_spoke_install_done | default(false))
    - _spoke_current_infra_id != ''
    - _spoke_current_infra_id != _spoke_last_infra_id

- name: "Poll {{ _spoke_poll_iteration }}: create the new infra ID's *.apps wildcard DNS record"
  ansible.builtin.include_role:
    name: aws/create_apps_wildcard_dns_record
  vars:
    _metadata_json_path: "{{ install_dir }}/{{ ocp_cluster.name }}/metadata-infraid-only.json"
    _awd_clusterdeployment_kubeconfig: "{{ target_kubeconfig }}"
    _awd_clusterdeployment_name: "{{ ocp_cluster.name }}"
    _awd_clusterdeployment_namespace: "{{ ocp_cluster.name }}"
  when:
    - not (_spoke_install_done | default(false))
    - _spoke_current_infra_id != ''
    - _spoke_current_infra_id != _spoke_last_infra_id

- name: "Poll {{ _spoke_poll_iteration }}: remember this infra ID as handled"
  ansible.builtin.set_fact:
    _spoke_last_infra_id: "{{ _spoke_current_infra_id }}"
  when:
    - not (_spoke_install_done | default(false))
    - _spoke_current_infra_id != ''
    - _spoke_current_infra_id != _spoke_last_infra_id

- name: "Poll {{ _spoke_poll_iteration }}: mark provisioning complete once a terminal condition appears"
  ansible.builtin.set_fact:
    _spoke_install_done: true
  when:
    - not (_spoke_install_done | default(false))
    - "('Provisioned=True' in _cd_conditions.stdout) or ('ProvisionStopped=True' in _cd_conditions.stdout)"

- name: "Poll {{ _spoke_poll_iteration }}: pause before the next poll"
  ansible.builtin.wait_for:
    timeout: "{{ spoke_provision_poll_interval }}"
  when: not (_spoke_install_done | default(false))
