---
# ==============================================================================
# LOCKDOWN CLUSTER SECURITY GROUPS
#
# The installer always creates node security groups with a broad 0.0.0.0/0,
# all-protocols egress rule. This revokes that and replaces it with egress
# scoped to the Cluster VPC (east-west + VPC endpoints) and, while
# network_lockdown_allow_jumphost_egress is true, the jumphost VPC (mirror
# registry/LDAP during install). Idempotent — safe to re-run in either mode;
# re-running with allow_jumphost_egress: false is how migrate_mirror finally
# cuts the clusters off from the jumphost entirely.
#
# Runs against target_kubeconfig to discover the cluster's infrastructure
# name, which every AWS resource the installer created is tagged with
# (kubernetes.io/cluster/<infraName>), regardless of whether the cluster was
# provisioned via IPI or Hive/ACM.
# ==============================================================================

- name: Ensure AWS CLI is available
  ansible.builtin.include_role:
    name: aws/ensure_aws_cli

- name: Set AWS environment for all tasks
  ansible.builtin.set_fact:
    _aws_env:
      AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
      AWS_SESSION_TOKEN: ""

- name: Get cluster infrastructure name
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get infrastructure cluster
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.infrastructureName}'
  register: _nl_infra_name
  changed_when: false

- name: Find the Cluster VPC CIDR
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-vpcs
    --filters Name=tag:Name,Values={{ network_lockdown_vpc_name }}
    --query 'Vpcs[0].CidrBlock'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_cluster_vpc_cidr
  changed_when: false

- name: Find the jumphost VPC CIDR
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-vpcs
    --filters Name=tag:Name,Values={{ jumphost_name | default('disconnected-jumphost') }}-vpc
    --query 'Vpcs[0].CidrBlock'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_jumphost_vpc_cidr
  changed_when: false

- name: Find security groups tagged by the installer (load balancers, etc.)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-security-groups
    --filters Name=tag-key,Values=kubernetes.io/cluster/{{ _nl_infra_name.stdout | trim }}
    --query 'SecurityGroups[].GroupId'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_cluster_sgs_k8s
  changed_when: false

# CAPA (cluster-api-provider-aws) tags node security groups with this key
# instead of kubernetes.io/cluster/<infra> -- the installer's own
# kubernetes.io/cluster tag only ever lands on load-balancer SGs it creates
# directly. Confirmed live: filtering on kubernetes.io/cluster alone silently
# missed every node SG (acm-hub-*-node, managed-cluster-1-*-node), leaving
# their default 0.0.0.0/0 egress untouched while verify_network_isolation
# still reported success (its curl-based check passed for the wrong reason --
# no route to the internet, not no permission).
- name: Find node security groups tagged by cluster-api-provider-aws
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-security-groups
    --filters Name=tag-key,Values=sigs.k8s.io/cluster-api-provider-aws/cluster/{{ _nl_infra_name.stdout | trim }}
    --query 'SecurityGroups[].GroupId'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_cluster_sgs_capa
  changed_when: false

- name: Combine and de-duplicate discovered security group IDs
  ansible.builtin.set_fact:
    _nl_cluster_sgs_list: "{{ (_nl_cluster_sgs_k8s.stdout.split() + _nl_cluster_sgs_capa.stdout.split()) | unique }}"

- name: Fail if no cluster-tagged security groups were found
  ansible.builtin.fail:
    msg: >-
      No security groups tagged kubernetes.io/cluster/{{ _nl_infra_name.stdout | trim }}
      or sigs.k8s.io/cluster-api-provider-aws/cluster/{{ _nl_infra_name.stdout | trim }}
      were found — nothing to lock down.
  when: _nl_cluster_sgs_list | length == 0

- name: Revoke the installer's default all-traffic egress-to-anywhere rule
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 revoke-security-group-egress
    --group-id {{ item }}
    --ip-permissions '[{"IpProtocol":"-1","IpRanges":[{"CidrIp":"0.0.0.0/0"}]}]'
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  loop: "{{ _nl_cluster_sgs_list }}"
  register: _nl_revoke_default
  failed_when:
    - _nl_revoke_default.rc != 0
    - "'InvalidPermission.NotFound' not in _nl_revoke_default.stderr"
  changed_when: _nl_revoke_default.rc == 0

- name: Allow egress to the Cluster VPC (east-west + VPC endpoints)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 authorize-security-group-egress
    --group-id {{ item }}
    --ip-permissions '[{"IpProtocol":"-1","IpRanges":[{"CidrIp":"{{ _nl_cluster_vpc_cidr.stdout | trim }}"}]}]'
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  loop: "{{ _nl_cluster_sgs_list }}"
  register: _nl_allow_cluster_cidr
  failed_when:
    - _nl_allow_cluster_cidr.rc != 0
    - "'InvalidPermission.Duplicate' not in _nl_allow_cluster_cidr.stderr"
  changed_when: _nl_allow_cluster_cidr.rc == 0

# The Cluster VPC CIDR allow-rule above covers east-west traffic and
# INTERFACE-type VPC endpoints (their ENIs sit inside that CIDR), but not
# GATEWAY-type endpoints like S3's: traffic to an S3 gateway endpoint still
# leaves the node addressed to S3's public IPv4 ranges (the route table
# just redirects it off-box to the endpoint instead of to an Internet
# Gateway) -- so a security group scoped only to the VPC CIDR silently drops
# it. Confirmed live: Quay's quay-app/quay-mirror pods and the OpenShift
# internal image registry (both S3-backed) crashlooped identically with
# "context deadline exceeded" HEAD-ing their bucket the moment this lockdown
# ran, even though create_vpc_endpoints' S3 gateway endpoint and its route
# table association were both healthy -- it's an SG problem, not a routing
# problem. Must be unconditional (not gated on network_lockdown_allow_jumphost_egress):
# Quay is the PERMANENT mirror registry and the image registry needs S3
# forever, not just during install.
- name: Resolve the regional S3 managed prefix list (never hardcode -- it's region-specific)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-prefix-lists
    --filters Name=prefix-list-name,Values=com.amazonaws.{{ network_lockdown_region }}.s3
    --query 'PrefixLists[0].PrefixListId'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_s3_prefix_list
  changed_when: false

- name: Allow HTTPS egress to the S3 managed prefix list (gateway endpoint traffic)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 authorize-security-group-egress
    --group-id {{ item }}
    --ip-permissions '[{"IpProtocol":"tcp","FromPort":443,"ToPort":443,"PrefixListIds":[{"PrefixListId":"{{ _nl_s3_prefix_list.stdout | trim }}"}]}]'
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  loop: "{{ _nl_cluster_sgs_list }}"
  register: _nl_allow_s3_prefix_list
  failed_when:
    - _nl_allow_s3_prefix_list.rc != 0
    - "'InvalidPermission.Duplicate' not in _nl_allow_s3_prefix_list.stderr"
  changed_when: _nl_allow_s3_prefix_list.rc == 0

- name: Allow egress to the jumphost VPC (mirror/LDAP, pre-migration only)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 authorize-security-group-egress
    --group-id {{ item }}
    --ip-permissions '[{"IpProtocol":"-1","IpRanges":[{"CidrIp":"{{ _nl_jumphost_vpc_cidr.stdout | trim }}"}]}]'
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  loop: "{{ _nl_cluster_sgs_list }}"
  register: _nl_allow_jumphost_cidr
  failed_when:
    - _nl_allow_jumphost_cidr.rc != 0
    - "'InvalidPermission.Duplicate' not in _nl_allow_jumphost_cidr.stderr"
  changed_when: _nl_allow_jumphost_cidr.rc == 0
  when: network_lockdown_allow_jumphost_egress | bool

- name: Revoke egress to the jumphost VPC (final lockdown, post-migration)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 revoke-security-group-egress
    --group-id {{ item }}
    --ip-permissions '[{"IpProtocol":"-1","IpRanges":[{"CidrIp":"{{ _nl_jumphost_vpc_cidr.stdout | trim }}"}]}]'
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  loop: "{{ _nl_cluster_sgs_list }}"
  register: _nl_revoke_jumphost_cidr
  failed_when:
    - _nl_revoke_jumphost_cidr.rc != 0
    - "'InvalidPermission.NotFound' not in _nl_revoke_jumphost_cidr.stderr"
  changed_when: _nl_revoke_jumphost_cidr.rc == 0
  when: not (network_lockdown_allow_jumphost_egress | bool)

# aws/allow_jumphost_ingress_to_nodes (or this role's own prior run) opened
# ingress from the jumphost VPC for SSH/API/MCS so the jumphost could install
# the cluster and run Day 2 config against it. That access must be revoked at
# the same final-cutover point egress is — otherwise the jumphost retains
# inbound access to every cluster node indefinitely post-migration.
- name: Revoke jumphost ingress to node security groups (final lockdown, post-migration)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 revoke-security-group-ingress
    --group-id {{ item.0 }}
    --ip-permissions '[{"IpProtocol":"tcp","FromPort":{{ item.1 }},"ToPort":{{ item.1 }},"IpRanges":[{"CidrIp":"{{ _nl_jumphost_vpc_cidr.stdout | trim }}"}]}]'
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  loop: "{{ _nl_cluster_sgs_list | product(network_lockdown_jumphost_ingress_ports) | list }}"
  register: _nl_revoke_jumphost_ingress
  failed_when:
    - _nl_revoke_jumphost_ingress.rc != 0
    - "'InvalidPermission.NotFound' not in _nl_revoke_jumphost_ingress.stderr"
  changed_when: _nl_revoke_jumphost_ingress.rc == 0
  when: not (network_lockdown_allow_jumphost_egress | bool)

- name: Display lockdown summary
  ansible.builtin.debug:
    msg:
      - "Security groups locked down for {{ _nl_infra_name.stdout | trim }}: {{ _nl_cluster_sgs_list }}"
      - "Egress allowed: {{ _nl_cluster_vpc_cidr.stdout | trim }}, S3 prefix list {{ _nl_s3_prefix_list.stdout | trim }}{{ (' and ' ~ _nl_jumphost_vpc_cidr.stdout | trim) if network_lockdown_allow_jumphost_egress | bool else '' }}"
