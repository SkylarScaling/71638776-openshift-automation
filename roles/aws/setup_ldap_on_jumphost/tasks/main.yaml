---
# Deploy 389 DS LDAP server as a rootful podman container on the jumphost.
# The jumphost has internet access to pull the image directly from quay.io.
# LDAP is accessible to OCP cluster pods via the same network path used for
# image pulls (mirror registry hostname / jumphost private IP within the VPC).
#
# Run this BEFORE cluster installation so LDAP is independent of cluster lifecycle.
# Restarts automatically on reboot via podman-restart service (enabled in setup_jumphost).

- name: Derive LDAP suffix from base_domain
  ansible.builtin.set_fact:
    ds389_suffix: "dc={{ base_domain.split('.') | join(',dc=') }}"
  when: ds389_suffix | default('') == ''

- name: Check if ds389 container is already running
  ansible.builtin.shell: >
    podman inspect ds389 --format '{% raw %}{{.State.Running}}{% endraw %}' 2>/dev/null || echo false
  register: _ds389_running
  changed_when: false
  failed_when: false
  become: true

- name: Pull 389 DS image
  ansible.builtin.command: podman pull {{ ds389_source_image }}
  changed_when: true
  become: true
  when: (_ds389_running.stdout | trim) != 'true'

# Remove any stopped/failed container so podman run doesn't error on name conflict.
# A container that exited (State.Running=false) still occupies the name slot.
- name: Remove stopped ds389 container if present
  ansible.builtin.command: podman rm -f ds389
  register: _ds389_rm
  changed_when: _ds389_rm.rc == 0
  failed_when: false
  become: true
  when: (_ds389_running.stdout | trim) != 'true'

- name: Create 389 DS data directory
  ansible.builtin.file:
    path: /data/ds389
    state: directory
    mode: '0755'
  become: true

- name: Set directory ownership to container's dirsrv user (uid 389)
  ansible.builtin.command: chown 389:389 /data/ds389
  changed_when: true
  become: true

- name: Run 389 DS container
  ansible.builtin.command: >
    podman run -d --name ds389
    --restart=always
    -p 389:{{ ds389_container_port }}
    -e DS_DM_PASSWORD={{ ds389_root_password }}
    -e DS_SUFFIX_NAME={{ ds389_suffix }}
    -v /data/ds389:/data:z
    {{ ds389_source_image }}
  changed_when: true
  become: true
  when: (_ds389_running.stdout | trim) != 'true'
  no_log: true

# Give the container a moment to start, then verify it is actually running.
# If it crashed (SELinux label issue, stale data, etc.), capture logs, wipe
# the data directory, and retry once with a clean slate.
- name: Wait briefly for 389 DS container to initialise
  ansible.builtin.pause:
    seconds: 5
  when: (_ds389_running.stdout | trim) != 'true'

- name: Check whether container is still running after start
  ansible.builtin.shell: >
    podman inspect ds389 --format '{% raw %}{{.State.Running}}{% endraw %}' 2>/dev/null || echo false
  register: _ds389_post_start
  changed_when: false
  failed_when: false
  become: true

- name: Recover from crashed container (show logs, wipe data, retry)
  when: (_ds389_post_start.stdout | trim) != 'true'
  block:
    - name: Show container logs for diagnostics
      ansible.builtin.command: podman logs ds389
      register: _ds389_crash_logs
      changed_when: false
      failed_when: false
      become: true

    - name: Display crash logs
      ansible.builtin.debug:
        msg: "{{ (_ds389_crash_logs.stdout_lines | default([])) + (_ds389_crash_logs.stderr_lines | default([])) }}"

    - name: Remove crashed container
      ansible.builtin.command: podman rm -f ds389
      changed_when: true
      become: true

    - name: Wipe stale data directory (prevents re-init failure)
      ansible.builtin.file:
        path: /data/ds389
        state: absent
      become: true

    - name: Recreate data directory
      ansible.builtin.file:
        path: /data/ds389
        state: directory
        mode: '0755'
      become: true

    - name: Set directory ownership to container's dirsrv user (uid 389)
      ansible.builtin.command: chown 389:389 /data/ds389
      changed_when: true
      become: true

    - name: Re-run 389 DS container with clean data
      ansible.builtin.command: >
        podman run -d --name ds389
        --restart=always
        -p 389:{{ ds389_container_port }}
        -e DS_DM_PASSWORD={{ ds389_root_password }}
        -e DS_SUFFIX_NAME={{ ds389_suffix }}
        -v /data/ds389:/data:z
        {{ ds389_source_image }}
      changed_when: true
      become: true
      no_log: true

- name: Wait for 389 DS LDAP to accept connections
  ansible.builtin.command: >
    podman exec ds389 ldapsearch -x
    -H ldap://localhost:{{ ds389_container_port }}
    -b "" -s base namingContexts
  register: _ldap_ready
  until: _ldap_ready.rc == 0
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false
  become: true

- name: Show container logs if LDAP did not become ready
  ansible.builtin.command: podman logs --tail 50 ds389
  register: _ds389_init_logs
  changed_when: false
  failed_when: false
  become: true
  when: _ldap_ready.rc | default(1) != 0

- name: Display logs and fail if LDAP never became ready
  ansible.builtin.fail:
    msg: "389 DS LDAP did not become ready after 300s. Container logs:\n{{ (_ds389_init_logs.stdout_lines | default([])) | join('\n') }}\n{{ (_ds389_init_logs.stderr_lines | default([])) | join('\n') }}"
  when: _ldap_ready.rc | default(1) != 0

- name: Check if suffix base entry exists
  ansible.builtin.command: >
    podman exec ds389 ldapsearch -x
    -H ldap://localhost:{{ ds389_container_port }}
    -b '{{ ds389_suffix }}' -s base dn
  register: _suffix_check
  changed_when: false
  failed_when: _suffix_check.rc not in [0, 32]
  become: true

- name: Create backend and base entry via dsconf (if suffix missing)
  ansible.builtin.shell: |
    podman exec ds389 bash -c "
      INSTANCE=\$(ls /etc/dirsrv/ 2>/dev/null | grep '^slapd-' | head -1 | sed 's/slapd-//')
      if [ -z \"\$INSTANCE\" ]; then echo 'ERROR: no instance found' >&2; exit 1; fi
      dsconf \"\$INSTANCE\" backend create \
        --suffix '{{ ds389_suffix }}' \
        --be-name userroot \
        --create-suffix 2>&1
    "
  register: _backend_create
  changed_when: _backend_create.rc == 0
  failed_when: >
    _backend_create.rc != 0 and
    'already exists' not in (_backend_create.stdout + _backend_create.stderr) | lower
  when: _suffix_check.rc == 32
  become: true

- name: Add read ACI for authenticated users
  ansible.builtin.shell: |
    podman exec -i ds389 ldapmodify -x \
      -H ldap://localhost:{{ ds389_container_port }} \
      -D '{{ ds389_root_dn }}' \
      -w '{{ ds389_root_password }}' << 'LDIF'
    dn: {{ ds389_suffix }}
    changetype: modify
    add: aci
    aci: (targetattr="*")(version 3.0; acl "Allow authenticated read"; allow (read,search,compare) userdn="ldap:///all";)
    LDIF
  register: _aci
  changed_when: _aci.rc == 0
  failed_when: _aci.rc not in [0, 20]
  become: true
  no_log: true

- name: Create OUs
  ansible.builtin.shell: |
    podman exec -i ds389 ldapadd -x \
      -H ldap://localhost:{{ ds389_container_port }} \
      -D '{{ ds389_root_dn }}' \
      -w '{{ ds389_root_password }}' << 'LDIF'
    dn: ou=people,{{ ds389_suffix }}
    objectClass: organizationalUnit
    ou: people

    dn: ou=groups,{{ ds389_suffix }}
    objectClass: organizationalUnit
    ou: groups
    LDIF
  register: _ous
  changed_when: _ous.rc == 0
  failed_when: _ous.rc not in [0, 68]
  become: true
  no_log: true

- name: Create LDAP service account
  ansible.builtin.shell: |
    podman exec -i ds389 ldapadd -x \
      -H ldap://localhost:{{ ds389_container_port }} \
      -D '{{ ds389_root_dn }}' \
      -w '{{ ds389_root_password }}' << 'LDIF'
    dn: uid={{ ds389_ldap_service_account.username }},ou=people,{{ ds389_suffix }}
    objectClass: inetOrgPerson
    objectClass: organizationalPerson
    objectClass: person
    objectClass: top
    uid: {{ ds389_ldap_service_account.username }}
    cn: {{ ds389_ldap_service_account.cn }}
    sn: {{ ds389_ldap_service_account.sn }}
    userPassword: {{ ds389_ldap_service_account.password }}
    LDIF
  register: _svc_acct
  changed_when: _svc_acct.rc == 0
  failed_when: _svc_acct.rc not in [0, 68]
  become: true
  no_log: true

- name: Create test users
  ansible.builtin.shell: |
    podman exec -i ds389 ldapadd -x \
      -H ldap://localhost:{{ ds389_container_port }} \
      -D '{{ ds389_root_dn }}' \
      -w '{{ ds389_root_password }}' << 'LDIF'
    dn: uid={{ item.username }},ou=people,{{ ds389_suffix }}
    objectClass: inetOrgPerson
    objectClass: organizationalPerson
    objectClass: person
    objectClass: top
    uid: {{ item.username }}
    cn: {{ item.cn }}
    sn: {{ item.sn }}
    mail: {{ item.username }}@{{ base_domain }}
    userPassword: {{ item.password }}
    LDIF
  register: _users
  changed_when: _users.rc == 0
  failed_when: _users.rc not in [0, 68]
  loop: "{{ ds389_ocp_users }}"
  become: true
  no_log: true

- name: Create OCP groups with members
  ansible.builtin.shell: |
    podman exec -i ds389 ldapadd -x \
      -H ldap://localhost:{{ ds389_container_port }} \
      -D '{{ ds389_root_dn }}' \
      -w '{{ ds389_root_password }}' << 'LDIF'
    dn: cn={{ item }},ou=groups,{{ ds389_suffix }}
    objectClass: groupOfNames
    objectClass: top
    cn: {{ item }}
    member: uid={{ ds389_ldap_service_account.username }},ou=people,{{ ds389_suffix }}
    {% for user in ds389_ocp_users if item in (user.groups | default([])) -%}
    member: uid={{ user.username }},ou=people,{{ ds389_suffix }}
    {% endfor -%}
    LDIF
  register: _groups
  changed_when: _groups.rc == 0
  failed_when: _groups.rc not in [0, 68]
  loop: "{{ ds389_ocp_groups }}"
  become: true
  no_log: true

- name: Print LDAP server details and inventory snippet
  ansible.builtin.debug:
    msg:
      - "========================================================"
      - "389 DS LDAP Server Ready on Jumphost (port 389)"
      - "========================================================"
      - "Suffix:  {{ ds389_suffix }}"
      - "Root DN: {{ ds389_root_dn }}"
      - ""
      - "NOTE: Use the jumphost private IP (disconnected.mirror_registry.hostname)"
      - "so OCP pods (OAuth, GroupSync CronJob) can reach LDAP within the VPC."
      - ""
      - "Add to disconnected-aws-inventory:"
      - "  ldap:"
      - "    url: \"ldap://{{ disconnected.mirror_registry.hostname }}:389/ou=people,{{ ds389_suffix }}?uid\""
      - "    bind_dn: \"uid={{ ds389_ldap_service_account.username }},ou=people,{{ ds389_suffix }}\""
      - "    bind_password: \"ChangeMe123!\"  # or use vault_ldap_bind_password"
      - "    insecure: true"
      - "  groupsync:"
      - "    ldap_url: \"ldap://{{ disconnected.mirror_registry.hostname }}:389\""
      - "    bind_dn: \"uid={{ ds389_ldap_service_account.username }},ou=people,{{ ds389_suffix }}\""
      - "    bind_password: \"ChangeMe123!\"  # or use vault_ldap_bind_password"
      - "    groups_base_dn: \"ou=groups,{{ ds389_suffix }}\""
      - "    users_base_dn: \"ou=people,{{ ds389_suffix }}\""
      - "    insecure: true"
      - "========================================================"
