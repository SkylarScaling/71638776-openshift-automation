---
# ==============================================================================
# CREATE PRIVATE SUBNETS FOR A CLUSTER
#
# Carves this cluster's private subnets out of the isolated Cluster VPC — one
# per availability zone the cluster actually uses (install_config.control_plane
# /workers zones). CIDRs are allocated automatically: the Cluster VPC's /16 is
# carved into /24s, and each zone gets the lowest-numbered /24 not already in
# use anywhere in the VPC. No explicit per-cluster CIDR input required — the
# role that creates the Cluster VPC is the same one carving it up, so there's
# nothing for the user to keep in sync by hand. Associates each subnet with
# the shared private route table (no route to an Internet Gateway/NAT Gateway
# — isolation comes from that absence).
#
# Self-contained: (re)discovers the Cluster VPC and route table by tag rather
# than depending on facts set by aws/provision_cluster_vpc in an earlier play,
# so this works whether hub and spokes run in the same invocation or not.
# Subnets are allocated one zone at a time, re-reading AWS state before each
# allocation, so a spoke running after the hub naturally skips CIDRs the hub
# already claimed — no coordination between hosts is needed.
#
# Prerequisites: aws/provision_cluster_vpc must have run once already (any
# earlier invocation — this only discovers, never creates the VPC itself).
# ==============================================================================

- name: Set AWS environment for all tasks
  ansible.builtin.set_fact:
    _aws_env:
      AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
      AWS_SESSION_TOKEN: ""

- name: Find the Cluster VPC
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-vpcs
    --filters Name=tag:Name,Values={{ network_lockdown_vpc_name }}
    --query 'Vpcs[0].VpcId'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_vpc_lookup
  changed_when: false

- name: Fail if the Cluster VPC does not exist yet
  ansible.builtin.fail:
    msg: "Cluster VPC '{{ network_lockdown_vpc_name }}' not found — run aws/provision_cluster_vpc first."
  when: _nl_vpc_lookup.stdout | trim in ['None', '']

- name: Set Cluster VPC ID fact
  ansible.builtin.set_fact:
    network_lockdown_vpc_id: "{{ _nl_vpc_lookup.stdout | trim }}"

- name: Find the shared private route table
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-route-tables
    --filters Name=tag:Name,Values={{ network_lockdown_vpc_name }}-private-rt
    --query 'RouteTables[0].RouteTableId'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_rt_lookup
  changed_when: false

- name: Set shared private route table ID fact
  ansible.builtin.set_fact:
    network_lockdown_route_table_id: "{{ _nl_rt_lookup.stdout | trim }}"

- name: Determine zones required for this cluster
  ansible.builtin.set_fact:
    _nl_zones: >-
      {{ (install_config.control_plane.zones | default([])
          + install_config.workers.zones | default([])) | unique }}

- name: Discover a default availability zone when none are configured
  when: _nl_zones | length == 0
  block:
    - name: Find an available zone in the target region
      ansible.builtin.command: >
        {{ bin_dir }}/aws ec2 describe-availability-zones
        --filters Name=state,Values=available
        --query 'AvailabilityZones[0].ZoneName'
        --output text
        --region {{ network_lockdown_region }}
      environment: "{{ _aws_env }}"
      register: _nl_default_az
      changed_when: false

    - name: Set default zone fact
      ansible.builtin.set_fact:
        _nl_zones: ["{{ _nl_default_az.stdout | trim }}"]

- name: Allocate a private subnet for each required zone
  ansible.builtin.include_tasks: allocate_subnet.yml
  loop: "{{ _nl_zones }}"
  loop_control:
    loop_var: _nl_zone

- name: Re-read subnet IDs for this cluster (existing + newly created)
  ansible.builtin.command: >
    {{ bin_dir }}/aws ec2 describe-subnets
    --filters
      Name=vpc-id,Values={{ network_lockdown_vpc_id }}
      Name=tag:Name,Values={{ ocp_cluster.name }}-*
    --query 'Subnets[].SubnetId'
    --output text
    --region {{ network_lockdown_region }}
  environment: "{{ _aws_env }}"
  register: _nl_final_subnets
  changed_when: false

- name: Set network_lockdown_subnet_ids fact for this cluster
  ansible.builtin.set_fact:
    network_lockdown_subnet_ids: "{{ _nl_final_subnets.stdout.split() }}"

- name: Display private subnet summary
  ansible.builtin.debug:
    msg:
      - "Private subnets for {{ ocp_cluster.name }}: {{ network_lockdown_subnet_ids }}"
