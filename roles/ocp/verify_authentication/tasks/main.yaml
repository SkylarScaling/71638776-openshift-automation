---
# --------------------------------------------------------------------------
# LDAP Identity Provider
# --------------------------------------------------------------------------
- name: "[Auth] Check LDAP identity provider is configured"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get oauth cluster
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.spec.identityProviders[?(@.type=="LDAP")].name}'
  register: _ldap_idp_name
  changed_when: false

- name: "[Auth] Assert LDAP IDP is present"
  ansible.builtin.assert:
    that: _ldap_idp_name.stdout != ""
    fail_msg: "No LDAP identity provider found in OAuth cluster CR"
    success_msg: "LDAP IDP '{{ _ldap_idp_name.stdout }}' is configured"
  when: ldap is defined

- name: "[Auth] Check LDAP bind secret exists"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get secret {{ ldap_bind_secret_name | default('ldap-bind-secret') }}
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _bind_secret
  changed_when: false

- name: "[Auth] Assert LDAP bind secret exists"
  ansible.builtin.assert:
    that: _bind_secret.stdout != ""
    fail_msg: "LDAP bind secret '{{ ldap_bind_secret_name | default('ldap-bind-secret') }}' not found in openshift-config"
    success_msg: "LDAP bind secret exists"
  when: ldap is defined

# --------------------------------------------------------------------------
# Live LDAP reachability (TCP connect from an actual cluster node).
#
# Everything above only checks that the IdP/secret OBJECTS exist on the
# OAuth CR -- it says nothing about whether the cluster can actually reach
# the LDAP server right now. That gap let a real incident pass silently:
# the post-migrate_mirror network lockdown revoked ALL cluster egress to the
# jumphost VPC, including LDAP's tcp/389, and this role still reported
# failed=0 while every login was failing. See the permanent /32 exception in
# roles/aws/lockdown_cluster_security_groups and
# playbooks/DISCONNECTED-NETWORK-LOCKDOWN.md for the fix; this check exists
# so a regression of that fix (or any other SG/routing change that blocks
# LDAP) fails loudly here instead of being discovered via broken user logins.
#
# This only proves network reachability (TCP connect), not a successful
# bind/auth -- RHCOS nodes have no LDAP client tooling to shell out to for a
# real bind, but reachability is exactly what broke in the incident above,
# and bind_dn/bind_password correctness is already exercised by every actual
# login attempt against this IdP.
- name: "[Auth] Parse ldap.url into scheme, host, and port"
  ansible.builtin.set_fact:
    _ldap_url_parts: >-
      {{ ldap.url | regex_search('^(ldaps?)://([^:/?]+)(?::(\d+))?', '\1', '\2', '\3')
         | default([], true) }}
  when: ldap is defined

- name: "[Auth] Assert ldap.url could be parsed"
  ansible.builtin.assert:
    that: _ldap_url_parts | length == 3
    fail_msg: "Could not parse scheme/host out of ldap.url: '{{ ldap.url }}' — expected ldap(s)://host[:port]/..."
  when: ldap is defined

# regex_search returns None (not '') for a non-participating optional group
# (no :port in the URL) -- default('', true) is required, plain default('')
# only catches undefined, not None. Port falls back by scheme (ldaps -> 636)
# since ldap.url commonly omits it when non-standard.
- name: "[Auth] Set LDAP host and port from parsed URL"
  ansible.builtin.set_fact:
    _ldap_host: "{{ _ldap_url_parts[1] | default('', true) }}"
    _ldap_port: >-
      {{ _ldap_url_parts[2] | default('', true)
         or ('636' if (_ldap_url_parts[0] | default('ldap', true)) == 'ldaps' else '389') }}
  when: ldap is defined

- name: "[Auth] Find a master node to test LDAP reachability from"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get nodes
    --kubeconfig {{ target_kubeconfig }}
    -l node-role.kubernetes.io/master
    -o jsonpath='{.items[0].metadata.name}'
  register: _auth_master_node
  changed_when: false
  failed_when: false
  when: ldap is defined

- name: "[Auth] Check LDAP port is reachable from a cluster node"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc debug node/{{ _auth_master_node.stdout | trim }}
    --kubeconfig {{ target_kubeconfig }}
    -- chroot /host timeout 5 bash -c
    "echo > /dev/tcp/{{ _ldap_host }}/{{ _ldap_port }}"
  register: _ldap_reachable
  changed_when: false
  failed_when: false
  when:
    - ldap is defined
    - _auth_master_node.stdout | default('') != ''

- name: "[Auth] Assert LDAP server is reachable from the cluster"
  ansible.builtin.assert:
    that: _ldap_reachable.rc == 0
    fail_msg: >-
      Cluster node could not open a TCP connection to the LDAP server
      ({{ _ldap_host }}:{{ _ldap_port }}, rc={{ _ldap_reachable.rc }}). The
      OAuth IdP and bind secret exist, but logins will fail. Check security
      group egress from the cluster to the LDAP host and that the LDAP
      server (389 DS on the jumphost) is actually running.
    success_msg: "LDAP server {{ _ldap_host }}:{{ _ldap_port }} is reachable from a cluster node"
  when:
    - ldap is defined
    - _auth_master_node.stdout | default('') != ''

# --------------------------------------------------------------------------
# ClusterRoleBindings
# --------------------------------------------------------------------------
- name: "[Auth] Check ClusterRoleBindings exist"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterrolebinding
    {{ item.group | replace(' ', '-') | lower }}-{{ item.cluster_role }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _crb_results
  changed_when: false
  loop: "{{ rbac_bindings | default([]) }}"

- name: "[Auth] Assert ClusterRoleBindings exist"
  ansible.builtin.assert:
    that: item.stdout != ""
    fail_msg: "ClusterRoleBinding missing: {{ item.item.group }} → {{ item.item.cluster_role }}"
    success_msg: "ClusterRoleBinding present: {{ item.item.group }} → {{ item.item.cluster_role }}"
  loop: "{{ _crb_results.results | default([]) }}"
  when: rbac_bindings | default([]) | length > 0

# --------------------------------------------------------------------------
# GroupSync — check groups first. The CronJob may have already synced them
# on its schedule. Only trigger a manual job if groups are missing.
# --------------------------------------------------------------------------
- name: "[Auth] Check GroupSync CronJob exists"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get cronjob ldap-group-sync
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _cronjob_check
  changed_when: false
  when: groupsync is defined

- name: "[Auth] Assert GroupSync CronJob exists"
  ansible.builtin.assert:
    that: _cronjob_check.stdout == 'ldap-group-sync'
    fail_msg: "GroupSync CronJob 'ldap-group-sync' not found in openshift-config"
    success_msg: "GroupSync CronJob exists"
  when: groupsync is defined

- name: "[Auth] Check groups from rbac_bindings exist in OCP"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get group {{ item.group | quote }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _group_results
  changed_when: false
  loop: "{{ rbac_bindings | default([]) }}"

- name: "[Auth] Set groups_present fact"
  ansible.builtin.set_fact:
    _groups_present: >-
      {{ _group_results.results | default([]) | selectattr('stdout', '!=', '') | list | length
         == (rbac_bindings | default([]) | length) }}

# If groups already exist (synced by the CronJob on its schedule), skip
# the manual job test entirely — the CronJob is working.
- name: "[Auth] Assert all RBAC groups exist (primary check)"
  ansible.builtin.assert:
    that: item.stdout != ""
    fail_msg: "Group '{{ item.item.group }}' not found — GroupSync may not have run yet"
    success_msg: "Group '{{ item.item.group }}' exists in OCP"
  loop: "{{ _group_results.results | default([]) }}"
  when:
    - rbac_bindings | default([]) | length > 0
    - _groups_present | bool

# --------------------------------------------------------------------------
# Manual job — only triggered when groups are missing, as a diagnostic
# to confirm GroupSync can actually run and sync groups.
# --------------------------------------------------------------------------
- name: "[Auth] Delete any previous GroupSync verify job"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc delete job ldap-group-sync-verify
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    --ignore-not-found
  changed_when: true
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool

# Create the verify job from the CronJob (389 DS is now cluster-internal via
# ClusterIP service — no DNS/network issues, no hostAliases needed).
- name: "[Auth] Trigger manual GroupSync job (groups missing)"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc create job ldap-group-sync-verify
    --from=cronjob/ldap-group-sync
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
  register: _sync_job
  changed_when: true
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool

- name: "[Auth] Constrain verify job (backoffLimit=0 keeps pod for log inspection)"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc patch job ldap-group-sync-verify
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    --type=merge
    -p '{"spec":{"backoffLimit":0,"activeDeadlineSeconds":300,"ttlSecondsAfterFinished":600}}'
  changed_when: true
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool

- name: "[Auth] Wait for GroupSync job to complete"
  ansible.builtin.shell: |
    COMPLETE=$({{ bin_dir }}/oc get job ldap-group-sync-verify \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
    FAILED=$({{ bin_dir }}/oc get job ldap-group-sync-verify \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
    if [ "$COMPLETE" = "True" ]; then
      echo "COMPLETE"
    elif [ "$FAILED" = "True" ]; then
      echo "FAILED"
    fi
  register: _job_status
  until: _job_status.stdout in ['COMPLETE', 'FAILED']
  retries: 40
  delay: 15
  changed_when: false
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool

- name: "[Auth] Get GroupSync job pod logs for diagnosis"
  ansible.builtin.shell: |
    POD=$({{ bin_dir }}/oc get pods -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -l job-name=ldap-group-sync-verify \
      -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || true)
    if [ -n "$POD" ]; then
      {{ bin_dir }}/oc logs -n openshift-config \
        --kubeconfig {{ target_kubeconfig }} "$POD" --previous 2>/dev/null || \
      {{ bin_dir }}/oc logs -n openshift-config \
        --kubeconfig {{ target_kubeconfig }} "$POD" 2>/dev/null || \
      echo "(no logs for pod $POD)"
    else
      echo "(no pods found for job)"
    fi
  register: _sync_job_logs
  changed_when: false
  failed_when: false
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool
    - _job_status.stdout == 'FAILED'

- name: "[Auth] Fail if GroupSync job failed"
  ansible.builtin.fail:
    msg: |
      GroupSync job failed. Pod logs:
      {{ _sync_job_logs.stdout | default('(not available)') }}

      Common causes:
      - 389 DS Deployment not running in openshift-config (re-run install-ldap-server.yaml)
      - ldap_url in groupsync config is not the cluster-internal service URL
        (should be ldap://ds389.openshift-config.svc.cluster.local:389)
      - Service account lacks read ACI (re-run install-ldap-server.yaml --tags testdata)
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool
    - _job_status.stdout is defined
    - _job_status.stdout == 'FAILED'

- name: "[Auth] Re-check groups after manual sync"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get group {{ item.group | quote }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _group_recheck
  changed_when: false
  loop: "{{ rbac_bindings | default([]) }}"
  when:
    - rbac_bindings | default([]) | length > 0
    - not _groups_present | bool

- name: "[Auth] Assert all RBAC groups exist (after manual sync)"
  ansible.builtin.assert:
    that: item.stdout != ""
    fail_msg: "Group '{{ item.item.group }}' still not found after manual GroupSync"
    success_msg: "Group '{{ item.item.group }}' exists in OCP"
  loop: "{{ _group_recheck.results | default([]) }}"
  when:
    - rbac_bindings | default([]) | length > 0
    - not _groups_present | bool

- name: "[Auth] Clean up manual GroupSync job"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc delete job ldap-group-sync-verify
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    --ignore-not-found
  changed_when: true
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool
