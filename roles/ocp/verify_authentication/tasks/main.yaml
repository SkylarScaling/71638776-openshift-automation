---
# --------------------------------------------------------------------------
# LDAP Identity Provider
# --------------------------------------------------------------------------
- name: "[Auth] Check LDAP identity provider is configured"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get oauth cluster
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.spec.identityProviders[?(@.type=="LDAP")].name}'
  register: _ldap_idp_name
  changed_when: false

- name: "[Auth] Assert LDAP IDP is present"
  ansible.builtin.assert:
    that: _ldap_idp_name.stdout != ""
    fail_msg: "No LDAP identity provider found in OAuth cluster CR"
    success_msg: "LDAP IDP '{{ _ldap_idp_name.stdout }}' is configured"
  when: ldap is defined

- name: "[Auth] Check LDAP bind secret exists"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get secret {{ ldap_bind_secret_name | default('ldap-bind-secret') }}
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _bind_secret
  changed_when: false

- name: "[Auth] Assert LDAP bind secret exists"
  ansible.builtin.assert:
    that: _bind_secret.stdout != ""
    fail_msg: "LDAP bind secret '{{ ldap_bind_secret_name | default('ldap-bind-secret') }}' not found in openshift-config"
    success_msg: "LDAP bind secret exists"
  when: ldap is defined

# --------------------------------------------------------------------------
# ClusterRoleBindings
# --------------------------------------------------------------------------
- name: "[Auth] Check ClusterRoleBindings exist"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterrolebinding
    {{ item.group | replace(' ', '-') | lower }}-{{ item.cluster_role }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _crb_results
  changed_when: false
  loop: "{{ rbac_bindings | default([]) }}"

- name: "[Auth] Assert ClusterRoleBindings exist"
  ansible.builtin.assert:
    that: item.stdout != ""
    fail_msg: "ClusterRoleBinding missing: {{ item.item.group }} → {{ item.item.cluster_role }}"
    success_msg: "ClusterRoleBinding present: {{ item.item.group }} → {{ item.item.cluster_role }}"
  loop: "{{ _crb_results.results | default([]) }}"
  when: rbac_bindings | default([]) | length > 0

# --------------------------------------------------------------------------
# GroupSync — check groups first. The CronJob may have already synced them
# on its schedule. Only trigger a manual job if groups are missing.
# --------------------------------------------------------------------------
- name: "[Auth] Check GroupSync CronJob exists"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get cronjob ldap-group-sync
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _cronjob_check
  changed_when: false
  when: groupsync is defined

- name: "[Auth] Assert GroupSync CronJob exists"
  ansible.builtin.assert:
    that: _cronjob_check.stdout == 'ldap-group-sync'
    fail_msg: "GroupSync CronJob 'ldap-group-sync' not found in openshift-config"
    success_msg: "GroupSync CronJob exists"
  when: groupsync is defined

- name: "[Auth] Check groups from rbac_bindings exist in OCP"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get group {{ item.group | quote }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _group_results
  changed_when: false
  loop: "{{ rbac_bindings | default([]) }}"

- name: "[Auth] Set groups_present fact"
  ansible.builtin.set_fact:
    _groups_present: >-
      {{ _group_results.results | default([]) | selectattr('stdout', '!=', '') | list | length
         == (rbac_bindings | default([]) | length) }}

# If groups already exist (synced by the CronJob on its schedule), skip
# the manual job test entirely — the CronJob is working.
- name: "[Auth] Assert all RBAC groups exist (primary check)"
  ansible.builtin.assert:
    that: item.stdout != ""
    fail_msg: "Group '{{ item.item.group }}' not found — GroupSync may not have run yet"
    success_msg: "Group '{{ item.item.group }}' exists in OCP"
  loop: "{{ _group_results.results | default([]) }}"
  when:
    - rbac_bindings | default([]) | length > 0
    - _groups_present | bool

# --------------------------------------------------------------------------
# Manual job — only triggered when groups are missing, as a diagnostic
# to confirm GroupSync can actually run and sync groups.
# --------------------------------------------------------------------------
- name: "[Auth] Delete any previous GroupSync verify job"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc delete job ldap-group-sync-verify
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    --ignore-not-found
  changed_when: true
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool

# Create the verify job directly as YAML rather than --from=cronjob so we
# can set restartPolicy: Never (pod stays in Failed state for log inspection)
# and backoffLimit: 0 (fail immediately, don't retry into oblivion).
- name: "[Auth] Resolve LDAP hostname for hostAlias (disconnected clusters lack external DNS)"
  ansible.builtin.shell: |
    python3 -c "
    import socket, re
    url = '{{ groupsync.ldap_url | default('') }}'
    host = re.sub(r'^ldaps?://', '', url).split(':')[0]
    try:
        print(socket.gethostbyname(host) + ' ' + host)
    except:
        print('')
    "
  register: _verify_host_alias
  changed_when: false
  failed_when: false
  when:
    - groupsync is defined
    - not _groups_present | bool

- name: "[Auth] Trigger manual GroupSync job (groups missing)"
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: ldap-group-sync-verify
        namespace: openshift-config
      spec:
        backoffLimit: 0
        activeDeadlineSeconds: 300
        ttlSecondsAfterFinished: 600
        template:
          spec:
            restartPolicy: Never
            serviceAccountName: {{ groupsync_serviceaccount | default('ldap-group-syncer') }}
            {% if (_verify_host_alias.stdout | default('')) != '' %}
            hostAliases:
              - ip: "{{ _verify_host_alias.stdout.split()[0] }}"
                hostnames:
                  - "{{ _verify_host_alias.stdout.split()[1] }}"
            {% endif %}
            containers:
              - name: ldap-group-sync
                image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
                command:
                  - /bin/bash
                  - -c
                  - oc adm groups sync --sync-config=/etc/config/sync.yaml --confirm
                volumeMounts:
                  - name: sync-config
                    mountPath: /etc/config
                  - name: bind-password
                    mountPath: /etc/secrets
            volumes:
              - name: sync-config
                configMap:
                  name: {{ groupsync_configmap | default('ldap-group-sync-config') }}
              - name: bind-password
                secret:
                  secretName: {{ groupsync_secret | default('ldap-group-sync-bind') }}
  register: _sync_job
  changed_when: true
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool

- name: "[Auth] Wait for GroupSync job to complete"
  ansible.builtin.shell: |
    COMPLETE=$({{ bin_dir }}/oc get job ldap-group-sync-verify \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
    FAILED=$({{ bin_dir }}/oc get job ldap-group-sync-verify \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
    if [ "$COMPLETE" = "True" ]; then
      echo "COMPLETE"
    elif [ "$FAILED" = "True" ]; then
      echo "FAILED"
    fi
  register: _job_status
  until: _job_status.stdout in ['COMPLETE', 'FAILED']
  retries: 40
  delay: 15
  changed_when: false
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool

- name: "[Auth] Get GroupSync job pod logs for diagnosis"
  ansible.builtin.shell: |
    POD=$({{ bin_dir }}/oc get pods -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -l job-name=ldap-group-sync-verify \
      -o jsonpath='{.items[-1].metadata.name}' 2>/dev/null || true)
    if [ -n "$POD" ]; then
      {{ bin_dir }}/oc logs -n openshift-config \
        --kubeconfig {{ target_kubeconfig }} "$POD" --previous 2>/dev/null || \
      {{ bin_dir }}/oc logs -n openshift-config \
        --kubeconfig {{ target_kubeconfig }} "$POD" 2>/dev/null || \
      echo "(no logs for pod $POD)"
    else
      echo "(no pods found for job)"
    fi
  register: _sync_job_logs
  changed_when: false
  failed_when: false
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool
    - _job_status.stdout == 'FAILED'

- name: "[Auth] Fail if GroupSync job failed"
  ansible.builtin.fail:
    msg: |
      GroupSync job failed. Pod logs:
      {{ _sync_job_logs.stdout | default('(not available)') }}

      Common causes:
      - 389 DS not running on the jumphost (run install-ldap-server.yaml first)
      - ldap_url uses private IP — use disconnected.mirror_registry.hostname
      - Port 389 not open in EC2 security group
      - Service account lacks read ACI in 389 DS (re-run install-ldap-server.yaml --tags testdata)
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool
    - _job_status.stdout is defined
    - _job_status.stdout == 'FAILED'

- name: "[Auth] Re-check groups after manual sync"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get group {{ item.group | quote }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _group_recheck
  changed_when: false
  loop: "{{ rbac_bindings | default([]) }}"
  when:
    - rbac_bindings | default([]) | length > 0
    - not _groups_present | bool

- name: "[Auth] Assert all RBAC groups exist (after manual sync)"
  ansible.builtin.assert:
    that: item.stdout != ""
    fail_msg: "Group '{{ item.item.group }}' still not found after manual GroupSync"
    success_msg: "Group '{{ item.item.group }}' exists in OCP"
  loop: "{{ _group_recheck.results | default([]) }}"
  when:
    - rbac_bindings | default([]) | length > 0
    - not _groups_present | bool

- name: "[Auth] Clean up manual GroupSync job"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc delete job ldap-group-sync-verify
    -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    --ignore-not-found
  changed_when: true
  when:
    - groupsync is defined
    - _cronjob_check.stdout == 'ldap-group-sync'
    - not _groups_present | bool
