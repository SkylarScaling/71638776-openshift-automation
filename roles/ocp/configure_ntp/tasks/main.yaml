---
- name: Assert NTP servers are defined
  ansible.builtin.assert:
    that:
      - ntp_servers | length > 0
    fail_msg: "ntp_servers must be a non-empty list"

- name: Build chrony.conf content
  ansible.builtin.set_fact:
    _chrony_conf: |
      {% for server in ntp_servers %}
      pool {{ server }} iburst
      {% endfor %}
      driftfile /var/lib/chrony/drift
      makestep 1.0 3
      rtcsync
      logdir /var/log/chrony

- name: Base64-encode chrony.conf
  ansible.builtin.set_fact:
    _chrony_conf_b64: "{{ _chrony_conf | b64encode }}"

- name: Apply NTP MachineConfig for master pool
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfig
      metadata:
        name: 99-master-chrony
        labels:
          machineconfiguration.openshift.io/role: master
      spec:
        config:
          ignition:
            version: 3.4.0
          storage:
            files:
              - path: /etc/chrony.conf
                mode: 420
                overwrite: true
                contents:
                  source: "data:text/plain;charset=utf-8;base64,{{ _chrony_conf_b64 }}"
  changed_when: true

- name: Apply NTP MachineConfig for worker pool
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: machineconfiguration.openshift.io/v1
      kind: MachineConfig
      metadata:
        name: 99-worker-chrony
        labels:
          machineconfiguration.openshift.io/role: worker
      spec:
        config:
          ignition:
            version: 3.4.0
          storage:
            files:
              - path: /etc/chrony.conf
                mode: 420
                overwrite: true
                contents:
                  source: "data:text/plain;charset=utf-8;base64,{{ _chrony_conf_b64 }}"
  changed_when: true

# Wait for MCO to detect and begin the rolling update before checking completion.
# Without this pre-wait, the existing Updated=True condition (from before this
# MachineConfig was applied) can pass the completion check immediately, before
# the controller has even noticed the new chrony config — letting Ansible move
# on to spoke provisioning while the real roll (and node drains/reboots) is
# still ahead. This race previously let the MCO drain a spoke provisioner
# pod's node mid-install, producing an unrelated-looking "UnknownError:
# installer log was not captured" from Hive.
- name: Wait for master MachineConfigPool to begin updating (MCO detection window)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp master
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updating")].status}'
  register: _master_mcp_updating
  until: _master_mcp_updating.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false
  failed_when: false

- name: Wait for master MachineConfigPool to finish updating
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp master
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}'
  register: master_mcp
  until: master_mcp.stdout == "True"
  retries: 60
  delay: 30
  changed_when: false

- name: Wait for worker MachineConfigPool to begin updating (MCO detection window)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp worker
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updating")].status}'
  register: _worker_mcp_updating
  until: _worker_mcp_updating.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false
  failed_when: false

- name: Wait for worker MachineConfigPool to finish updating
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp worker
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}'
  register: worker_mcp
  until: worker_mcp.stdout == "True"
  retries: 90
  delay: 30
  changed_when: false
