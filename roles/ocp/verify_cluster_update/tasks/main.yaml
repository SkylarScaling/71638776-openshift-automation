---
# ==============================================================================
# VERIFY CLUSTER UPDATE HEALTH
#
# Generic pre-flight / post-flight gate for OpenShift updates. Works against
# whatever target_kubeconfig points at (hub or spoke). Set
# verify_cluster_update_mode: preflight|postflight.
#
# preflight  — refuse to proceed if a ClusterOperator is Degraded or an MCP is
#              mid-roll from some unrelated change (same MCO race class as
#              project memory Bug 6 — never start an update on top of one).
# postflight — confirm the update actually landed: ClusterVersion at the
#              target version, ClusterOperators healthy, MCPs Updated.
# ==============================================================================

- name: "[Update] Check ClusterOperators are not Degraded"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusteroperators
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.conditions[?(@.type=="Degraded")].status}{"\n"}{end}'
  register: _co_degraded_raw
  changed_when: false

- name: "[Update] Assert no ClusterOperator is Degraded"
  ansible.builtin.assert:
    that: _co_degraded_raw.stdout_lines | select('match', '.*\tTrue$') | list | length == 0
    fail_msg: >-
      Degraded ClusterOperator(s):
      {{ _co_degraded_raw.stdout_lines | select('match', '.*\tTrue$') | list }}
    success_msg: "No ClusterOperator is Degraded"

- name: "[Update] Check MachineConfigPools are settled"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp {{ item }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}={.status.conditions[?(@.type=="Updating")].status}'
  register: _mcp_settled
  changed_when: false
  loop:
    - master
    - worker

- name: "[Update] Assert MachineConfigPools are settled (Updated=True, Updating=False)"
  ansible.builtin.assert:
    that: item.stdout == "True=False"
    fail_msg: "MachineConfigPool '{{ item.item }}' is not settled (status: {{ item.stdout }}) — wait for it before proceeding"
    success_msg: "MachineConfigPool '{{ item.item }}' is settled"
  loop: "{{ _mcp_settled.results }}"

# OCP only gates the Upgradeable precondition on MINOR version bumps, not
# patch bumps within the same minor -- confirmed via the CVO's own condition
# message ("should not be upgraded between minor versions"). Only check this
# when the target is actually a different minor than what's currently
# installed, so routine patch-level runs of this playbook aren't blocked by
# it. Confirmed live this condition is routinely False on these clusters
# (ClusterVersionOverridesSet from ocp/disable_telemetry, AdminAckRequired
# for 4.21 Sigstore signatures on mirrored clusters, and
# MissingUpgradeableAnnotation on cloud-credential for manual-mode/STS
# clusters). update_ocp_hub and acm/update_ocp_spoke now handle all three
# causes automatically (see the exclusion list below) before triggering the
# actual upgrade -- this preflight check mainly exists so the CVO's own
# condition message is surfaced immediately if some other, unhandled reason
# is blocking Upgradeable.
- name: "[Update] Get current and desired ClusterVersion for minor-bump detection"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterversion version
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.desired.version}'
  register: _cv_current_for_minor_check
  changed_when: false
  when: verify_cluster_update_mode | default('preflight') == 'preflight'

- name: "[Update] Check ClusterVersion Upgradeable condition if this run is a minor version bump"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterversion version
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Upgradeable")]}'
  register: _cv_upgradeable
  changed_when: false
  when:
    - verify_cluster_update_mode | default('preflight') == 'preflight'
    - (_cv_current_for_minor_check.stdout | default('') | regex_replace('^(\d+\.\d+)\..*$', '\1')) != (openshift_version | string)

# ClusterVersionOverridesSet (insights-operator override),
# MissingUpgradeableAnnotation (cloud-credential upgradeable-to annotation,
# Manual credentials mode), and AdminAckRequired (the well-understood
# Sigstore-signature gate) are the three Upgradeable=False reasons this
# update path now handles on its own: update_ocp_hub removes the override
# automatically, ocp/update_manual_cloud_credentials re-extracts
# CredentialsRequests and sets the annotation, and
# ocp/ack_release_signature_gate re-verifies the mirrored signature and acks
# the specific "ack-*-sigstore-in-*" key -- all called from update_ocp_hub /
# acm/update_ocp_spoke before the actual upgrade is triggered. Don't fail
# preflight over any of the three, or every minor bump looks blocked by
# something that isn't actually a blocker.
#
# CAUTION: excluding AdminAckRequired here means this preflight check no
# longer protects against an admin-ack reason this pipeline doesn't actually
# know how to handle (future OCP releases may add unrelated admin-ack
# gates). ocp/ack_release_signature_gate only acks the specific Sigstore key
# pattern it can independently verify and hard-fails rather than silently
# skipping an unmirrored signature, and the actual upgrade trigger (both
# update_ocp_hub and acm/update_ocp_spoke now drive ClusterVersion directly
# and wait on it) will still eventually time out and fail if some other admin-ack
# reason is left blocking the CVO in-cluster -- but that failure now surfaces
# much later (after mirror/catalog/operators have already run) than it would
# at this preflight check. Automated at the user's explicit request, on the
# understanding this pipeline is tested/verified in lower environments
# first; revert this exclusion if that assumption stops holding.
- name: "[Update] Assert cluster is Upgradeable before a minor version bump"
  ansible.builtin.assert:
    that: >-
      _cv_upgradeable_json.status | default('True') != "False"
      or (_cv_upgradeable_remaining_reasons | length == 0)
    fail_msg: >-
      This is a minor version bump ({{ _cv_current_for_minor_check.stdout }} ->
      {{ openshift_version }}.{{ ocp_patch_version }}) but the cluster is not
      Upgradeable for reason(s) requiring action (ClusterVersionOverridesSet,
      MissingUpgradeableAnnotation, and AdminAckRequired are excluded here --
      update_ocp_hub / ocp/update_manual_cloud_credentials /
      ocp/ack_release_signature_gate handle those automatically):
      {{ _cv_upgradeable_remaining_reasons | join(', ') }}.
      Full CVO message: {{ _cv_upgradeable_json.message | default('') }}
    success_msg: >-
      Cluster is Upgradeable for this minor version bump (or only blocked by
      reasons this update path already handles automatically)
  vars:
    # jsonpath on a condition that doesn't currently exist in
    # .status.conditions (e.g. Upgradeable cleared/absent once nothing is
    # blocking it -- confirmed live, not just "False" vs "True") returns an
    # empty string, which from_json can't parse at all. Treat that as the
    # implicit "nothing blocking" case rather than erroring.
    _cv_upgradeable_json: >-
      {{
        (_cv_upgradeable.stdout | default('') | trim | from_json)
        if (_cv_upgradeable.stdout | default('') | trim != '')
        else {'status': 'True'}
      }}
    # The CVO's `.reason` is a single CamelCase token, not a comma-joined
    # list of the individual causes -- when more than one applies it's
    # literally the string "MultipleReasons", and the real per-cause names
    # only appear inline in `.message` (confirmed live: "...for multiple
    # reasons: ClusterVersionOverridesSet,AdminAckRequired,
    # MissingUpgradeableAnnotation\n* ..."). Extract that comma-joined list
    # from the message when reason is the "MultipleReasons" placeholder;
    # otherwise `.reason` itself is already the one real cause.
    _cv_upgradeable_reason: "{{ _cv_upgradeable_json.reason | default('') }}"
    # regex_search with one backref group returns a one-element list (not a
    # bare string) on this Ansible version -- confirmed live via a scratch
    # playbook. `first` unwraps it; `default('', true)` covers both "no
    # match" (None) and an empty list.
    _cv_upgradeable_all_reasons: >-
      {{
        ((_cv_upgradeable_json.message
          | default('')
          | regex_search('for multiple reasons:\s*([A-Za-z,]+)', '\1')
          | default([], true)
        ) | first | default('', true)).split(',')
        if _cv_upgradeable_reason == 'MultipleReasons'
        else [_cv_upgradeable_reason]
      }}
    _cv_upgradeable_remaining_reasons: >-
      {{
        _cv_upgradeable_all_reasons
        | reject('equalto', 'ClusterVersionOverridesSet')
        | reject('equalto', 'MissingUpgradeableAnnotation')
        | reject('equalto', 'AdminAckRequired')
        | reject('equalto', '')
        | list
      }}
  when: _cv_upgradeable is not skipped

- name: "[Update] Postflight — check ClusterVersion reports the target version"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterversion version
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.desired.version}'
  register: _cv_version
  changed_when: false
  when: verify_cluster_update_mode | default('preflight') == 'postflight'

- name: "[Update] Assert ClusterVersion matches the target version"
  ansible.builtin.assert:
    that: _cv_version.stdout == (openshift_version ~ '.' ~ ocp_patch_version)
    fail_msg: >-
      ClusterVersion reports {{ _cv_version.stdout }}, expected
      {{ openshift_version }}.{{ ocp_patch_version }}
    success_msg: "ClusterVersion is at the target version {{ _cv_version.stdout }}"
  when: verify_cluster_update_mode | default('preflight') == 'postflight'

- name: "[Update] Postflight — check ClusterVersion is not Progressing"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get clusterversion version
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Progressing")].status}'
  register: _cv_progressing
  changed_when: false
  when: verify_cluster_update_mode | default('preflight') == 'postflight'

- name: "[Update] Assert ClusterVersion is not Progressing"
  ansible.builtin.assert:
    that: _cv_progressing.stdout == "False"
    fail_msg: "ClusterVersion is still Progressing"
    success_msg: "ClusterVersion update complete, not Progressing"
  when: verify_cluster_update_mode | default('preflight') == 'postflight'

- name: "[Update] Display verification summary"
  ansible.builtin.debug:
    msg: >-
      {{ 'Pre-flight checks passed — safe to start update'
         if verify_cluster_update_mode | default('preflight') == 'preflight'
         else 'Post-flight checks passed — cluster is healthy at ' ~ _cv_version.stdout }}
