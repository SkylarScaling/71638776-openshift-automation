---
# ==============================================================================
# UPDATE CATALOG SOURCE — HUB + SPOKES
#
# Applies freshly mirrored IDMS manifests and repoints the redhat-operators
# CatalogSource at the new catalog digest (hub directly, spokes via
# ManifestWork). Reuses the exact ManifestWork names patch_cluster_idms
# created during migrate_mirror, so repeated updates converge the same
# steady-state objects instead of accumulating one per update.
#
# Prerequisites: ocp/mirror_update_content must have run first in this play
# (sets update_idms_manifests, update_catalog_image).
# ==============================================================================

# patch_cluster_idms (migrate_mirror) renames Quay's IDMS/ITMS objects with a
# `-quay` suffix so they coexist with the jumphost's identically-named
# originals instead of replacing them (see that role for why). oc-mirror
# names objects from THIS mirror pass the same default way
# (idms-release-0, idms-operator-0, ...) -- applying them as-is here would
# create a second, unrenamed set alongside the steady-state `-quay` ones
# instead of converging onto them, defeating the "one steady-state object
# per update" intent this role documents. Apply the same rename so Day 2
# catalog updates land on the exact objects migrate_mirror already created.
- name: Flatten updated IDMS/ITMS manifests into individual documents
  ansible.builtin.set_fact:
    _update_idms_docs: "{{ update_idms_manifests | map('from_yaml_all') | list | sum(start=[]) }}"

- name: Rename each updated IDMS/ITMS document to match migrate_mirror's steady-state objects
  ansible.builtin.set_fact:
    _update_idms_docs_renamed: >-
      {{ (_update_idms_docs_renamed | default([])) + [
        item | combine({'metadata': item.metadata | combine({'name': item.metadata.name ~ '-quay'})}, recursive=True)
      ] }}
  loop: "{{ _update_idms_docs }}"
  loop_control:
    label: "{{ item.metadata.name }}-quay"

- name: Apply updated IDMS manifests to hub cluster
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ item | to_nice_yaml }}"
  loop: "{{ _update_idms_docs_renamed }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  changed_when: true

- name: Disable default OperatorHub catalog sources on hub
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: config.openshift.io/v1
      kind: OperatorHub
      metadata:
        name: cluster
      spec:
        disableAllDefaultSources: true
  when: disable_default_catalog_sources | bool
  changed_when: true

- name: Update redhat-operators CatalogSource to the new catalog digest
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: operators.coreos.com/v1alpha1
      kind: CatalogSource
      metadata:
        name: redhat-operators
        namespace: openshift-marketplace
      spec:
        sourceType: grpc
        image: "{{ update_catalog_image }}"
        displayName: "Red Hat Operators (Quay Mirror)"
        publisher: "Red Hat (Quay Mirror)"
        updateStrategy:
          registryPoll:
            interval: 30m
  changed_when: true

- name: Wait for redhat-operators CatalogSource to be READY on hub
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get catalogsource redhat-operators -n openshift-marketplace
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.connectionState.lastObservedState}'
  register: _hub_cs_status
  until: _hub_cs_status.stdout == "READY"
  retries: 20
  delay: 30
  changed_when: false

# ------------------------------------------------------------------------------
# SPOKE CLUSTERS: propagate via the same ManifestWork names patch_cluster_idms
# created, so this always converges to one steady-state object per concern.
#
# Defense in depth alongside patch_cluster_idms's own grant: re-apply here too
# (idempotent) in case this Day 2 flow ever runs against a spoke that was
# migrated before that fix existed, or whose ClusterRole/Binding was later
# removed some other way. See patch_cluster_idms for the full klusterlet-work-sa
# RBAC gap this works around.
# ------------------------------------------------------------------------------
- name: Grant klusterlet-work-sa permission to manage mirror/catalog config on each spoke
  ansible.builtin.shell:
    cmd: >-
      {{ bin_dir }}/oc apply
      --kubeconfig {{ install_dir }}/{{ hostvars[item].ocp_cluster.name }}/auth/kubeconfig
      -f -
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: klusterlet-work-mirror-config
      rules:
        - apiGroups: ["config.openshift.io"]
          resources: ["imagedigestmirrorsets", "imagetagmirrorsets", "operatorhubs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["operators.coreos.com"]
          resources: ["catalogsources"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: klusterlet-work-mirror-config
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: klusterlet-work-mirror-config
      subjects:
        - kind: ServiceAccount
          name: klusterlet-work-sa
          namespace: open-cluster-management-agent
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  changed_when: true

- name: Push updated IDMS to spokes via ManifestWork
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: work.open-cluster-management.io/v1
      kind: ManifestWork
      metadata:
        name: "{{ hostvars[item].ocp_cluster.name }}-quay-idms"
        namespace: "{{ hostvars[item].ocp_cluster.name }}"
      spec:
        workload:
          manifests: {{ _update_idms_docs_renamed | to_json }}
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  changed_when: true

# Reuse the exact ManifestWork name ("-disconnected-config") that
# aws_provision_disconnected_cluster_via_acm originally created for this
# CatalogSource, instead of creating a second ManifestWork for the same
# object under a different name. Confirmed live: a prior version of this
# role (and patch_cluster_idms) pushed a differently-named ManifestWork
# ("-quay-catalog") that fought with "-disconnected-config" over ownership
# of CatalogSource/redhat-operators, with OCM flipping spec.image back and
# forth between the jumphost and Quay roughly every 100s depending on which
# ManifestWork's controller last reconciled. See patch_cluster_idms for the
# full root cause. Applying under the same name makes OCM replace the
# manifest in place -- a single owner, no flapping.
- name: Push updated CatalogSource and OperatorHub config to spokes via ManifestWork
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: work.open-cluster-management.io/v1
      kind: ManifestWork
      metadata:
        name: "{{ hostvars[item].ocp_cluster.name }}-disconnected-config"
        namespace: "{{ hostvars[item].ocp_cluster.name }}"
      spec:
        workload:
          manifests:
            - apiVersion: config.openshift.io/v1
              kind: OperatorHub
              metadata:
                name: cluster
              spec:
                disableAllDefaultSources: true
            - apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                name: redhat-operators
                namespace: openshift-marketplace
              spec:
                sourceType: grpc
                image: "{{ update_catalog_image }}"
                displayName: "Red Hat Operators (Quay Mirror)"
                publisher: "Red Hat (Quay Mirror)"
                updateStrategy:
                  registryPoll:
                    interval: 30m
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  changed_when: true

# Both ManifestWorks above can report "changed" from a successful `oc apply`
# while OCM never actually manages to apply the workload onto the spoke --
# see patch_cluster_idms for the confirmed-live RBAC gap this guards against.
- name: Wait for IDMS ManifestWork to apply successfully on each spoke
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get manifestwork {{ hostvars[item].ocp_cluster.name }}-quay-idms
    -n {{ hostvars[item].ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Applied")].status}'
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  register: _update_idms_manifestwork_applied
  until: _update_idms_manifestwork_applied.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false

- name: Wait for CatalogSource ManifestWork to apply successfully on each spoke
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get manifestwork {{ hostvars[item].ocp_cluster.name }}-disconnected-config
    -n {{ hostvars[item].ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Applied")].status}'
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  register: _update_catalog_manifestwork_applied
  until: _update_catalog_manifestwork_applied.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false

# Applied=True only means OCM successfully pushed the manifest -- it says
# nothing about whether a LATER, competing write subsequently clobbered it.
# Assert the live spoke CatalogSource actually holds the new image before
# moving on, not just that some apply succeeded at some point.
- name: Verify spoke CatalogSource image actually points at the updated catalog
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get catalogsource redhat-operators -n openshift-marketplace
    --kubeconfig {{ install_dir }}/{{ hostvars[item].ocp_cluster.name }}/auth/kubeconfig
    -o jsonpath='{.spec.image}'
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  register: _update_catalog_live_image
  until: _update_catalog_live_image.stdout == update_catalog_image
  retries: 12
  delay: 15
  changed_when: false

- name: Display catalog update summary
  ansible.builtin.debug:
    msg:
      - "Catalog update applied"
      - "Hub CatalogSource image: {{ update_catalog_image }}"
      - "Spokes updated:          {{ groups['managed_clusters'] | default([]) | length }}"
      - "Spoke CatalogSource/IDMS propagate asynchronously via ManifestWork —"
      - "verify with: oc get catalogsource redhat-operators -n openshift-marketplace --kubeconfig <spoke-kubeconfig>"
