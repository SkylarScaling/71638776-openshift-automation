---
- name: Wait for at least one Argo CD Application to appear
  ansible.builtin.command: >
    {{ bin_dir }}/oc get applications.argoproj.io
    -n openshift-gitops
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
  register: discovered_argo_apps
  until: discovered_argo_apps.stdout_lines | select('ne', '') | list | length > 0
  retries: 20
  delay: 30
  changed_when: false

- name: Wait for all Argo CD Applications to be Healthy and Synced
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get applications.argoproj.io
    -n openshift-gitops
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{range .items[*]}{.metadata.name}={.status.health.status}/{.status.sync.status}{"\n"}{end}'
    2>/dev/null || true
  register: all_app_statuses
  until: >-
    all_app_statuses.stdout_lines
    | select('ne', '')
    | reject('search', '=Healthy/Synced$')
    | list | length == 0
  retries: 120  # Wait up to 60 minutes total (120 * 30 seconds)
  delay: 30
  changed_when: false
  # Non-fatal on re-runs: operator apps (ACM, ODF, Quay) show Degraded when
  # the CatalogSource is in TRANSIENT_FAILURE post-migration. The migrate_mirror
  # play's patch_cluster_idms will apply the ingress CA trust that fixes the
  # CatalogSource. Apps will recover after that MCO roll completes.
  failed_when: false

- name: Warn if Argo CD Applications are not all healthy
  ansible.builtin.debug:
    msg: >
      WARNING: Some Argo CD Applications are not Healthy/Synced:
      {{ all_app_statuses.stdout_lines | select('ne', '') | reject('search', '=Healthy/Synced$') | list }}
      If the Quay mirror migration is pending, these will recover after patch_cluster_idms runs.
  when: >
    all_app_statuses.stdout_lines
    | select('ne', '')
    | reject('search', '=Healthy/Synced$')
    | list | length > 0
