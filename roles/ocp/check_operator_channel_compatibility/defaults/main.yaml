---
# Standalone, read-only tool: compares the operator channels currently
# configured in inventory (disconnected.operators[]/disconnected.community_operators[])
# against the channels that actually exist in the operator catalog index for
# the OCP minor you're about to upgrade to -- so a channel bump can be picked
# correctly in the inventory BEFORE running disconnected-update.yaml, instead
# of finding out mid-upgrade that a channel was renamed or retired.
#
# Advisory, not authoritative: OLM catalogs don't consistently expose a
# per-channel "supports OCP X.Y" property for every operator (that's usually
# only documented in the operator's own release notes). "Channel still
# present in the target catalog" is the one signal reliably present for
# every operator, so that's all this checks. Never mutates a cluster --
# only renders catalog index images into a local scratch workspace.
operator_compat_target_openshift_version: ""
operator_compat_workspace: "{{ tmp_dir }}/operator-compat-check"
redhat_operator_index_digest: ""
community_operator_index_digest: ""
