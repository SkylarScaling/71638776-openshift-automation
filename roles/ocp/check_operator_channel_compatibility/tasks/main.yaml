---
- name: Assert target OCP version is set
  ansible.builtin.assert:
    that: target_ocp_version | default('') != ''
    fail_msg: >-
      target_ocp_version must be set, e.g.
      -e target_ocp_version=4.22

- name: Assert there are operators configured to check
  ansible.builtin.assert:
    that: >-
      (disconnected.operators | default([]) | length > 0) or
      (disconnected.community_operators | default([]) | length > 0)
    fail_msg: "No disconnected.operators or disconnected.community_operators found in inventory — nothing to check."

- name: Create scratch workspace
  ansible.builtin.file:
    path: "{{ operator_compat_workspace }}"
    state: directory
    mode: '0755'

# `opm render` ignores REGISTRY_AUTH_FILE entirely (unlike oc/skopeo) --
# confirmed live: with only REGISTRY_AUTH_FILE set it falls through to
# anonymous auth and registry.redhat.io 401s, even though the exact same
# credentials file works fine for `oc image info ... -a <file>`. opm's
# underlying resolver only reads Docker-style config, i.e.
# $DOCKER_CONFIG/config.json -- the filename must be exactly config.json,
# not just any file pointed to by an env var.
- name: Build config.json from the Red Hat pull secret (opm only reads DOCKER_CONFIG/config.json)
  ansible.builtin.copy:
    content: "{{ pull_secret | to_nice_json }}"
    dest: "{{ operator_compat_workspace }}/config.json"
    mode: '0600'
  no_log: true

- name: Check installed opm version
  ansible.builtin.command: "{{ bin_dir }}/opm version"
  register: _opm_version_check
  changed_when: false
  failed_when: false

# opm isn't part of this repo's usual prerequisites (only oc-mirror is) -- it's
# only needed for this standalone compatibility check, so it's downloaded here
# rather than added to install_disconnected_prerequisites. Matches the target
# OCP minor's client tools, from the same mirror.openshift.com layout oc/
# oc-mirror/openshift-install already come from -- but UNLIKE those, opm's
# tarball is not a flat single binary named `opm`: it ships OS-suffixed
# (opm-linux.tar.gz -> opm-rhel8, opm-linux-rhel9.tar.gz -> opm-rhel9).
# Confirmed live (control node is RHEL 9): extracting opm-linux.tar.gz
# "succeeds" but silently leaves {{ bin_dir }}/opm-rhel8 on disk, not
# {{ bin_dir }}/opm, so the very next task calling `opm` fails with ENOENT
# despite the download reporting no error. Use the rhel9 tarball and rename
# explicitly rather than relying on `tar --transform` inside unarchive.
- name: Download and extract opm matching the target OCP minor's client tools
  ansible.builtin.unarchive:
    src: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest-{{ target_ocp_version }}/opm-linux-rhel9.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: yes
    mode: '0755'
  when: >
    force_update | default(false) | bool or
    _opm_version_check.rc != 0

- name: Rename extracted opm-rhel9 binary to opm
  ansible.builtin.copy:
    src: "{{ bin_dir }}/opm-rhel9"
    dest: "{{ bin_dir }}/opm"
    remote_src: yes
    mode: '0755'
  when: >
    force_update | default(false) | bool or
    _opm_version_check.rc != 0

# `opm render` has no "just this package" flag -- it renders the whole
# catalog's declarative config as NDJSON, filtered per-package below with jq.
# This can take a few minutes for the full redhat-operator-index.
#
# MUST redirect straight to disk, never `register:` this output. The
# rendered redhat-operator-index is ~200MB/3.2M lines -- confirmed live this
# OOM-killed the Ansible worker (opm itself peaks under 300MB; `register`
# capturing stdout/stdout_lines plus the shared-memory round-trip to the
# parent process ballooned that to ~2.9GB on a 7.4GB jumphost with no swap,
# "ERROR! A worker was found in a dead state" ~6.5 minutes into the task).
- name: Render the target redhat-operator-index catalog (can take a few minutes)
  ansible.builtin.shell: >
    {{ bin_dir }}/opm render
    registry.redhat.io/redhat/redhat-operator-index{{
      (':v' ~ target_ocp_version)
      if redhat_operator_index_digest | default('') == ''
      else ('@sha256:' ~ redhat_operator_index_digest)
    }}
    -o json
    > {{ operator_compat_workspace }}/redhat-operator-index.json
  environment:
    DOCKER_CONFIG: "{{ operator_compat_workspace }}"
  changed_when: true
  when: disconnected.operators | default([]) | length > 0

- name: Render the target community-operator-index catalog (if configured)
  ansible.builtin.shell: >
    {{ bin_dir }}/opm render
    registry.redhat.io/redhat/community-operator-index{{
      (':v' ~ target_ocp_version)
      if community_operator_index_digest | default('') == ''
      else ('@sha256:' ~ community_operator_index_digest)
    }}
    -o json
    > {{ operator_compat_workspace }}/community-operator-index.json
  environment:
    DOCKER_CONFIG: "{{ operator_compat_workspace }}"
  changed_when: true
  when: disconnected.community_operators | default([]) | length > 0

# Used below as a best-effort "did this package get renamed/merged" signal
# when a configured operator has zero channels in the target catalog. OLM
# catalogs have no "this package was renamed to X" field -- Red Hat does
# rename/merge operators across OCP minors (ODF packages in particular) with
# no catalog-level pointer to the replacement -- so this is name-similarity
# only, not authoritative. Always confirm manually via the operator's release
# notes.
- name: Get full package list from the target redhat-operator-index catalog
  ansible.builtin.shell: >
    set -o pipefail;
    jq -s '[.[] | select(.schema=="olm.package") | .name] | unique | sort'
    {{ operator_compat_workspace }}/redhat-operator-index.json
  args:
    executable: /bin/bash
  register: _redhat_catalog_all_packages
  changed_when: false
  when: disconnected.operators | default([]) | length > 0

- name: Get full package list from the target community-operator-index catalog
  ansible.builtin.shell: >
    set -o pipefail;
    jq -s '[.[] | select(.schema=="olm.package") | .name] | unique | sort'
    {{ operator_compat_workspace }}/community-operator-index.json
  args:
    executable: /bin/bash
  register: _community_catalog_all_packages
  changed_when: false
  when: disconnected.community_operators | default([]) | length > 0

- name: Look up each configured redhat operator's channels in the target catalog
  ansible.builtin.shell: >
    set -o pipefail;
    jq -s '[.[] | select(.schema=="olm.channel" and .package=="{{ item.name }}") | .name] | unique | sort'
    {{ operator_compat_workspace }}/redhat-operator-index.json
  args:
    executable: /bin/bash
  register: _redhat_operator_channels
  changed_when: false
  loop: "{{ disconnected.operators | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: disconnected.operators | default([]) | length > 0

- name: Look up each configured community operator's channels in the target catalog
  ansible.builtin.shell: >
    set -o pipefail;
    jq -s '[.[] | select(.schema=="olm.channel" and .package=="{{ item.name }}") | .name] | unique | sort'
    {{ operator_compat_workspace }}/community-operator-index.json
  args:
    executable: /bin/bash
  register: _community_operator_channels
  changed_when: false
  loop: "{{ disconnected.community_operators | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: disconnected.community_operators | default([]) | length > 0

- name: Initialize compatibility rows accumulator
  ansible.builtin.set_fact:
    _compat_rows: []

- name: Build compatibility rows for redhat operators
  ansible.builtin.set_fact:
    _compat_rows: "{{ _compat_rows + [_compat_row] }}"
  vars:
    _configured: "{{ item.item.channels | default([]) | map(attribute='name') | list }}"
    _available: "{{ item.stdout | from_json }}"
    _all_packages: "{{ _redhat_catalog_all_packages.stdout | from_json }}"
    _name_tokens: "{{ item.item.name.split('-') | reject('in', ['operator', 'csi', 'addons']) | list }}"
    _compat_row:
      name: "{{ item.item.name }}"
      configured: "{{ _configured }}"
      available: "{{ _available }}"
      missing: "{{ _configured | difference(_available) }}"
      candidates: >-
        {{
          (_all_packages
            | reject('equalto', item.item.name)
            | select('search', '(' ~ (_name_tokens | map('regex_escape') | join('|')) ~ ')')
            | list)
          if (_available | length == 0 and _name_tokens | length > 0)
          else []
        }}
  loop: "{{ _redhat_operator_channels.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: disconnected.operators | default([]) | length > 0

- name: Build compatibility rows for community operators
  ansible.builtin.set_fact:
    _compat_rows: "{{ _compat_rows + [_compat_row] }}"
  vars:
    _configured: "{{ item.item.channels | default([]) | map(attribute='name') | list }}"
    _available: "{{ item.stdout | from_json }}"
    _all_packages: "{{ _community_catalog_all_packages.stdout | from_json }}"
    _name_tokens: "{{ item.item.name.split('-') | reject('in', ['operator', 'csi', 'addons']) | list }}"
    _compat_row:
      name: "{{ item.item.name }}"
      configured: "{{ _configured }}"
      available: "{{ _available }}"
      missing: "{{ _configured | difference(_available) }}"
      candidates: >-
        {{
          (_all_packages
            | reject('equalto', item.item.name)
            | select('search', '(' ~ (_name_tokens | map('regex_escape') | join('|')) ~ ')')
            | list)
          if (_available | length == 0 and _name_tokens | length > 0)
          else []
        }}
  loop: "{{ _community_operator_channels.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: disconnected.community_operators | default([]) | length > 0

- name: Split compatibility rows into needs-update vs ok
  ansible.builtin.set_fact:
    _compat_needs_update: "{{ _compat_rows | selectattr('missing', '!=', []) | list }}"
    _compat_ok: "{{ _compat_rows | selectattr('missing', '==', []) | list }}"

# debug's `msg:` as a single multi-line string gets JSON-escaped (literal
# \n) by Ansible's default output callback, unreadable in the terminal.
# Split into a list of lines instead -- debug prints each list element on
# its own line with no escaping.
- name: Build summary text
  ansible.builtin.set_fact:
    _compat_summary_text: |-
      ==================================================================
      Operator Channel Compatibility Summary -- target OCP {{ target_ocp_version }}
      ==================================================================
      {% if _compat_needs_update | length > 0 %}
      INVENTORY UPDATE NEEDED ({{ _compat_needs_update | length }} operator{{ 's' if _compat_needs_update | length != 1 else '' }}):
      {% for row in _compat_needs_update %}
        - {{ row.name }}
            Configured channel(s) not found for OCP {{ target_ocp_version }}: {{ row.missing | join(', ') }}
            Available channels in the v{{ target_ocp_version }} catalog: {{ row.available | join(', ') if row.available | length > 0 else '(none -- package may have been removed/renamed)' }}
      {% if row.available | length == 0 %}
      {% if row.candidates | default([]) | length > 0 %}
            Possible replacement package(s) (name similarity only, NOT confirmed -- verify manually): {{ row.candidates | join(', ') }}
      {% else %}
            No similarly-named package found in the target catalog either -- check the operator's release notes directly.
      {% endif %}
      {% endif %}
            Update disconnected.operators[].channels (or disconnected.community_operators[].channels) for '{{ row.name }}' in your inventory.
      {% endfor %}
      {% else %}
      No channel renames detected -- every configured channel still exists in the v{{ target_ocp_version }} catalog. No inventory changes required.
      {% endif %}
      {% if _compat_ok | length > 0 %}

      No channel-name change needed ({{ _compat_ok | length }} operator{{ 's' if _compat_ok | length != 1 else '' }}, still verify release notes):
      {% for row in _compat_ok %}
        - {{ row.name }}: {{ row.configured | join(', ') }}
      {% endfor %}
      {% endif %}
      ==================================================================
      Reminder: "present in catalog" only proves the channel name still exists
      for OCP {{ target_ocp_version }} -- it does not confirm the operator's
      bundle on that channel is certified for OCP {{ target_ocp_version }}.
      Always cross-check the operator's own release notes before upgrading.
      ==================================================================

- name: "[Summary] Operator channel compatibility for target OCP {{ target_ocp_version }}"
  ansible.builtin.debug:
    msg: "{{ _compat_summary_text.split('\n') }}"
