---
# ==============================================================================
# PATCH CLUSTER IDMS — HUB + SPOKES
#
# Applies the new IDMS manifests (pointing at Quay on the hub) to the hub
# cluster and propagates them to all managed spoke clusters via ManifestWork.
# After this role completes, the jumphost mirror registry is no longer needed.
#
# Prerequisites: remirror_to_quay must have run first (sets quay_idms_manifests,
# quay_catalogsource_manifests, quay_registry_url, quay_mirror_org).
# ==============================================================================

# ------------------------------------------------------------------------------
# HUB CLUSTER: allow insecure pulls from the Quay route
#
# The Quay route uses the cluster ingress CA which is not in the CRI-O trust
# store by default. Rather than distributing the CA (which requires a second
# MCO roll and relies on the Image Registry Operator to propagate it), mark
# the Quay hostname as an insecureRegistry. CRI-O skips TLS verification for
# that hostname, and the MCO roll triggered here distributes that setting
# reliably to all nodes.
# ------------------------------------------------------------------------------
- name: Get current insecureRegistries from cluster Image CR
  ansible.builtin.shell: |
    {{ bin_dir }}/oc get image.config.openshift.io cluster \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.spec.registrySources.insecureRegistries[*]}' 2>/dev/null || true
  register: _current_insecure
  changed_when: false

- name: Add Quay registry to insecureRegistries in cluster Image CR
  ansible.builtin.shell: |
    set -e
    CURRENT=$({{ bin_dir }}/oc get image.config.openshift.io cluster \
      --kubeconfig {{ target_kubeconfig }} \
      -o json 2>/dev/null)
    UPDATED=$(echo "$CURRENT" | jq -c \
      --arg quay "{{ quay_registry_url }}" \
      '.spec.registrySources.insecureRegistries = (
        (.spec.registrySources.insecureRegistries // [])
        + [$quay] | unique
      )')
    echo "$UPDATED" | {{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -
  args:
    executable: /bin/bash
  when: quay_registry_url not in (_current_insecure.stdout | default(''))
  register: _image_cr_patch
  changed_when: true

# ------------------------------------------------------------------------------
# HUB CLUSTER: apply new IDMS + CatalogSource
#
# oc-mirror v2 always names its generated IDMS/ITMS objects the same way
# (idms-release-0, idms-operator-0, ...) regardless of destination -- confirmed
# live: the jumphost's initial mirror and this later Quay re-mirror produced
# objects with IDENTICAL names. `oc apply`-ing Quay's manifests as-is replaces
# the jumphost's objects outright (same name = same object) instead of adding
# a second mirror source, leaving registry.redhat.io resolving to Quay ONLY.
# That's a self-hosting deadlock waiting to happen: if anything later forces
# Quay's own operand pods (postgres/redis/clair/quay-app itself) to re-pull
# their images -- an operator upgrade, node replacement, eviction -- there is
# no other source left once jumphost egress is also revoked (see below),
# because Quay can't serve its own images while it's down. Confirmed live:
# exactly this happened days after a successful migrate_mirror run.
#
# Rename every Quay IDMS/ITMS object before applying so it coexists
# alongside the jumphost's original, unrenamed one instead of replacing it --
# OCP merges the mirrors from ALL ImageDigestMirrorSet/ImageTagMirrorSet
# objects for a given source into one registries.conf, so this makes the
# jumphost a live fallback mirror for as long as it remains reachable
# (i.e. until the lockdown step further down actually revokes it).
- name: Flatten Quay IDMS/ITMS manifests into individual documents
  ansible.builtin.set_fact:
    _quay_idms_docs: "{{ quay_idms_manifests | map('from_yaml_all') | list | sum(start=[]) }}"

- name: Rename each Quay IDMS/ITMS document to avoid colliding with the jumphost's same-named mirror objects
  ansible.builtin.set_fact:
    _quay_idms_docs_renamed: >-
      {{ (_quay_idms_docs_renamed | default([])) + [
        item | combine({'metadata': item.metadata | combine({'name': item.metadata.name ~ '-quay'})}, recursive=True)
      ] }}
  loop: "{{ _quay_idms_docs }}"
  loop_control:
    label: "{{ item.metadata.name }}-quay"

- name: Apply Quay IDMS manifests to hub cluster
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ item | to_nice_yaml }}"
  loop: "{{ _quay_idms_docs_renamed }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  changed_when: true

- name: Disable default OperatorHub catalog sources on hub
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: config.openshift.io/v1
      kind: OperatorHub
      metadata:
        name: cluster
      spec:
        disableAllDefaultSources: true
  when: disable_default_catalog_sources | bool
  changed_when: true

- name: Update redhat-operators CatalogSource to use Quay index image
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: operators.coreos.com/v1alpha1
      kind: CatalogSource
      metadata:
        name: redhat-operators
        namespace: openshift-marketplace
      spec:
        sourceType: grpc
        image: "{{ quay_catalog_image }}"
        displayName: "Red Hat Operators (Quay Mirror)"
        publisher: "Red Hat (Quay Mirror)"
        updateStrategy:
          registryPoll:
            interval: 30m
  changed_when: true

# ------------------------------------------------------------------------------
# SPOKE CLUSTERS: propagate via ManifestWork
#
# Same same-name collision risk as the hub above: configure_disconnected_cluster
# applied the jumphost's unrenamed idms-release-0/idms-operator-0 directly to
# each spoke during its own bootstrap, so pushing Quay's manifests under those
# same names here would replace them instead of adding a second mirror source.
# Reuse the already-renamed documents from the hub apply above.
#
# klusterlet-work-sa's only ClusterRoleBinding with cluster-wide reach binds
# to the built-in `admin` ClusterRole, which only covers NAMESPACED resource
# types aggregated into it -- it does NOT cover cluster-scoped
# ImageDigestMirrorSet/ImageTagMirrorSet/OperatorHub (config.openshift.io),
# and OLM's CatalogSource CRD isn't aggregate-to-admin labeled either.
# Confirmed live: every ManifestWork pushing this config to a spoke silently
# sat Applied=False/AppliedManifestWorkFailed ("cannot get resource
# imagedigestmirrorsets/imagetagmirrorsets/operatorhubs ... cannot update
# catalogsources") -- the spoke was still on the jumphost mirror with a
# floating catalog tag, with nothing in this role (previously, no Applied
# wait at all) catching it. Grant klusterlet-work-sa the missing permissions
# directly against the spoke's own kubeconfig (this control node already has
# every cluster's kubeconfig under install_dir -- same convention as
# hub_kubeconfig elsewhere in this playbook) before pushing any ManifestWork
# that needs them -- a ManifestWork itself can't grant the RBAC it needs to
# apply, so this can't be done via ManifestWork.
# ------------------------------------------------------------------------------
- name: Grant klusterlet-work-sa permission to manage mirror/catalog config on each spoke
  ansible.builtin.shell:
    cmd: >-
      {{ bin_dir }}/oc apply
      --kubeconfig {{ install_dir }}/{{ hostvars[item].ocp_cluster.name }}/auth/kubeconfig
      -f -
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: klusterlet-work-mirror-config
      rules:
        - apiGroups: ["config.openshift.io"]
          resources: ["imagedigestmirrorsets", "imagetagmirrorsets", "operatorhubs"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
        - apiGroups: ["operators.coreos.com"]
          resources: ["catalogsources"]
          verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: klusterlet-work-mirror-config
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: klusterlet-work-mirror-config
      subjects:
        - kind: ServiceAccount
          name: klusterlet-work-sa
          namespace: open-cluster-management-agent
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  changed_when: true

- name: Push updated IDMS to spokes via ManifestWork
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: work.open-cluster-management.io/v1
      kind: ManifestWork
      metadata:
        name: "{{ hostvars[item].ocp_cluster.name }}-quay-idms"
        namespace: "{{ hostvars[item].ocp_cluster.name }}"
      spec:
        workload:
          manifests: {{ _quay_idms_docs_renamed | to_json }}
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  changed_when: true

- name: Push updated CatalogSource and OperatorHub config to spokes via ManifestWork
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: work.open-cluster-management.io/v1
      kind: ManifestWork
      metadata:
        name: "{{ hostvars[item].ocp_cluster.name }}-quay-catalog"
        namespace: "{{ hostvars[item].ocp_cluster.name }}"
      spec:
        workload:
          manifests:
            - apiVersion: config.openshift.io/v1
              kind: OperatorHub
              metadata:
                name: cluster
              spec:
                disableAllDefaultSources: true
            - apiVersion: operators.coreos.com/v1alpha1
              kind: CatalogSource
              metadata:
                name: redhat-operators
                namespace: openshift-marketplace
              spec:
                sourceType: grpc
                image: "{{ quay_catalog_image }}"
                displayName: "Red Hat Operators (Quay Mirror)"
                publisher: "Red Hat (Quay Mirror)"
                updateStrategy:
                  registryPoll:
                    interval: 30m
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  changed_when: true

# Both ManifestWorks above can report "changed" from a successful `oc apply`
# while OCM never actually manages to apply the workload onto the spoke --
# confirmed live, this exact gap let a spoke sit on the jumphost mirror with
# a floating catalog tag indefinitely with no failure anywhere in this role.
- name: Wait for Quay IDMS ManifestWork to apply successfully on each spoke
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get manifestwork {{ hostvars[item].ocp_cluster.name }}-quay-idms
    -n {{ hostvars[item].ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Applied")].status}'
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  register: _quay_idms_manifestwork_applied
  until: _quay_idms_manifestwork_applied.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false

- name: Wait for Quay CatalogSource ManifestWork to apply successfully on each spoke
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get manifestwork {{ hostvars[item].ocp_cluster.name }}-quay-catalog
    -n {{ hostvars[item].ocp_cluster.name }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Applied")].status}'
  loop: "{{ groups['managed_clusters'] | default([]) }}"
  loop_control:
    label: "{{ hostvars[item].ocp_cluster.name }}"
  register: _quay_catalog_manifestwork_applied
  until: _quay_catalog_manifestwork_applied.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false

# ------------------------------------------------------------------------------
# Wait for hub MachineConfigPools to roll out the new IDMS config
# ------------------------------------------------------------------------------
# Wait for MCO to detect and begin the rolling update before checking
# completion. Without this pre-wait, the existing Updated=True condition
# (from a prior roll) can pass the completion check immediately, before
# the controller has even noticed the new IDMS config.
- name: Wait for master MachineConfigPool to begin updating (MCO detection window)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp master
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updating")].status}'
  register: _master_mcp_updating
  until: _master_mcp_updating.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false
  failed_when: false
  when: _image_cr_patch is changed

- name: Wait for master MachineConfigPool to finish updating
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp master
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}'
  register: _master_mcp
  until: _master_mcp.stdout == "True"
  retries: 60
  delay: 30
  changed_when: false

- name: Wait for worker MachineConfigPool to begin updating (MCO detection window)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp worker
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updating")].status}'
  register: _worker_mcp_updating
  until: _worker_mcp_updating.stdout == "True"
  retries: 12
  delay: 15
  changed_when: false
  failed_when: false
  when: _image_cr_patch is changed

- name: Wait for worker MachineConfigPool to finish updating
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp worker
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}'
  register: _worker_mcp
  until: _worker_mcp.stdout == "True"
  retries: 60
  delay: 30
  changed_when: false

- name: Display IDMS patch summary
  ansible.builtin.debug:
    msg:
      - "Cluster IDMS patched to use Quay mirror"
      - "Hub IDMS applied:         {{ quay_idms_manifests | length }} manifest(s)"
      - "Hub CatalogSource image:  {{ quay_catalog_image }}"
      - "Spokes updated:           {{ groups['managed_clusters'] | default([]) | length }}"
      - "The jumphost mirror registry is no longer required."
