---
- name: Create oc-mirror workspace directory
  ansible.builtin.file:
    state: directory
    path: "{{ oc_mirror_workspace }}"
    mode: '0755'

# Pin the operator catalog(s) by digest once resolved (see the discovery/
# persist tasks near the end of this file) so a later, separate oc-mirror
# invocation against this same imageset-config.yaml (ocp/remirror_to_quay
# copies this file verbatim, possibly hours or days later) resolves the
# EXACT same catalog content, instead of whatever registry.redhat.io's
# floating `:v{{ openshift_version }}` tag happens to point at by then.
# Confirmed live: the floating tag moved between the initial jumphost
# mirror and a later migrate_mirror run, pushing openshift-gitops-operator
# 1.21.7 into Quay while the cluster had already installed 1.21.6 from the
# jumphost mirror -- the installed CSV's image digests were never pushed to
# Quay, breaking the already-running operator once the IDMS repointed it.
- name: Read persisted redhat-operator-index catalog digest if already pinned
  ansible.builtin.slurp:
    src: "{{ oc_mirror_workspace }}/.redhat-operator-index-digest"
  register: _redhat_operator_index_digest_raw
  failed_when: false

- name: Set redhat-operator-index catalog digest fact
  ansible.builtin.set_fact:
    redhat_operator_index_digest: >-
      {{ (_redhat_operator_index_digest_raw.content | b64decode | trim)
         if _redhat_operator_index_digest_raw.content is defined
         else '' }}

- name: Read persisted community-operator-index catalog digest if already pinned
  ansible.builtin.slurp:
    src: "{{ oc_mirror_workspace }}/.community-operator-index-digest"
  register: _community_operator_index_digest_raw
  failed_when: false
  when: disconnected.community_operators is defined and disconnected.community_operators | length > 0

- name: Set community-operator-index catalog digest fact
  ansible.builtin.set_fact:
    community_operator_index_digest: >-
      {{ (_community_operator_index_digest_raw.content | b64decode | trim)
         if _community_operator_index_digest_raw.content is defined
         else '' }}
  when: disconnected.community_operators is defined and disconnected.community_operators | length > 0

- name: Template ImageSetConfiguration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/imageset-config.yaml.j2"
    dest: "{{ oc_mirror_workspace }}/imageset-config.yaml"
    mode: '0644'

- name: Display ImageSetConfiguration
  ansible.builtin.debug:
    msg: "ImageSetConfiguration written to {{ oc_mirror_workspace }}/imageset-config.yaml"

# Consider mirroring complete only when BOTH the IDMS and a CatalogSource file
# exist. A partial rc=14 failure writes the IDMS but not the CatalogSource, so
# checking only for the IDMS causes re-runs to skip mirroring while leaving
# oc_mirror_catalogsource_manifests empty.
- name: Check for existing oc-mirror v2 IDMS/ITMS results
  ansible.builtin.find:
    paths: "{{ oc_mirror_workspace }}/working-dir/cluster-resources"
    patterns:
      - "idms-*.yaml"
      - "imageDigestMirrorSet*.yaml"
      - "itms-*.yaml"
      - "imageTagMirrorSet*.yaml"
    file_type: file
  register: existing_idms
  failed_when: false

- name: Check for existing oc-mirror v2 CatalogSource results
  ansible.builtin.find:
    paths: "{{ oc_mirror_workspace }}/working-dir/cluster-resources"
    patterns: "cs-*.yaml"
    file_type: file
  register: existing_cs
  failed_when: false

- name: Read mirror version sentinel if present
  ansible.builtin.slurp:
    src: "{{ oc_mirror_workspace }}/.mirror-version"
  register: _existing_mirror_version
  failed_when: false

- name: Check existing CatalogSource files for a valid image pointing to the local mirror registry
  ansible.builtin.shell: |
    python3 -c "
    import glob, sys
    try:
        import yaml
    except ImportError:
        import subprocess, sys
        subprocess.check_call([sys.executable, '-m', 'pip', 'install', 'pyyaml', '-q'])
        import yaml
    cs_dir = '{{ oc_mirror_workspace }}/working-dir/cluster-resources'
    mirror = '{{ mirror_registry_url }}'
    valid = False
    for f in glob.glob(cs_dir + '/cs-*.yaml'):
        for doc in yaml.safe_load_all(open(f)):
            if doc and doc.get('kind') == 'CatalogSource':
                img = doc.get('spec', {}).get('image', '')
                if img and mirror in img:
                    valid = True
    print('valid' if valid else 'invalid')
    "
  register: _cs_image_valid
  changed_when: false
  failed_when: false

# Require that IDMS files, CatalogSource files, a version sentinel matching
# the current version, AND a cs-*.yaml whose spec.image references the local
# mirror registry all exist before skipping. The image check prevents stale
# workspace files (e.g. from a failed Quay remirror that overwrote cs-*.yaml
# with image:"") from suppressing a fresh mirror run.
- name: Set oc-mirror completion flag
  ansible.builtin.set_fact:
    _oc_mirror_complete: >-
      {{ existing_idms.files | default([]) | length > 0
         and existing_cs.files | default([]) | length > 0
         and (_existing_mirror_version.content | default('') | b64decode | trim)
             == (openshift_version ~ '.' ~ ocp_patch_version)
         and _cs_image_valid.stdout | default('invalid') == 'valid' }}

- name: Print log path for live monitoring
  ansible.builtin.debug:
    msg: >
      Starting oc-mirror. This may take 60-120+ minutes depending on bandwidth.
      Monitor progress: tail -f {{ oc_mirror_workspace }}/.oc-mirror.log
      or: watch -n 5 'du -sh {{ oc_mirror_workspace }}'
  when: not _oc_mirror_complete

- name: Create auth directory for oc-mirror credentials
  ansible.builtin.file:
    state: directory
    path: "{{ oc_mirror_workspace }}/containers"
    mode: '0700'
  when: not _oc_mirror_complete

- name: Write merged pull secret for oc-mirror authentication
  ansible.builtin.copy:
    src: "{{ mirror_registry_dir }}/pull-secret-merged.json"
    dest: "{{ oc_mirror_workspace }}/containers/auth.json"
    mode: '0600'
  when: not _oc_mirror_complete

- name: Run oc-mirror to mirror content to registry
  ansible.builtin.command: >
    {{ bin_dir }}/oc-mirror
    --v2
    --config {{ oc_mirror_workspace }}/imageset-config.yaml
    --workspace file://{{ oc_mirror_workspace }}
    docker://{{ mirror_registry_url }}/{{ mirror_base_path }}
  environment:
    XDG_RUNTIME_DIR: "{{ oc_mirror_workspace }}"
  args:
    chdir: "{{ oc_mirror_workspace }}"
  async: 7200
  poll: 0
  register: oc_mirror_job
  when: not _oc_mirror_complete

- name: Wait for oc-mirror to complete (up to 2 hours)
  ansible.builtin.async_status:
    jid: "{{ oc_mirror_job.ansible_job_id }}"
  register: oc_mirror_result
  until: oc_mirror_result.finished
  retries: 240
  delay: 30
  when: oc_mirror_job is defined and oc_mirror_job.ansible_job_id is defined
  # rc=4: partial success — manifest format incompatibility with certain multi-arch images.
  # rc=12/14: partial failure — transient network errors or auth issues for a subset of images.
  #           IDMS is still generated; failed images are retried below with oc image mirror.
  # All are handled by the retry block below. Check working-dir/logs/mirroring_errors_*.txt.
  failed_when:
    - oc_mirror_result.finished
    - oc_mirror_result.rc not in [0, 4, 12, 14]

# ==============================================================================
# WORKAROUND: oc-mirror v2 manifest format bug
#
# oc-mirror v2 fails with rc=4 on certain multi-arch manifest list images
# (notably multicluster-engine/hive-rhel9) because it cannot convert the
# manifest format while preserving digests. This leaves required operator
# images out of the mirror and causes downstream operator install failures.
#
# Workaround: after rc=4, parse the error log and retry failed images using
# `oc image mirror --filter-by-os=linux/amd64`, which copies only the
# linux/amd64 layer and avoids the manifest format constraint.
#
# NOTE: This produces a single-arch image with a different digest than the
# original multi-arch manifest. The IDMS from oc-mirror references the
# original multi-arch digest, so the cluster will fall through to the mirror
# via tag rather than digest. This is acceptable for operator images.
#
# REMOVE THIS BLOCK when the upstream oc-mirror v2 bug is fixed:
# https://github.com/openshift/oc-mirror/issues (search: "preserve digests manifest list")
# ==============================================================================
- name: Find oc-mirror v2 error log
  ansible.builtin.find:
    paths: "{{ oc_mirror_workspace }}/working-dir/logs"
    patterns: "mirroring_errors_*.txt"
    file_type: file
  register: oc_mirror_error_logs
  when:
    - oc_mirror_result is defined
    - oc_mirror_result.rc is defined
    - oc_mirror_result.rc in [4, 12, 14]

- name: Extract failed non-bundle image refs from error log
  ansible.builtin.shell: >
    grep -oP 'docker://\S+' {{ (oc_mirror_error_logs.files | sort(attribute='path') | last).path }}
    | grep -v 'operator-bundle'
    | sort -u
  register: failed_images_raw
  when:
    - oc_mirror_error_logs is defined
    - oc_mirror_error_logs.files | default([]) | length > 0
  changed_when: false
  failed_when: false

# Destination MUST carry an explicit :sha256-<digest> tag -- without one, oc
# image mirror pushes to the bare repository with no tag at all, which is
# invisible to anything that looks the image up by tag (as the verification
# gate below, and any manual inspection, does) even though the manifest/blob
# content did land. Match the `sha256-<digest>` tag convention oc-mirror v2
# itself uses for every successfully mirrored image in this registry.
- name: Retry failed images with oc image mirror (linux/amd64 only)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc image mirror
    --filter-by-os=linux/amd64
    --insecure=true
    -a {{ oc_mirror_workspace }}/containers/auth.json
    {{ item | regex_replace('^docker://', '') }}
    {{ mirror_registry_url }}/{{ mirror_base_path }}/{{ item | regex_replace('^docker://[^/]+/', '') | regex_replace('@sha256:[a-f0-9]+$', '') }}:{{ item | regex_replace('^.*@sha256:', 'sha256-') }}
  loop: "{{ failed_images_raw.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item | regex_replace('^docker://', '') | truncate(80, True, '...') }}"
  when:
    - failed_images_raw is defined
    - failed_images_raw.stdout_lines | default([]) | length > 0
  register: _retry_failed_images
  changed_when: true
  retries: 3
  delay: 10
  until: _retry_failed_images.rc == 0

- name: Extract failed operator bundle image refs from error log
  ansible.builtin.shell: >
    grep -oP 'docker://\S+' {{ (oc_mirror_error_logs.files | sort(attribute='path') | last).path }}
    | grep 'operator-bundle'
    | sort -u
  register: failed_bundles_raw
  when:
    - oc_mirror_error_logs is defined
    - oc_mirror_error_logs.files | default([]) | length > 0
  changed_when: false
  failed_when: false

# Same explicit-tag fix as the non-bundle retry above, plus retries -- these
# are large multi-GB manifest-list images (e.g. quay-builder-qemu-rhcos) and
# a single attempt timing out against the mirror registry under load (seen
# live as a ~1.5s "success" that silently pushed nothing) must not be
# swallowed by failed_when: false anymore.
- name: Retry failed operator bundle images with oc image mirror
  ansible.builtin.shell: >
    {{ bin_dir }}/oc image mirror
    --insecure=true
    -a {{ oc_mirror_workspace }}/containers/auth.json
    {{ item | regex_replace('^docker://', '') }}
    {{ mirror_registry_url }}/{{ mirror_base_path }}/{{ item | regex_replace('^docker://[^/]+/', '') | regex_replace('@sha256:[a-f0-9]+$', '') }}:{{ item | regex_replace('^.*@sha256:', 'sha256-') }}
  loop: "{{ failed_bundles_raw.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item | regex_replace('^docker://', '') | truncate(80, True, '...') }}"
  when:
    - failed_bundles_raw is defined
    - failed_bundles_raw.stdout_lines | default([]) | length > 0
  register: _retry_failed_bundles
  changed_when: true
  retries: 3
  delay: 10
  until: _retry_failed_bundles.rc == 0

- name: Display oc-mirror partial failure summary
  ansible.builtin.debug:
    msg:
      - "WARNING: oc-mirror rc={{ oc_mirror_result.rc }} — some images failed and were retried with 'oc image mirror'."
      - "rc=4: manifest format incompatibility; rc=14: transient network failure."
      - "See {{ oc_mirror_workspace }}/working-dir/logs/ for details."
      - "Remove the workaround block in mirror_ocp_content/tasks/main.yaml when oc-mirror v2 fixes the manifest preservation bug."
  when:
    - oc_mirror_result is defined
    - oc_mirror_result.rc is defined
    - oc_mirror_result.rc in [4, 12, 14]

# Both retry tasks above can report "changed" while having pushed nothing --
# confirmed live: a ~1.5s "successful" oc image mirror run against a ~2GB
# manifest-list image, with the destination digest a flat 404 afterward.
# Don't trust the shell rc alone; HEAD each retried image's digest against
# the mirror registry and fail the whole mirror phase if any are still
# missing, rather than letting a silent gap reach cluster install (where it
# surfaces hours later as an opaque ImagePullBackOff/BundleUnpackFailed).
- name: Verify retried images actually landed in the mirror registry
  ansible.builtin.command: >
    {{ bin_dir }}/oc image info
    --insecure=true
    --registry-config={{ oc_mirror_workspace }}/containers/auth.json
    {{ mirror_registry_url }}/{{ mirror_base_path }}/{{ item | regex_replace('^docker://[^/]+/', '') | regex_replace('@sha256:[a-f0-9]+$', '') }}@{{ item | regex_replace('^.*@', '') }}
  loop: "{{ (failed_images_raw.stdout_lines | default([])) + (failed_bundles_raw.stdout_lines | default([])) }}"
  loop_control:
    label: "{{ item | regex_replace('^docker://', '') | truncate(80, True, '...') }}"
  register: _retried_image_verify
  changed_when: false
  failed_when: false

- name: Fail if any retried image is still missing from the mirror registry
  ansible.builtin.fail:
    msg: >-
      The following images were reported mirrored by the 'oc image mirror'
      retry above but are NOT retrievable by digest from the mirror
      registry: {{ _retried_image_verify.results
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list }}.
      This usually means the push silently timed out on a large multi-arch
      blob. Re-run this role (mirror_ocp_content) to retry, or inspect
      {{ oc_mirror_workspace }}/working-dir/logs/ for the original error.
  when:
    - _retried_image_verify.results is defined
    - _retried_image_verify.results | selectattr('rc', 'ne', 0) | list | length > 0

# When rc=14 oc-mirror exits before generating the CatalogSource (cs-*.yaml)
# because 0 operator images were mirrored. The oc image mirror retry above
# restores the images, but cluster-resources are not regenerated. Re-run
# oc-mirror so it produces the cs-*.yaml; all images are now in the destination
# so this second run only verifies and writes cluster-resources (fast).
- name: Re-run oc-mirror to regenerate cluster-resources after rc=14 image recovery
  ansible.builtin.command: >
    {{ bin_dir }}/oc-mirror
    --v2
    --config {{ oc_mirror_workspace }}/imageset-config.yaml
    --workspace file://{{ oc_mirror_workspace }}
    docker://{{ mirror_registry_url }}/{{ mirror_base_path }}
  environment:
    XDG_RUNTIME_DIR: "{{ oc_mirror_workspace }}"
  args:
    chdir: "{{ oc_mirror_workspace }}"
  async: 7200
  poll: 0
  register: oc_mirror_regen_job
  when:
    - oc_mirror_result is defined
    - oc_mirror_result.rc is defined
    - oc_mirror_result.rc == 14

- name: Wait for oc-mirror cluster-resource regeneration to complete
  ansible.builtin.async_status:
    jid: "{{ oc_mirror_regen_job.ansible_job_id }}"
  register: oc_mirror_regen_result
  until: oc_mirror_regen_result.finished
  retries: 240
  delay: 30
  when:
    - oc_mirror_regen_job is defined
    - oc_mirror_regen_job.ansible_job_id is defined
  failed_when:
    - oc_mirror_regen_result.finished
    - oc_mirror_regen_result.rc not in [0, 4]

# ImageDigestMirrorSet only redirects pulls that already resolve to a
# digest. Tag-based pulls (e.g. the ODF console-patch Job's `:latest`
# reference) are never rewritten by IDMS at all -- the kubelet resolves the
# tag against the original registry first, which fails outright under
# network lockdown. oc-mirror v2 generates a separate ImageTagMirrorSet
# (itms-*.yaml) for exactly this case; collect it alongside IDMS/ICSP so
# tag-based additionalImages actually get redirected once applied.
- name: Find IDMS/ITMS files in oc-mirror v2 cluster-resources output
  ansible.builtin.find:
    paths: "{{ oc_mirror_workspace }}/working-dir/cluster-resources"
    patterns:
      - "idms-*.yaml"
      - "imageDigestMirrorSet*.yaml"
      - "imageContentSourcePolicy*.yaml"
      - "itms-*.yaml"
      - "imageTagMirrorSet*.yaml"
    file_type: file
  register: idms_files

- name: Find CatalogSource files in oc-mirror v2 cluster-resources output
  ansible.builtin.find:
    paths: "{{ oc_mirror_workspace }}/working-dir/cluster-resources"
    patterns: "cs-*.yaml"
    file_type: file
  register: catalogsource_files

- name: Read all IDMS manifests
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ idms_files.files }}"
  register: idms_contents

- name: Read all CatalogSource manifests
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ catalogsource_files.files }}"
  register: catalogsource_contents

- name: Set mirroring result facts for downstream roles
  ansible.builtin.set_fact:
    oc_mirror_idms_manifests: "{{ idms_contents.results | map(attribute='content') | map('b64decode') | list }}"
    oc_mirror_catalogsource_manifests: "{{ catalogsource_contents.results | map(attribute='content') | map('b64decode') | list }}"

# oc-mirror caches the catalog it actually pulled under a directory named for
# the resolved manifest-list digest -- read that back (rather than resolving
# it ourselves against the registry, which would need extra tooling/auth
# handling) and persist it so imageset-config.yaml ends up pinned by digest
# on disk, not just in this run's facts. Runs unconditionally (not gated on
# a fresh mirror this run) so re-running this role against an
# already-mirrored workspace retroactively pins an existing unpinned file.
- name: Discover the resolved redhat-operator-index catalog digest
  ansible.builtin.find:
    paths: "{{ oc_mirror_workspace }}/working-dir/operator-catalogs/redhat-operator-index"
    file_type: directory
  register: _redhat_operator_index_digest_dirs

- name: Persist the resolved redhat-operator-index catalog digest
  ansible.builtin.copy:
    content: "{{ (_redhat_operator_index_digest_dirs.files | sort(attribute='mtime') | last).path | basename }}"
    dest: "{{ oc_mirror_workspace }}/.redhat-operator-index-digest"
    mode: '0644'
  when: _redhat_operator_index_digest_dirs.files | default([]) | length > 0

- name: Discover the resolved community-operator-index catalog digest
  ansible.builtin.find:
    paths: "{{ oc_mirror_workspace }}/working-dir/operator-catalogs/community-operator-index"
    file_type: directory
  register: _community_operator_index_digest_dirs
  when: disconnected.community_operators is defined and disconnected.community_operators | length > 0

- name: Persist the resolved community-operator-index catalog digest
  ansible.builtin.copy:
    content: "{{ (_community_operator_index_digest_dirs.files | sort(attribute='mtime') | last).path | basename }}"
    dest: "{{ oc_mirror_workspace }}/.community-operator-index-digest"
    mode: '0644'
  when:
    - disconnected.community_operators is defined and disconnected.community_operators | length > 0
    - _community_operator_index_digest_dirs.files | default([]) | length > 0

- name: Re-read catalog digest facts after discovery
  ansible.builtin.set_fact:
    redhat_operator_index_digest: >-
      {{ (_redhat_operator_index_digest_dirs.files | sort(attribute='mtime') | last).path | basename
         if _redhat_operator_index_digest_dirs.files | default([]) | length > 0
         else redhat_operator_index_digest }}
    community_operator_index_digest: >-
      {{ (_community_operator_index_digest_dirs.files | sort(attribute='mtime') | last).path | basename
         if (_community_operator_index_digest_dirs.files | default([]) | length > 0)
         else community_operator_index_digest | default('') }}

# Re-templates the same file written at the top of this role, now with the
# catalog digest(s) pinned -- a no-op on repeat runs once already pinned
# (same digest rediscovered, same content re-rendered). This is the file
# ocp/remirror_to_quay copies verbatim for its own, later oc-mirror pass.
- name: Re-template ImageSetConfiguration now that the catalog digest is pinned
  ansible.builtin.template:
    src: "{{ role_path }}/templates/imageset-config.yaml.j2"
    dest: "{{ oc_mirror_workspace }}/imageset-config.yaml"
    mode: '0644'

# oc-mirror can exit with an "allowed" rc (0/4/12/14) yet have mirrored
# nothing at all -- e.g. a total collection-phase abort (invalid operator
# channel for the target index) finishes in seconds with rc=4, which the
# partial-failure handling above treats as "some images failed, retried".
# Catch that here instead of silently writing the sentinel and reporting
# success: downstream roles (create_manual_cloud_credentials,
# configure_disconnected_cluster) then fail much later against an empty
# registry with an opaque "unauthorized" error.
- name: Fail if oc-mirror produced no mirrored content at all
  ansible.builtin.assert:
    that:
      - idms_files.files | length > 0
      - catalogsource_files.files | length > 0
    fail_msg: >-
      oc-mirror produced zero IDMS/ITMS and zero CatalogSource manifests --
      nothing was actually mirrored to the registry, even though it exited
      with an allowed return code. This usually means a total collection
      failure (e.g. a channel in disconnected.operators[] that doesn't exist
      in the target catalog index) rather than a partial image failure.
      Check {{ oc_mirror_workspace }}/working-dir/logs/ for a "collection
      error" near the start of the run, fix disconnected.operators[] in the
      inventory, and re-run -- the sentinel has not been written so this
      step will retry.

- name: Write mirror version sentinel
  ansible.builtin.copy:
    content: "{{ openshift_version }}.{{ ocp_patch_version }}"
    dest: "{{ oc_mirror_workspace }}/.mirror-version"
    mode: '0644'

- name: Display mirroring summary
  ansible.builtin.debug:
    msg:
      - "oc-mirror complete"
      - "Cluster resources: {{ oc_mirror_workspace }}/working-dir/cluster-resources"
      - "IDMS manifests found: {{ idms_files.files | length }}"
      - "CatalogSource manifests found: {{ catalogsource_files.files | length }}"
