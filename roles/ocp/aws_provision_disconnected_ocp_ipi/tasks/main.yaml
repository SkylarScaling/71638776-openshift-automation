---
- name: Check if cluster directory already exists
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ ocp_cluster.name }}"
  register: cluster_dir_stat

- name: Check if auth directory exists
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ ocp_cluster.name }}/auth"
  register: auth_dir_stat

- name: Check if kubeadmin password exists
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeadmin-password"
  register: kubeadmin_pwd_stat

# openshift-install writes auth/kubeconfig and kubeadmin-password to disk
# early — well before the cluster is actually up — so their mere presence
# does not mean the install succeeded. A failed/abandoned attempt (e.g.
# bootstrap timing out) leaves these files behind too, which previously
# caused this role to silently skip re-provisioning forever on re-runs.
# Verify the cluster is actually reachable before trusting those files.
- name: Check if an existing cluster is actually reachable
  ansible.builtin.command: >
    {{ bin_dir }}/oc get clusterversion
    --kubeconfig {{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeconfig
    --request-timeout=15s
  register: _existing_cluster_health
  changed_when: false
  failed_when: false
  when:
    - cluster_dir_stat.stat.exists
    - auth_dir_stat.stat.exists
    - kubeadmin_pwd_stat.stat.exists

- name: Set cluster-actually-installed fact
  ansible.builtin.set_fact:
    _cluster_actually_installed: >-
      {{ cluster_dir_stat.stat.exists and auth_dir_stat.stat.exists and kubeadmin_pwd_stat.stat.exists
         and _existing_cluster_health is defined and _existing_cluster_health.rc == 0 }}

- name: Skip provisioning if cluster exists and is reachable
  ansible.builtin.debug:
    msg: "Cluster directory already exists and the cluster is reachable, skipping provisioning..."
  when: _cluster_actually_installed

- name: Warn about a stale/failed install that will be cleaned up and retried
  ansible.builtin.debug:
    msg: >-
      Found existing install files for {{ ocp_cluster.name }} but the cluster
      is not reachable (stale or failed install) — destroying any leftover
      AWS infrastructure and reinstalling from scratch.
  when:
    - cluster_dir_stat.stat.exists
    - not _cluster_actually_installed

- name: Kill any orphaned openshift-install process for this cluster
  # Bracket-break one character of the pattern (e.g. "a[c]m-hub" instead of
  # "acm-hub") so it doesn't literally appear in this very shell invocation's
  # own command line — pkill -f matches against full process cmdlines,
  # including its parent `sh -c '...'` wrapper, so an exact self-referential
  # pattern here kills that wrapper (SIGTERM, rc=-15) before `|| true` can run.
  ansible.builtin.shell: >
    pkill -f "openshift-install.*{{ ocp_cluster.name[0] }}[{{ ocp_cluster.name[1] }}]{{ ocp_cluster.name[2:] }}" 2>/dev/null || true
  changed_when: false
  when:
    - cluster_dir_stat.stat.exists
    - not _cluster_actually_installed

- name: Check if install metadata exists (needed to destroy stale cloud infrastructure)
  ansible.builtin.stat:
    path: "{{ install_dir }}/{{ ocp_cluster.name }}/metadata.json"
  register: _stale_metadata_stat
  when:
    - cluster_dir_stat.stat.exists
    - not _cluster_actually_installed

# A failed/abandoned install still leaves real, billable AWS resources behind
# (bootstrap/master instances, the private hosted zone, NLBs, IAM roles...).
# Deleting only the local directory would orphan all of that — run the
# installer's own destroy first so it tears down everything tagged with this
# attempt's infra ID before we start a fresh one.
- name: Destroy stale cloud infrastructure from a previous failed install
  ansible.builtin.command: >
    {{ bin_dir }}/openshift-install destroy cluster
    --dir={{ install_dir }}/{{ ocp_cluster.name }}
    --log-level=info
  environment:
    AWS_PROFILE: "ocp-{{ ocp_cluster.name }}"
    AWS_SESSION_TOKEN: ""
  async: 1800
  poll: 0
  register: _destroy_job
  when:
    - cluster_dir_stat.stat.exists
    - not _cluster_actually_installed
    - _stale_metadata_stat.stat.exists | default(false)

- name: Wait for stale infrastructure destroy to complete
  ansible.builtin.async_status:
    jid: "{{ _destroy_job.ansible_job_id }}"
  register: _destroy_result
  until: _destroy_result.finished
  retries: 60
  delay: 30
  when:
    - _destroy_job is defined
    - _destroy_job.ansible_job_id is defined
  failed_when:
    - _destroy_result.finished
    - _destroy_result.rc != 0

- name: Remove partial install directory to ensure clean start
  ansible.builtin.file:
    path: "{{ install_dir }}/{{ ocp_cluster.name }}"
    state: absent
  when:
    - cluster_dir_stat.stat.exists
    - not _cluster_actually_installed

- name: Provision Disconnected Cluster on AWS
  block:
    - name: create install_dir to work in
      ansible.builtin.file:
        state: directory
        path: "{{ install_dir }}/{{ ocp_cluster.name }}"
      register: install_path

    - name: Write cluster fingerprint for pre-flight verification
      ansible.builtin.copy:
        dest: "{{ install_path.path }}/.cluster-fingerprint"
        mode: '0644'
        content: |
          cluster_name: "{{ ocp_cluster.name }}"
          base_domain: "{{ base_domain }}"
          aws_account_id: "{{ aws.account_id }}"
          aws_region: "{{ aws.aws_region }}"
          disconnected: true
          mirror_registry: "{{ mirror_registry_url }}"

    - name: print install_dir location for admin
      ansible.builtin.debug:
        msg: "The working directory location is {{ install_path.path }}"

    - name: Create .aws directory
      ansible.builtin.file:
        path: "~/.aws"
        state: directory
        mode: "0755"

    - name: Configure AWS credentials for cluster-scoped named profile
      ansible.builtin.ini_file:
        path: "~/.aws/credentials"
        section: "ocp-{{ ocp_cluster.name }}"
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        mode: '0600'
      loop:
        - { option: 'aws_access_key_id', value: '{{ aws.aws_access_key_id }}' }
        - { option: 'aws_secret_access_key', value: '{{ aws.aws_secret_access_key }}' }
        - { option: 'aws_region', value: '{{ aws.aws_region }}' }

    - name: Populate disconnected install-config template
      ansible.builtin.template:
        src: "{{ role_path }}/templates/install-config.yaml.j2"
        dest: "{{ install_path.path }}/install-config.yaml"

    - name: Generate installer manifests (needed to inject Manual-mode credential Secrets)
      ansible.builtin.command: >
        {{ bin_dir }}/openshift-install create manifests
        --dir={{ install_path.path }}
        --log-level=info
      environment:
        AWS_PROFILE: "ocp-{{ ocp_cluster.name }}"
        AWS_SESSION_TOKEN: ""
      changed_when: true
      when: disconnected.network_lockdown.enabled | default(true)

    # CCO mint mode needs iam.amazonaws.com, which is unreachable from a
    # no-IGW/no-NAT Cluster VPC. credentialsMode: Manual (install-config.yaml.j2)
    # skips that validation but requires each CredentialsRequest's Secret to
    # already exist in manifests/ before `create cluster` runs.
    - name: Pre-create Manual-mode cloud credential Secrets
      ansible.builtin.include_role:
        name: ocp/create_manual_cloud_credentials
      when: disconnected.network_lockdown.enabled | default(true)

    # Neither route53.amazonaws.com nor tagging.us-east-1.amazonaws.com has an
    # interface VPC endpoint in any commercial AWS region, so the in-cluster
    # ingress operator can never reach Route53 from the locked-down Cluster
    # VPC to manage the *.apps record itself — it fails forever with
    # "NoZones: The record isn't present in any zones". Tell it not to try;
    # aws/create_apps_wildcard_dns_record (below) creates the record instead,
    # from the jumphost, which has real AWS access.
    - name: Write default IngressController manifest (Unmanaged apps DNS)
      ansible.builtin.copy:
        dest: "{{ install_path.path }}/manifests/cluster-ingress-default-ingresscontroller.yaml"
        mode: '0644'
        content: |
          apiVersion: operator.openshift.io/v1
          kind: IngressController
          metadata:
            name: default
            namespace: openshift-ingress-operator
          spec:
            domain: apps.{{ ocp_cluster.name }}.{{ base_domain }}
            endpointPublishingStrategy:
              type: LoadBalancerService
              loadBalancer:
                scope: Internal
                dnsManagementPolicy: Unmanaged
      when: disconnected.network_lockdown.enabled | default(true)

    - name: Print log path for live monitoring
      ansible.builtin.debug:
        msg: "Installer starting (disconnected). For live output: tail -f {{ install_path.path }}/.openshift_install.log"

    - name: Run IPI installer
      ansible.builtin.command: >
        {{ bin_dir }}/openshift-install create cluster
        --dir={{ install_path.path }}
        --log-level=info
      environment:
        AWS_PROFILE: "ocp-{{ ocp_cluster.name }}"
        AWS_SESSION_TOKEN: ""
      async: 10800
      poll: 0
      register: cluster_deploy

    # Under network lockdown, openshift-install (running here, on the
    # jumphost) is outside the Cluster VPC that the new private hosted zone
    # gets associated with — without this, bootstrap fails trying to resolve
    # api.<cluster>.<base_domain>. Runs concurrently with the async install
    # job above; the zone appears well before the installer needs to resolve
    # it. See aws/associate_private_zone_with_jumphost for details.
    - name: Associate the cluster's private DNS zone with the jumphost VPC
      ansible.builtin.include_role:
        name: aws/associate_private_zone_with_jumphost
      vars:
        private_zone_domain: "{{ ocp_cluster.name }}.{{ base_domain }}"
      when: disconnected.network_lockdown.enabled | default(true)

    # The default IngressController is set to dnsManagementPolicy: Unmanaged
    # above, so nothing else will ever create *.apps. Runs concurrently with
    # the async install job; the router's load balancer doesn't exist until
    # well into cluster initialization, long after bootstrap, so this polls
    # for it rather than running once early like the zone association above.
    - name: Create the *.apps wildcard DNS record
      ansible.builtin.include_role:
        name: aws/create_apps_wildcard_dns_record
      vars:
        _metadata_json_path: "{{ install_path.path }}/metadata.json"
      when: disconnected.network_lockdown.enabled | default(true)

    # VPC peering (provision_cluster_vpc) only opens a network path between
    # the jumphost VPC and the Cluster VPC — it does not touch security
    # groups. The installer's auto-created node security groups only allow
    # ingress from the cluster's own machineNetwork by default, so without
    # this the jumphost can't SSH the bootstrap node for log gathering or
    # reach the API/MCS, even though routing is fine. Runs concurrently with
    # the async install job above; metadata.json (and the infra ID) exists
    # well before the installer needs to reach the bootstrap node or the API.
    - name: Allow the jumphost ingress to the cluster's node security groups
      ansible.builtin.include_role:
        name: aws/allow_jumphost_ingress_to_nodes
      vars:
        _metadata_json_path: "{{ install_path.path }}/metadata.json"
      when: disconnected.network_lockdown.enabled | default(true)

    - name: Check the status of the install
      ansible.builtin.async_status:
        jid: "{{ cluster_deploy.ansible_job_id }}"
      register: job_status
      until: job_status.finished
      retries: 360
      delay: 30
  when: not _cluster_actually_installed

# Re-run outside the block above too (idempotent — the role tolerates an
# already-associated VPC and the zone-wait loop resolves instantly once it
# exists) so a re-run that skips the block entirely, because the cluster was
# already installed, still converges. Without this, a cluster installed
# before this association existed — or one where the first attempt never
# reached this task — stays permanently unresolvable from the jumphost.
- name: Ensure the cluster's private DNS zone is associated with the jumphost VPC
  ansible.builtin.include_role:
    name: aws/associate_private_zone_with_jumphost
  vars:
    private_zone_domain: "{{ ocp_cluster.name }}.{{ base_domain }}"
  when: disconnected.network_lockdown.enabled | default(true)

- debug:
    msg: "Cluster console available at: https://console-openshift-console.apps.{{ ocp_cluster.name }}.{{ base_domain }}/"

- name: Get kubeconfig auth
  set_fact:
    kubefile: "{{ install_dir }}/{{ ocp_cluster.name }}/auth/kubeadmin-password"

- name: Slurp the remote file
  ansible.builtin.slurp:
    src: "{{ kubefile }}"
  register: remote_kube_file

- debug:
    msg: "kubeadmin pw: {{ remote_kube_file['content'] | b64decode }}"
