---
- name: Check if opm is already installed
  ansible.builtin.stat:
    path: "{{ bin_dir }}/opm"
  register: opm_stat

- name: Download opm archive
  ansible.builtin.get_url:
    url: "{{ openshift_mirror_url }}/opm-linux.tar.gz"
    dest: "/tmp/opm.tar.gz"
    mode: '0644'
  when: force_update | bool or not opm_stat.stat.exists

- name: Extract opm binary (handles opm-rhel8 naming in some releases)
  ansible.builtin.shell: |
    binary=$(tar tzf /tmp/opm.tar.gz | grep -E '^opm' | head -1)
    tar xzf /tmp/opm.tar.gz -C {{ bin_dir }} "${binary}"
    if [ "${binary}" != "opm" ]; then
      mv {{ bin_dir }}/${binary} {{ bin_dir }}/opm
    fi
    chmod 0755 {{ bin_dir }}/opm
  when: force_update | bool or not opm_stat.stat.exists
  changed_when: true

- name: Verify opm installation
  ansible.builtin.command: "{{ bin_dir }}/opm version"
  register: opm_version_output
  changed_when: false

- name: Display opm version
  ansible.builtin.debug:
    msg: "{{ opm_version_output.stdout_lines }}"
