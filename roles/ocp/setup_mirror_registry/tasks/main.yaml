---
- name: Set fact for whether the mirror registry hostname is a bare IP address
  ansible.builtin.set_fact:
    _quay_hostname_is_ip: "{{ mirror_registry_hostname is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$') }}"

# jumphost_private_ip is hand-maintained in the inventory and easily left
# stale across a rebuilt jumphost (confirmed live: an inventory still
# pointing at a previous jumphost's IP baked that dead IP into Quay's
# SERVER_HOSTNAME and TLS cert, and the healthcheck then failed with
# EHOSTUNREACH against an address nothing in the VPC owns). Catch that
# before spending ~10 minutes running the installer against the wrong value.
- name: Assert the mirror registry hostname is an address this host actually owns
  ansible.builtin.assert:
    that:
      - mirror_registry_hostname in ansible_all_ipv4_addresses
    fail_msg: >-
      mirror_registry_hostname is {{ mirror_registry_hostname }} but this host's
      addresses are {{ ansible_all_ipv4_addresses | join(', ') }}. jumphost_private_ip
      in the inventory is stale (likely left over from a previous jumphost). Correct
      it before installing — the value is baked into Quay's SERVER_HOSTNAME and TLS
      cert.
  when:
    - _quay_hostname_is_ip
    - ansible_all_ipv4_addresses is defined

- name: Check if mirror registry is already running
  ansible.builtin.uri:
    url: "https://{{ mirror_registry_hostname }}:{{ mirror_registry_port }}/health/instance"
    validate_certs: false
    status_code: [200, 301]
    timeout: 30
  register: registry_health
  failed_when: false
  changed_when: false

- name: Skip mirror registry setup if already running
  ansible.builtin.debug:
    msg: "Mirror registry is already running at {{ mirror_registry_hostname }}:{{ mirror_registry_port }}, skipping setup."
  when: registry_health.status | default(0) in [200, 301]

# Previous installation detection and the hostname-change check below run
# unconditionally — not gated on registry_health — because a registry that
# answers 200 can still be serving the *wrong* hostname/cert (e.g. right
# after jumphost_private_ip gets corrected in the inventory): the health
# probe uses validate_certs: false, so a mismatched cert doesn't fail it.
# Gating this on an unhealthy registry made "running but wrong cert" an
# unrecoverable-by-rerun state (confirmed live).
- name: Check if mirror registry was previously installed (quay-config directory present)
  ansible.builtin.stat:
    path: "{{ mirror_registry_dir }}/quay-config/config.yaml"
  register: _quay_config_stat

# mirror-registry bakes --quayHostname into both SERVER_HOSTNAME and the
# self-signed TLS cert's SAN at install time. If the desired hostname has
# changed since then (e.g. inventory.jumphost_private_ip got corrected, or
# network_lockdown.enabled flipped so the hostname source switched), simply
# rewriting SERVER_HOSTNAME is not enough — oc-mirror and every cluster node
# still get "x509: cannot validate certificate ... doesn't contain any IP
# SANs" because the cert itself still matches the old hostname. The cert can
# only be regenerated by a full uninstall + fresh install with the new value.
- name: Read current Quay SERVER_HOSTNAME from config.yaml
  ansible.builtin.command: grep "^SERVER_HOSTNAME:" "{{ mirror_registry_dir }}/quay-config/config.yaml"
  register: _quay_current_hostname
  changed_when: false
  failed_when: false
  when: _quay_config_stat.stat is defined and _quay_config_stat.stat.exists

- name: Set fact for whether the installed registry's hostname has changed
  ansible.builtin.set_fact:
    _quay_hostname_changed: >-
      {{ _quay_config_stat.stat.exists
         and (_quay_current_hostname.stdout | default('') | trim)
             != ('SERVER_HOSTNAME: ' ~ mirror_registry_hostname ~ ':' ~ mirror_registry_port) }}
  when: _quay_config_stat.stat is defined and _quay_config_stat.stat.exists

- name: Uninstall mirror registry (hostname changed — cert must be regenerated)
  ansible.builtin.command: >
    {{ bin_dir }}/mirror-registry uninstall
    --quayRoot {{ mirror_registry_dir }}
    --autoApprove
  register: _quay_uninstall
  changed_when: true
  when: _quay_hostname_changed | default(false)

- name: Treat registry as not previously installed after uninstalling for a hostname change
  ansible.builtin.set_fact:
    _quay_config_stat: "{{ _quay_config_stat | combine({'stat': {'exists': false}}) }}"
    registry_health: {}
  when: _quay_hostname_changed | default(false)

# Our custom IP-SAN cert (see below) is keyed to the old hostname and the
# "creates:" guard on its generation task would otherwise skip regenerating
# it for the new one.
- name: Remove stale custom mirror registry cert after a hostname change
  ansible.builtin.file:
    path: "{{ mirror_registry_dir }}/custom-ssl"
    state: absent
  when: _quay_hostname_changed | default(false)

- name: Start existing mirror registry installation (stopped after host restart)
  ansible.builtin.command: >
    {{ bin_dir }}/mirror-registry start
    --quayHostname {{ mirror_registry_hostname }}
    --quayRoot {{ mirror_registry_dir }}
  register: _registry_start
  changed_when: true
  when:
    - registry_health.status | default(0) not in [200, 301]
    - _quay_config_stat.stat is defined and _quay_config_stat.stat.exists

# After mirror-registry start the Quay containers can take several minutes to
# become ready. Poll with a per-attempt timeout so we don't block indefinitely
# on slow public-hostname TCP connections. 40 retries × 15s = 10 minutes max.
- name: Wait for started mirror registry to be healthy
  ansible.builtin.uri:
    url: "https://{{ mirror_registry_hostname }}:{{ mirror_registry_port }}/health/instance"
    validate_certs: false
    status_code: [200, 301]
    timeout: 30
  register: _registry_post_start_health
  until: _registry_post_start_health.status | default(0) in [200, 301]
  retries: 40
  delay: 15
  when:
    - _quay_config_stat.stat is defined and _quay_config_stat.stat.exists

# Use the post-start result to gate the install block. Setting registry_health
# here prevents the install block from running when the registry was started
# rather than freshly installed.
- name: Mark registry as running after successful start
  ansible.builtin.set_fact:
    registry_health: "{{ _registry_post_start_health }}"
  when:
    - _quay_config_stat.stat is defined and _quay_config_stat.stat.exists
    - _registry_post_start_health.status | default(0) in [200, 301]

- name: Fail if existing mirror registry could not be started
  ansible.builtin.fail:
    msg: >-
      mirror-registry start was attempted but the registry did not become healthy
      within 10 minutes. Check Podman container logs:
        podman logs quay-app
        podman logs quay-redis
  when:
    - _quay_config_stat.stat is defined and _quay_config_stat.stat.exists
    - _registry_post_start_health.status | default(0) not in [200, 301]

- name: Install and configure mirror registry
  block:
    - name: Create mirror registry data directory
      ansible.builtin.file:
        state: directory
        path: "{{ mirror_registry_dir }}"
        mode: '0755'

    # mirror-registry's built-in self-signed cert generation only ever puts
    # the hostname in as a DNS-type SAN, even when --quayHostname is a bare
    # IP address (the only option network lockdown leaves available — see
    # DISCONNECTED-NETWORK-LOCKDOWN.md). Quay's own startup config validator
    # then refuses to start ("x509: ... doesn't contain any IP SANs"). Work
    # around it by generating our own self-signed cert with a proper IP SAN
    # and handing it to the installer via --sslCert/--sslKey, which it copies
    # in as-is instead of generating its own.
    - name: Generate a self-signed cert with an IP SAN for the mirror registry
      when: _quay_hostname_is_ip
      block:
        - name: Create directory for the custom mirror registry cert
          ansible.builtin.file:
            state: directory
            path: "{{ mirror_registry_dir }}/custom-ssl"
            mode: '0755'

        - name: Write OpenSSL config with an IP SAN
          ansible.builtin.copy:
            dest: "{{ mirror_registry_dir }}/custom-ssl/openssl.cnf"
            mode: '0644'
            content: |
              [req]
              distinguished_name = req_distinguished_name
              x509_extensions = v3_req
              prompt = no
              [req_distinguished_name]
              CN = {{ mirror_registry_hostname }}
              [v3_req]
              basicConstraints = CA:TRUE
              keyUsage = digitalSignature, keyEncipherment, keyCertSign
              extendedKeyUsage = serverAuth
              subjectAltName = IP:{{ mirror_registry_hostname }}

        - name: Generate the self-signed cert and key
          ansible.builtin.command: >
            openssl req -x509 -nodes -newkey rsa:4096
            -keyout {{ mirror_registry_dir }}/custom-ssl/ssl.key
            -out {{ mirror_registry_dir }}/custom-ssl/ssl.cert
            -days 3650
            -config {{ mirror_registry_dir }}/custom-ssl/openssl.cnf
          args:
            creates: "{{ mirror_registry_dir }}/custom-ssl/ssl.cert"

    - name: Run mirror-registry installer
      ansible.builtin.command: >
        {{ bin_dir }}/mirror-registry install
        --quayHostname {{ mirror_registry_hostname }}
        --quayRoot {{ mirror_registry_dir }}
        --initUser {{ mirror_registry_init_user }}
        --initPassword {{ mirror_registry_init_password }}
        {{ '--sslCert ' ~ mirror_registry_dir ~ '/custom-ssl/ssl.cert --sslKey ' ~ mirror_registry_dir ~ '/custom-ssl/ssl.key' if _quay_hostname_is_ip else '' }}
      register: mirror_registry_install
      changed_when: "'has been installed' in mirror_registry_install.stdout"

    - name: Display mirror registry install output
      ansible.builtin.debug:
        msg: "{{ mirror_registry_install.stdout_lines[-5:] }}"

    # mirror-registry has no --quayConfig install flag; patch config.yaml directly.
    # PUSH_TEMP_TAG_EXPIRATION_SEC (default 300s) controls how long an in-progress
    # blob upload session is kept alive — raise it so large OCP release blobs in
    # mirrorToMirror mode don't time out mid-transfer.
    - name: Extend Quay upload session timeout in generated config
      ansible.builtin.lineinfile:
        path: "{{ mirror_registry_dir }}/quay-config/config.yaml"
        regexp: "^PUSH_TEMP_TAG_EXPIRATION_SEC:"
        line: "PUSH_TEMP_TAG_EXPIRATION_SEC: {{ mirror_registry_push_timeout }}"
        insertafter: EOF
      become: true

    - name: Find Quay app container name
      ansible.builtin.shell: |
        podman ps --format json | python3 -c "
        import sys, json
        for c in json.load(sys.stdin):
            name = (c.get('Names') or [''])[0]
            nl = name.lower()
            if 'quay' in nl and 'postgres' not in nl and 'redis' not in nl:
                print(name)
                break
        "
      register: _quay_container_name
      changed_when: false
      failed_when: _quay_container_name.stdout | trim == ""

    - name: Restart Quay container to apply config change
      ansible.builtin.command: "podman restart {{ _quay_container_name.stdout | trim }}"
      changed_when: true

    - name: Wait for registry to be healthy after restart
      ansible.builtin.uri:
        url: "https://{{ mirror_registry_hostname }}:{{ mirror_registry_port }}/health/instance"
        validate_certs: false
        status_code: [200, 301]
      register: _registry_restart_health
      until: _registry_restart_health.status in [200, 301]
      retries: 20
      delay: 10
      failed_when: false
  when: registry_health.status is not defined or registry_health.status not in [200, 301]

# When a custom IP-SAN cert was supplied via --sslCert, mirror-registry does
# not generate quay-rootCA/rootCA.pem — our self-signed cert is both leaf and
# trust anchor, so clients need that one instead.
- name: Set mirror registry CA cert path
  ansible.builtin.set_fact:
    mirror_registry_ca_cert_path: >-
      {{ (mirror_registry_dir ~ '/custom-ssl/ssl.cert')
         if _quay_hostname_is_ip
         else (mirror_registry_dir ~ '/quay-rootCA/rootCA.pem') }}

- name: Read mirror registry CA certificate
  ansible.builtin.slurp:
    src: "{{ mirror_registry_ca_cert_path }}"
  register: mirror_registry_ca_raw

- name: Set mirror registry facts for downstream roles
  ansible.builtin.set_fact:
    mirror_registry_url: "{{ mirror_registry_hostname }}:{{ mirror_registry_port }}"
    mirror_registry_ca_bundle: "{{ mirror_registry_ca_raw.content | b64decode }}"

- name: Trust the mirror registry CA on the jumphost
  ansible.builtin.copy:
    content: "{{ mirror_registry_ca_bundle }}"
    dest: "/etc/pki/ca-trust/source/anchors/mirror-registry-ca.pem"
    mode: '0644'
  become: true

- name: Update CA trust store
  ansible.builtin.command: update-ca-trust
  become: true
  changed_when: true

# RHEL 9 runs firewalld by default. mirror-registry configures Podman to
# listen on the registry port, but does not open the OS-level firewall.
# Without this rule, the AWS security group allows external traffic in but
# firewalld drops it before Podman sees it — cluster nodes get i/o timeout
# when pulling images even though the registry is running and the EC2 SG is open.
- name: Check if firewalld is installed
  ansible.builtin.command: which firewall-cmd
  register: _fw_available
  changed_when: false
  failed_when: false

- name: Open mirror registry port in firewalld
  ansible.builtin.command: >
    firewall-cmd --add-port={{ mirror_registry_port }}/tcp --permanent
  become: true
  register: _fw_rule
  changed_when: "'already' not in _fw_rule.stdout"
  failed_when: _fw_rule.rc != 0 and 'NOT_RUNNING' not in _fw_rule.stderr
  when: _fw_available.rc == 0

- name: Reload firewalld to apply rule
  ansible.builtin.command: firewall-cmd --reload
  become: true
  when: _fw_available.rc == 0 and _fw_rule is changed
  changed_when: true
  failed_when: false

- name: Build base64 auth token for mirror registry
  ansible.builtin.set_fact:
    mirror_registry_auth: "{{ (mirror_registry_init_user ~ ':' ~ mirror_registry_init_password) | b64encode }}"

- name: Build merged pull secret with mirror registry credentials
  ansible.builtin.set_fact:
    disconnected_pull_secret: >-
      {{
        pull_secret | combine({
          'auths': pull_secret.auths | combine({
            mirror_registry_url: {
              'auth': mirror_registry_auth,
              'email': ''
            }
          })
        })
      }}

- name: Write merged pull secret for oc-mirror authentication
  ansible.builtin.copy:
    content: "{{ disconnected_pull_secret | to_nice_json }}"
    dest: "{{ mirror_registry_dir }}/pull-secret-merged.json"
    mode: '0600'

- name: Display mirror registry connection info
  ansible.builtin.debug:
    msg:
      - "Mirror registry URL:    {{ mirror_registry_url }}"
      - "CA certificate:         {{ mirror_registry_ca_cert_path }}"
      - "Merged pull secret:     {{ mirror_registry_dir }}/pull-secret-merged.json"
