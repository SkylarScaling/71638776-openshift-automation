---
mirror_registry_dir: "{{ working_dir }}/mirror-registry"
# Under network lockdown the Cluster VPC has no Internet Gateway/NAT, and VPC
# peering only routes to the peer VPC's private CIDR — cluster nodes can never
# reach the jumphost's public IP/DNS, only jumphost_private_ip via the peering
# connection. Without this, Quay's cert/SERVER_HOSTNAME and the registry URL
# baked into every cluster's imageContentSources point nodes at an address
# they can't route to at all, and image pulls time out.
mirror_registry_hostname: >-
  {{ jumphost_private_ip
     if (disconnected.network_lockdown.enabled | default(true))
     else disconnected.mirror_registry.hostname }}
mirror_registry_port: "{{ disconnected.mirror_registry.port | default(8443) }}"
mirror_registry_init_user: "{{ disconnected.mirror_registry.init_user | default('init') }}"
mirror_registry_init_password: "{{ disconnected.mirror_registry.init_password }}"
# How long (seconds) Quay keeps an in-progress blob upload session alive.
# Default upstream is 300; 3600 accommodates large OCP release blobs in
# mirrorToMirror mode without being excessively permissive.
mirror_registry_push_timeout: 3600
