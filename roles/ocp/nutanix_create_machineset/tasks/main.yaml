---
- name: Check if pool configuration is provided
  ansible.builtin.assert:
    that:
      - pool_name is defined
      - pool_replicas is defined
      - pool_vcpu_sockets is defined
      - pool_cores_per_socket is defined
      - pool_memory_gib is defined
      - pool_disk_gib is defined
      - pool_labels is defined
      - pool_taints is defined
    msg: "Please define pool_name, pool_replicas, pool_vcpu_sockets, pool_cores_per_socket, pool_memory_gib, pool_disk_gib, pool_labels, and pool_taints."

- name: Skip if requested replicas are 0
  ansible.builtin.meta: end_host
  when: pool_replicas | int == 0

- name: Get Cluster Infrastructure Name (Cluster ID)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get infrastructure cluster
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.infrastructureName}'
  register: _infra_name
  changed_when: false

- name: Set cluster_id fact
  ansible.builtin.set_fact:
    cluster_id: "{{ _infra_name.stdout }}"

- name: Get all MachineSets in the machine-api namespace
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get machineset -n openshift-machine-api
    --kubeconfig {{ target_kubeconfig }}
    -o json 2>/dev/null || echo '{"items":[]}'
  register: _machinesets_raw
  changed_when: false

- name: Extract the first worker MachineSet
  ansible.builtin.set_fact:
    worker_machineset: >-
      {{
        (_machinesets_raw.stdout | from_json).items
        | selectattr('metadata.name', 'search', '-worker-')
        | first
        | default(None)
      }}

- name: Verify a worker MachineSet was found
  ansible.builtin.assert:
    that:
      - worker_machineset is not none
    fail_msg: "Could not find any MachineSets with '-worker-' in the name. Please verify the cluster has provisioned worker nodes and your KUBECONFIG is correct."

- name: Set image_name from the found worker MachineSet
  ansible.builtin.set_fact:
    nutanix_image_name: "{{ worker_machineset.spec.template.spec.providerSpec.value.image.name }}"

- name: Set MachineSet name
  ansible.builtin.set_fact:
    machineset_name: "{{ cluster_id }}-{{ pool_name }}"

- name: Display dynamically fetched Cluster ID and Image
  ansible.builtin.debug:
    msg:
      - "Cluster ID: {{ cluster_id }}"
      - "Image: {{ nutanix_image_name }}"
      - "Building Pool: {{ pool_name }} ({{ pool_replicas }} replicas)"

- name: Apply the generated MachineSet YAML to OpenShift cluster
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'machineset.yaml.j2') }}"
  changed_when: true

- name: Display MachineSet application status
  ansible.builtin.debug:
    msg: "Created MachineSet {{ machineset_name }} with {{ pool_replicas }} replicas."

- name: Wait for newly created {{ pool_name }} Nodes to be Ready
  include_tasks: wait_for_nodes.yaml
