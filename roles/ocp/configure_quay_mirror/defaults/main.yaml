---
quay_mirror_namespace: "{{ disconnected.quay_mirror.namespace | default('local-quay') }}"
quay_mirror_registry_name: "{{ disconnected.quay_mirror.registry_name | default('quay-registry') }}"
quay_mirror_org: "{{ disconnected.quay_mirror.org | default(disconnected.mirror_base_path | default('ocp4')) }}"
quay_mirror_robot_account: "{{ disconnected.quay_mirror.robot_account | default('mirror') }}"
quay_mirror_admin_user: "{{ disconnected.quay_mirror.admin_user | default('quayadmin') }}"
quay_mirror_admin_password: "{{ disconnected.quay_mirror.admin_password | default('RedHat123!') }}"

# AWS Classic ELB default idle timeout (60s) is too short for large blob
# uploads that go silent during Quay's object-storage commit. AWS caps
# Classic ELB idle timeout at 3600s.
quay_mirror_ingress_idle_timeout: "{{ disconnected.quay_mirror.ingress_idle_timeout | default('30m') }}"

# ODF creates the default NooBaa backing store with a single 50Gi pv-pool
# volume. Confirmed live: mirroring the full OCP release+operator payload
# (82G on the jumphost's own registry) OOMKills that single agent pod mid
# upload (NooBaa's 400Mi memory limit per agent isn't configurable via this
# CRD) and Quay returns a 500 on every subsequent blob write. Each extra
# volume adds another 50Gi and another agent pod, which both raises total
# capacity and spreads data across more of the fixed 400Mi ceilings.
quay_backing_store_num_volumes: "{{ disconnected.quay_mirror.backing_store_num_volumes | default(4) }}"

# Scaling the pv-pool above only raises total capacity — confirmed live it
# still OOMKills under the full mirror payload regardless (NooBaa's 400Mi
# per-agent ceiling applies no matter how many agents share the work, and
# Quay's server-side multipart assembly runs independently of client-side
# concurrency). ODF skips Ceph RGW on cloud platforms, so there's no
# in-cluster S3-compatible alternative — use a real AWS S3 bucket instead.
# The Cluster VPC already has an S3 gateway endpoint (aws/create_vpc_endpoints),
# so this works even under network lockdown with no internet egress.
quay_s3_storage_bucket: "{{ disconnected.quay_mirror.s3_bucket | default(ocp_cluster.name ~ '-quay-storage-' ~ aws.aws_region) }}"
