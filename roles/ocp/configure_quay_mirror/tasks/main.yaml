---
# ==============================================================================
# CONFIGURE QUAY AS MIRROR REGISTRY
#
# Waits for Quay to be healthy, then uses oc exec into the Quay app pod to
# configure everything via Quay's Python model layer: admin user, mirror org,
# robot account. Outputs the robot token for oc-mirror to use.
#
# All configuration bypasses the HTTP API (which requires CSRF/OAuth) by
# calling Quay's internal model functions directly in the container.
# ==============================================================================

# ODF's default NooBaa/MCG pv-pool backing store can't hold or serve the
# full OCP release+operator mirror payload: it hardcodes each pv-pool agent
# pod to a 400Mi memory limit with no CRD knob to raise it, and Quay's
# server-side multipart blob assembly OOMKills that agent regardless of
# pv-pool size or client-side concurrency (confirmed live via two separate
# ocp-debug investigations). ODF also skips deploying Ceph RGW (which would
# give an S3-compatible in-cluster alternative) on cloud platforms, so
# there's no in-cluster object-storage option at all on AWS. Use a real AWS
# S3 bucket instead — the Cluster VPC already has an S3 gateway endpoint
# (aws/create_vpc_endpoints), so this works under network lockdown with no
# internet egress required.
- name: Ensure AWS CLI is available
  ansible.builtin.include_role:
    name: aws/ensure_aws_cli

- name: Set AWS environment for Quay S3 storage tasks
  ansible.builtin.set_fact:
    _quay_s3_aws_env:
      AWS_ACCESS_KEY_ID: "{{ aws.aws_access_key_id }}"
      AWS_SECRET_ACCESS_KEY: "{{ aws.aws_secret_access_key }}"
      AWS_SESSION_TOKEN: ""

- name: Check if the Quay S3 storage bucket already exists
  ansible.builtin.command: >
    {{ bin_dir }}/aws s3api head-bucket
    --bucket {{ quay_s3_storage_bucket }}
    --region {{ aws.aws_region }}
  environment: "{{ _quay_s3_aws_env }}"
  register: _quay_s3_bucket_check
  changed_when: false
  failed_when: false

- name: Create the Quay S3 storage bucket
  ansible.builtin.command: >
    {{ bin_dir }}/aws s3api create-bucket
    --bucket {{ quay_s3_storage_bucket }}
    --region {{ aws.aws_region }}
    {{ ('--create-bucket-configuration LocationConstraint=' ~ aws.aws_region) if aws.aws_region != 'us-east-1' else '' }}
  environment: "{{ _quay_s3_aws_env }}"
  when: _quay_s3_bucket_check.rc != 0
  changed_when: true

- name: Block public access to the Quay S3 storage bucket
  ansible.builtin.command: >
    {{ bin_dir }}/aws s3api put-public-access-block
    --bucket {{ quay_s3_storage_bucket }}
    --region {{ aws.aws_region }}
    --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
  environment: "{{ _quay_s3_aws_env }}"
  when: _quay_s3_bucket_check.rc != 0
  changed_when: true

# Read-modify-write so we don't clobber FEATURE_USER_INITIALIZE/SUPER_USERS/
# etc. already set by gitops-install-quay's 04-init-config-bundle-secret.yaml.
- name: Read current Quay config bundle secret
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get secret init-config-bundle-secret
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.data.config\.yaml}' | base64 -d
  args:
    executable: /bin/bash
  register: _quay_current_config
  changed_when: false

# A plain substring check on "DISTRIBUTED_STORAGE_CONFIG" is not enough —
# confirmed live: a prior run left behind a config.yaml with that string
# present but the surrounding YAML corrupted (an indentation bug since
# fixed), and this guard treated that broken leftover as "already correct",
# skipping the whole rewrite + verification chain below on every subsequent
# run. Only trust it once it both parses and actually names our bucket.
# Uses a literal (|) block, not folded (>) — a folded scalar joins
# same-indentation lines with a single space, which would have collapsed
# this entire indentation-sensitive Python script onto one line. Confirmed
# live: this exact mistake is why the previous version of this task failed
# outright (it had used ">").
- name: Check whether Quay's config bundle already has valid S3 storage config for our bucket
  ansible.builtin.shell: |
    echo "{{ _quay_current_config.stdout | b64encode }}" | base64 -d > /tmp/_quay_current_config.yaml
    python3 - "{{ quay_s3_storage_bucket }}" <<'PYEOF'
    import sys, yaml
    bucket = sys.argv[1]
    try:
        cfg = yaml.safe_load(open('/tmp/_quay_current_config.yaml'))
        driver, args = cfg['DISTRIBUTED_STORAGE_CONFIG']['local_us']
        ok = driver == 'S3Storage' and args.get('s3_bucket') == bucket
    except Exception:
        ok = False
    print('true' if ok else 'false')
    PYEOF
    rm -f /tmp/_quay_current_config.yaml
  args:
    executable: /bin/bash
  register: _quay_already_on_s3_check
  changed_when: false
  no_log: true

- name: Set fact for whether Quay is already using S3 storage
  ansible.builtin.set_fact:
    _quay_already_on_s3: "{{ _quay_already_on_s3_check.stdout | trim == 'true' }}"

# apps_install_quay (which templates this Application, including the
# ignoreDifferences protecting this exact secret) only runs during the hub
# phase — a later re-run scoped to just --tags migrate_mirror never touches
# it, so the live Application can predate that protection even once the
# template has it. Confirmed live: without this, ArgoCD's selfHeal reverted
# our S3 config out of the secret 2 seconds after we applied it (no error
# anywhere in this role — the operator just silently refused to reconcile:
# "ConfigInvalid: objectstorage unmanaged but configBundleSecret missing
# necessary fields"), Quay's app pods kept running on the old NooBaa config,
# and remirror_to_quay failed with the exact same pv-pool OOM 500 as before
# the S3 switch. Patch the live object directly so this role is never
# dependent on apps_install_quay having run recently.
#
# ignoreDifferences alone only excludes a field from diff/OutOfSync
# computation — it does NOT stop a sync operation from overwriting that
# field. Confirmed live: ignoreDifferences correctly protected
# /spec/components (git never declares that field, so apply never touches
# it) but did nothing for the secret (git DOES declare config.yaml, so every
# sync re-applied git's version over ours, 2 seconds after our edit).
# RespectIgnoreDifferences=true is the sync option that actually makes sync
# itself skip the ignored paths instead of just hiding them from the diff.
- name: Ensure the Quay ArgoCD Application protects our storage secret edit from selfHeal
  ansible.builtin.command: >
    {{ bin_dir }}/oc patch applications.argoproj.io {{ quay_argocd_app_name }}
    -n {{ quay_argocd_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    --type=merge
    -p "{\"spec\":{\"ignoreDifferences\":[{\"group\":\"quay.redhat.com\",\"kind\":\"QuayRegistry\",\"jsonPointers\":[\"/spec/components\"]},{\"group\":\"\",\"kind\":\"Secret\",\"name\":\"init-config-bundle-secret\",\"jsonPointers\":[\"/data\",\"/stringData\"]}]},\"syncPolicy\":{\"syncOptions\":[\"CreateNamespace=true\",\"SkipDryRunOnMissingResource=true\",\"RespectIgnoreDifferences=true\"]}}"
  register: _quay_argocd_app_patch
  changed_when: "'no change' not in _quay_argocd_app_patch.stdout"
  when: not (_quay_already_on_s3 | bool)

- name: Wait for ArgoCD to pick up the ignoreDifferences update
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get applications.argoproj.io {{ quay_argocd_app_name }}
    -n {{ quay_argocd_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.spec.ignoreDifferences}'
  register: _quay_argocd_ignorediff_check
  changed_when: false
  until: "'init-config-bundle-secret' in _quay_argocd_ignorediff_check.stdout"
  retries: 10
  delay: 5
  when: not (_quay_already_on_s3 | bool)

# The patch above only guarantees the Application's desired spec includes
# the protection — ArgoCD's controller still needs a watch cycle to notice
# before it stops reverting live drift on its own. Give it a moment rather
# than racing straight into the secret apply below.
- name: Allow ArgoCD a moment to pick up the Application update before editing the secret
  ansible.builtin.pause:
    seconds: 15
  when: not (_quay_already_on_s3 | bool)

# The live secret can still be the corrupted leftover from an older,
# since-fixed bug (invalid YAML) — confirmed live this isn't hypothetical.
# from_yaml on that would hard-fail this task with no useful error under
# no_log. Fall back to the known-good GitOps baseline (gitops-install-quay's
# 04-init-config-bundle-secret.yaml) rather than crash, so a corrupted
# leftover self-heals on the next run instead of wedging it permanently.
- name: Parse current Quay config bundle
  ansible.builtin.set_fact:
    _quay_current_config_parsed: "{{ _quay_current_config.stdout | from_yaml }}"
  ignore_errors: true
  no_log: true
  when: not (_quay_already_on_s3 | bool)

- name: Fall back to the known GitOps baseline if the current config bundle failed to parse
  ansible.builtin.set_fact:
    _quay_current_config_parsed:
      FEATURE_USER_INITIALIZE: true
      BROWSER_API_CALLS_XHR_ONLY: false
      SUPER_USERS: ["quayadmin"]
      FEATURE_USER_CREATION: true
      FEATURE_SUPERUSERS_FULL_ACCESS: true
  when:
    - not (_quay_already_on_s3 | bool)
    - _quay_current_config_parsed is not defined

# Named 'local_us' rather than 'default' -- confirmed live this is the exact
# location name the Quay operator's own managed (pre-switch) objectstorage
# backend used. The operator rolls new quay-app pods after the
# "Mark Quay objectstorage component as unmanaged" patch below asynchronously
# -- old pods can still be live and serving requests for a short window while
# new ones start. Confirmed live: a blob pushed through an old pod during
# that window got its imagestoragelocation row written under the operator's
# location name while this config named its own location 'default', so that
# one row pointed at a location our DISTRIBUTED_STORAGE_CONFIG never defined
# -- every subsequent lookup for that blob hit a KeyError server-side,
# surfacing to oc-mirror as a permanent 500 that no retry could clear (it's a
# row in Postgres, not a transient condition). Matching the name makes any
# blob written on either side of the rollout resolve to the same S3 location
# instead of one of them becoming permanently unreachable.
- name: Merge S3 storage config into Quay config bundle
  ansible.builtin.set_fact:
    _quay_merged_config: >-
      {{ _quay_current_config_parsed | combine({
        'DISTRIBUTED_STORAGE_CONFIG': {
          'local_us': [
            'S3Storage',
            {
              'host': 's3.' ~ aws.aws_region ~ '.amazonaws.com',
              's3_bucket': quay_s3_storage_bucket,
              's3_region': aws.aws_region,
              'storage_path': '/datastorage/registry',
              's3_access_key': aws.aws_access_key_id,
              's3_secret_key': aws.aws_secret_access_key
            }
          ]
        },
        'DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS': ['local_us'],
        'DISTRIBUTED_STORAGE_PREFERENCE': ['local_us']
      }) }}
  no_log: true
  when: not (_quay_already_on_s3 | bool)

# Write the rendered YAML to its own file rather than embedding it as a
# nested block scalar inside an oc-apply heredoc — confirmed live: hand
# computing the indent() offset against the heredoc's own indentation got it
# wrong (6 spaces too many on every line after the first), producing a
# config.yaml that failed to parse ("mapping values are not allowed in this
# context") with no complaint at apply time, since oc apply only validates
# the Secret envelope, not the opaque string inside it. Building the secret
# from a real file via `oc create --dry-run` sidesteps this whole class of
# bug — the YAML is never nested inside another YAML document.
- name: Write Quay config bundle content to a local file
  ansible.builtin.copy:
    content: "{{ _quay_merged_config | to_nice_yaml(indent=2) }}"
    dest: "{{ quay_mirror_workspace | default('/tmp') }}/quay-init-config-bundle.yaml"
    mode: '0600'
  no_log: true
  when: not (_quay_already_on_s3 | bool)

- name: Validate the rendered config bundle is parseable YAML
  ansible.builtin.command: >
    python3 -c "import yaml; yaml.safe_load(open('{{ quay_mirror_workspace | default('/tmp') }}/quay-init-config-bundle.yaml'))"
  changed_when: false
  when: not (_quay_already_on_s3 | bool)

- name: Apply updated Quay config bundle secret with S3 storage config
  ansible.builtin.shell: >
    {{ bin_dir }}/oc create secret generic init-config-bundle-secret
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    --from-file=config.yaml={{ quay_mirror_workspace | default('/tmp') }}/quay-init-config-bundle.yaml
    --dry-run=client -o yaml
    | {{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
  when: not (_quay_already_on_s3 | bool)

# Catch an ArgoCD revert, or a config the operator rejects, within seconds
# instead of discovering it 5 minutes later via the generated-config-secret
# poll further down — confirmed live both failure modes actually happen
# (ArgoCD overwriting this secret before RespectIgnoreDifferences was added;
# a malformed config.yaml the operator silently rejected every 10s).
- name: Verify the config bundle secret still has our S3 storage config
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get secret init-config-bundle-secret
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.data.config\.yaml}' | base64 -d | grep -c DISTRIBUTED_STORAGE_CONFIG || true
  args:
    executable: /bin/bash
  register: _quay_secret_survived_check
  changed_when: false
  no_log: true
  when: not (_quay_already_on_s3 | bool)

- name: Fail if ArgoCD reverted the S3 storage config out of the secret
  ansible.builtin.fail:
    msg: >-
      init-config-bundle-secret no longer contains DISTRIBUTED_STORAGE_CONFIG
      right after we applied it — ArgoCD's selfHeal reverted it. Check that
      the Application's syncPolicy.syncOptions actually includes
      RespectIgnoreDifferences=true (`oc get applications.argoproj.io
      {{ quay_argocd_app_name }} -n {{ quay_argocd_namespace }}
      -o jsonpath='{.spec.syncPolicy.syncOptions}'`) — ignoreDifferences
      alone only hides a field from the diff, it does not stop sync from
      overwriting it.
  when:
    - not (_quay_already_on_s3 | bool)
    - (_quay_secret_survived_check.stdout | default('0') | trim | int) == 0

- name: Mark Quay objectstorage component as unmanaged (external S3)
  ansible.builtin.command: >
    {{ bin_dir }}/oc patch quayregistry {{ quay_mirror_registry_name }}
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    --type=merge
    -p "{\"spec\":{\"components\":[{\"kind\":\"objectstorage\",\"managed\":false},{\"kind\":\"tls\",\"managed\":true}]}}"
  register: _quay_objectstorage_patch
  changed_when: "'no change' not in _quay_objectstorage_patch.stdout"

# "Available=True" on QuayRegistry can be stale leftover state from before
# this patch (the operator doesn't flip it to False just because it's stuck
# refusing to reconcile a ConfigInvalid component) — confirmed live: that
# wait previously returned in well under a second, satisfied by a condition
# set long before this run even started, while the operator sat spinning on
# "required component objectstorage marked unmanaged, but configBundleSecret
# is missing necessary fields" and Quay's app pods never picked up the new
# storage config at all. Check the operator's own generated config instead —
# that's the one artifact that only exists once reconciliation actually
# succeeded with our S3 settings.
# Deliberately not gated on _quay_already_on_s3 — that only tells us
# whether the SOURCE secret looks right, not whether the operator actually
# reconciled it (confirmed live it can fail to, e.g. stuck on a stale
# ArgoCD revert or a malformed config from an older run). This is the real
# verification and must always run.
# Re-resolve the secret's name on every attempt rather than finding it once
# up front — confirmed live: once reconciliation actually succeeds, the
# operator replaces the generated secret with a NEW name/hash rather than
# updating it in place, so a name captured before that point goes stale and
# flips from "found, wrong content" straight to NotFound mid-poll.
- name: Wait for Quay's generated config to actually pick up S3 storage
  ansible.builtin.shell: >
    SECRET=$({{ bin_dir }}/oc get secret -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o name | grep -- '-quay-config-secret-' | head -1);
    [ -z "$SECRET" ] && exit 0;
    {{ bin_dir }}/oc get "$SECRET" -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.data.config\.yaml}' 2>/dev/null | base64 -d 2>/dev/null | grep -c S3Storage || true
  args:
    executable: /bin/bash
  register: _quay_generated_config_check
  changed_when: false
  until: (_quay_generated_config_check.stdout | default('0') | trim | int) > 0
  retries: 20
  delay: 15

- name: Fail if Quay never reconciled the S3 storage config
  ansible.builtin.fail:
    msg: >-
      Quay's generated config secret still does not reference S3Storage
      after patching init-config-bundle-secret and the objectstorage
      component. The operator is likely stuck refusing to reconcile — check
      `oc logs deploy/quay-operator-tng -n {{ quay_mirror_namespace }}` for
      ConfigInvalid, and confirm the ArgoCD Application's ignoreDifferences
      actually protected init-config-bundle-secret from being reverted
      (`oc get secret init-config-bundle-secret -n {{ quay_mirror_namespace }}
      -o jsonpath='{.data.config\.yaml}' | base64 -d`).
  when: (_quay_generated_config_check.stdout | default('0') | trim | int) == 0

# The generated-config check above only proves the operator rendered the new
# config -- it says nothing about whether the quay-app pods actually serving
# traffic have rolled onto it yet. Confirmed live: oc-mirror started pushing
# ~17s after the objectstorage patch, while pods from the pre-switch
# ReplicaSet were still Running and still in the Service's endpoints for
# roughly 90s. A blob got load-balanced to an old pod mid-rollout and had its
# storage location written under the operator-managed backend's name, which
# the live config doesn't define -- a permanent 500 on every later lookup
# for that one blob, immune to any oc-mirror retry since it's a row in
# Postgres, not a transient failure. Block until every old pod is actually
# gone, not just until the config looks right.
- name: Wait for Quay app deployment to finish rolling onto the new storage config
  ansible.builtin.command: >
    {{ bin_dir }}/oc rollout status deployment/{{ quay_mirror_registry_name }}-quay-app
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    --timeout=10m
  changed_when: false

- name: Wait for Quay mirror-worker deployment to finish rolling onto the new storage config
  ansible.builtin.command: >
    {{ bin_dir }}/oc rollout status deployment/{{ quay_mirror_registry_name }}-quay-mirror
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    --timeout=10m
  changed_when: false

- name: Wait for QuayRegistry to be Available
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get quayregistry {{ quay_mirror_registry_name }}
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}' 2>/dev/null || true
  register: _quay_conditions
  changed_when: false
  until: "'Available=True' in _quay_conditions.stdout"
  retries: 60
  delay: 30

- name: Get Quay Route hostname
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get route
    -n {{ quay_mirror_namespace }}
    -l "quay-component=quay-app-route,quay-operator/quayregistry={{ quay_mirror_registry_name }}"
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.items[0].spec.host}' 2>/dev/null || true
  register: _quay_route_raw
  changed_when: false
  retries: 10
  delay: 10
  until: _quay_route_raw.stdout != ""

# Large blob uploads (operator catalog index images are often multi-GB) can
# sit silent for 80-115s while Quay commits them to NooBaa/MCG object storage
# with no bytes flowing in either direction. On AWS, the Classic ELB in front
# of the router has a 60s idle timeout by default and drops the connection
# during that silent window, producing an EOF on the client side even though
# Quay finishes the write and returns 202 into a now-dead socket.
#
# The HAProxy route-level timeout annotation does NOT fix this: the Quay
# Operator owns the quay-app Route via server-side Apply and reverts any
# hand-set haproxy.router.openshift.io/timeout annotation within ~1 minute
# (confirmed via managedFields). The actual bottleneck sits one layer further
# out, at the ELB — raise it via the IngressController API instead.
- name: Check ingress LoadBalancer provider type
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get ingresscontroller default
    -n openshift-ingress-operator
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.endpointPublishingStrategy.loadBalancer.providerParameters.aws.type}'
    2>/dev/null || true
  register: _ingress_lb_type
  changed_when: false

- name: Raise Classic ELB idle timeout for large blob uploads
  ansible.builtin.shell: >
    {{ bin_dir }}/oc patch ingresscontroller/default
    -n openshift-ingress-operator
    --kubeconfig {{ target_kubeconfig }}
    --type=merge
    --patch '{"spec":{"endpointPublishingStrategy":{"type":"LoadBalancerService","loadBalancer":{"scope":"External","dnsManagementPolicy":"Managed","providerParameters":{"type":"AWS","aws":{"type":"Classic","classicLoadBalancer":{"connectionIdleTimeout":"{{ quay_mirror_ingress_idle_timeout }}"}}}}}}}'
  changed_when: true
  when: _ingress_lb_type.stdout == "Classic"

# Verify the operator actually pushed the new value to the IngressController
# status (and from there to the ELB attribute) rather than blindly pausing —
# a blind pause is the same mistake that made the route annotation look
# "fixed" when it was never actually taking effect.
# Kubernetes round-trips the duration through Go's time.Duration and reports
# it back in Go's canonical String() format (e.g. requesting "30m" reports
# back as "30m0s") — comparing the raw strings for equality never matches.
# Parse both sides into seconds and compare numerically instead.
- name: Wait for IngressController to report an idle timeout of at least the desired value
  ansible.builtin.shell: |
    CURRENT=$({{ bin_dir }}/oc get ingresscontroller default \
      -n openshift-ingress-operator \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.status.endpointPublishingStrategy.loadBalancer.providerParameters.aws.classicLoadBalancer.connectionIdleTimeout}' 2>/dev/null || true)
    python3 -c "
    import re
    def to_seconds(s):
        return sum(int(n) * {'h': 3600, 'm': 60, 's': 1}[u] for n, u in re.findall(r'(\d+)([hms])', s))
    current = '''$CURRENT'''
    desired = '{{ quay_mirror_ingress_idle_timeout }}'
    print('confirmed:' + current if current and to_seconds(current) >= to_seconds(desired) else 'pending:' + current)
    "
  args:
    executable: /bin/bash
  register: _ingress_idle_timeout_check
  changed_when: false
  until: "'confirmed:' in _ingress_idle_timeout_check.stdout"
  retries: 12
  delay: 10
  when: _ingress_lb_type.stdout == "Classic"

- name: Set Quay registry URL facts
  ansible.builtin.set_fact:
    quay_registry_url: "{{ _quay_route_raw.stdout | trim }}"
    quay_mirror_push_url: "{{ _quay_route_raw.stdout | trim }}/{{ quay_mirror_org }}"

- name: Get Quay app pod name
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get pod -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -l quay-component=quay-app
    --no-headers -o custom-columns=NAME:.metadata.name | head -1
  register: _quay_app_pod
  changed_when: false

# Check whether the cluster's pull secret already has working Quay robot
# credentials BEFORE touching the robot account at all. Confirmed live:
# unconditionally deleting and recreating the robot on every run (as this
# task used to do) is harmless on a genuinely fresh install, where nothing
# depends on the registry yet -- but this role is also called by
# disconnected-update.yaml's routine Day 2 flow, which explicitly runs
# against a cluster where "Quay on the hub is the live mirror registry".
# Rotating a robot that nodes are actively pulling through opens a window
# where in-flight pulls fail with "Could not find robot"/"invalid password"
# until the new pull secret rolls out -- which jammed a MachineConfigPool
# node drain for hours when it happened here. Only rotate when the existing
# credentials are actually missing or broken.
- name: Check current pull secret Quay credentials (if any)
  ansible.builtin.shell: |
    set -e
    CURRENT=$({{ bin_dir }}/oc get secret pull-secret \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d)
    echo "$CURRENT" | jq -r '.auths["{{ quay_registry_url }}"].auth // ""'
  args:
    executable: /bin/bash
  register: _quay_existing_pull_secret_auth
  changed_when: false
  no_log: true

- name: Test whether existing pull secret Quay credentials still authenticate
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/v2/auth?service={{ quay_registry_url }}"
    url_username: "{{ (_quay_existing_pull_secret_auth.stdout | trim | b64decode).split(':', 1)[0] }}"
    url_password: "{{ (_quay_existing_pull_secret_auth.stdout | trim | b64decode).split(':', 1)[1] }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  register: _quay_existing_creds_check
  failed_when: false
  when: _quay_existing_pull_secret_auth.stdout | trim != ''
  no_log: true

- name: Determine whether the Quay robot token needs rotating
  ansible.builtin.set_fact:
    _quay_robot_needs_rotation: >-
      {{ (_quay_existing_pull_secret_auth.stdout | default('') | trim == '')
         or (_quay_existing_creds_check.status | default(0) != 200) }}

- name: Configure Quay admin user, mirror org, and robot account via Python model
  ansible.builtin.shell: |
    cat << 'PYEOF' | {{ bin_dir }}/oc exec -i -n {{ quay_mirror_namespace }} \
      --kubeconfig {{ target_kubeconfig }} \
      {{ _quay_app_pod.stdout | trim }} \
      -- python3 -
    import sys, os
    sys.path.insert(0, '/quay-registry')
    os.chdir('/quay-registry')
    from app import app
    from data.model import user as user_model, organization as org_model, team as team_model
    from data.database import User

    with app.app_context():
        # ---- Admin user ----
        admin = None
        try:
            admin = user_model.get_user('{{ quay_mirror_admin_user }}')
        except Exception:
            pass

        if admin is None:
            admin = user_model.create_user(
                '{{ quay_mirror_admin_user }}',
                '{{ quay_mirror_admin_password }}',
                '{{ quay_mirror_admin_user }}@local.invalid'
            )
            User.update(verified=True).where(
                User.username == '{{ quay_mirror_admin_user }}'
            ).execute()
        else:
            user_model.change_password(admin, '{{ quay_mirror_admin_password }}')
            User.update(verified=True).where(
                User.username == '{{ quay_mirror_admin_user }}'
            ).execute()
        admin = user_model.get_user('{{ quay_mirror_admin_user }}')

        # ---- Mirror organization ----
        org = None
        try:
            org = org_model.get_organization('{{ quay_mirror_org }}')
        except Exception:
            pass
        if org is None:
            org = org_model.create_organization(
                '{{ quay_mirror_org }}',
                '{{ quay_mirror_org }}@local.invalid',
                admin
            )

        # ---- Robot account ----
        robot_fullname = '{{ quay_mirror_org }}+{{ quay_mirror_robot_account }}'
    {% if _quay_robot_needs_rotation %}
        # Delete existing robot if present and recreate — avoids reading the
        # encrypted token field (which requires Quay-version-specific internals
        # to decode and silently produces a wrong token on re-runs). Only
        # reached when the credentials currently in the cluster pull secret
        # are missing or no longer authenticate (see the check task above) —
        # i.e. there is no live consumer whose in-flight pulls this rotation
        # could break.
        robot_token = None
        try:
            existing = User.get(User.username == robot_fullname)
            existing.delete_instance(recursive=True)
        except User.DoesNotExist:
            pass
        robot, robot_token = user_model.create_robot(
            '{{ quay_mirror_robot_account }}', org
        )

        # ---- Grant robot owners access ----
        try:
            owners = team_model.get_organization_team('{{ quay_mirror_org }}', 'owners')
            team_model.add_user_to_team(robot, owners)
        except Exception:
            pass  # Already a member

        print('ROBOT_TOKEN=' + robot_token)
    {% else %}
        # Existing pull-secret credentials already authenticate — reuse them
        # as-is rather than rotating a robot the cluster may be actively
        # pulling through right now.
        print('ROBOT_TOKEN={{ (_quay_existing_pull_secret_auth.stdout | trim | b64decode).split(":", 1)[1] }}')
    {% endif %}
    PYEOF
  args:
    executable: /bin/bash
  register: _quay_setup
  changed_when: true
  no_log: true

# Switching the objectstorage backend changes the location name Quay writes
# new blobs under ('default' for our S3Storage config) but does not purge
# ImageStoragePlacement rows already pointing at the OLD location (NooBaa's
# default is 'local_us') — confirmed live: 144 such rows survived the
# switch, from blobs that partially uploaded to NooBaa before it OOMKilled
# mid-run. Raw SQL against the storage tables (first attempt) turned a 500
# into a 400 by orphaning imagestorage/manifestblob rows instead of fixing
# anything, and deleting `repository` directly hit a foreign key Quay
# doesn't cascade on (blobupload.repository_id) — and there's no guarantee
# that's the only non-cascading FK in this chain. Delete via Quay's own
# model purge instead of guessing at its schema's FK graph.
#
# CRITICAL SCOPE BUG, confirmed live and fixed here: an earlier version of
# this task purged EVERY repository in the mirror org unconditionally, with
# no check for whether a repo actually had any valid (placed) storage. That
# was only safe the very first time, right after the NooBaa OOMKill left
# every repo's storage mid-upload with zero real content. Once oc-mirror
# successfully re-pushed real content to S3, this same task wiped that
# content out again on every subsequent run — deleting a mirror org that was
# already serving images to the live cluster. That, combined with
# ocp/remirror_to_quay's completion check only ever reading stale local
# files (now also fixed), meant the push was silently skipped right after
# the org was emptied, IDMS/ITMS pointing at the now-empty registry got
# applied, and every node drain cluster-wide jammed on ImagePullBackOff.
#
# Scope the purge to repositories with zero valid (placed) storage anywhere
# — i.e. genuinely orphaned leftovers, never anything with real content —
# determined via a read-only SQL query against the same schema confirmed
# live during the original investigation (manifestblob -> imagestorage ->
# imagestoragelocation via imagestorageplacement).
- name: Find mirror org repositories with zero valid blob storage placements
  ansible.builtin.shell: >
    {{ bin_dir }}/oc exec -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    deploy/{{ quay_mirror_registry_name }}-quay-database -c postgres --
    psql -U {{ quay_mirror_registry_name }}-quay-database -d {{ quay_mirror_registry_name }}-quay-database
    -t -A -c "select r.name from repository r join \"user\" u on r.namespace_user_id = u.id
    where u.username = '{{ quay_mirror_org }}' and not exists
    (select 1 from manifestblob mb join imagestorageplacement isp on isp.storage_id = mb.blob_id
    where mb.repository_id = r.id);"
  register: _quay_orphan_repo_check
  changed_when: false

- name: Set orphaned mirror org repository name list
  ansible.builtin.set_fact:
    _quay_orphan_repo_names: "{{ _quay_orphan_repo_check.stdout_lines | select('trim') | list }}"

# Deliberately NOT gated on _quay_already_on_s3 — confirmed live that gate
# made an earlier version of this fix dead code: the switch had already
# completed successfully in an earlier run by the time it was added, so
# every run since reported "already on S3" and skipped it, leaving the same
# broken repositories in place through another full attempt. Safe to run
# every time now that the purge is scoped to the SQL-verified orphan list
# above: an empty list (the normal case once the org has real content) is a
# no-op, not a full-org wipe.
#
# The REST list API (`GET /api/v1/repository?namespace=...`) is NOT a valid
# enumeration source here — confirmed live it silently returned an empty
# repositories list for two consecutive runs. That endpoint filters through
# `repositorypermission` rows, but repos auto-created by a robot's push (as
# oc-mirror does) only grant access via the robot's org `owners` team
# membership — no per-repository permission row is ever created, so the
# permission-filtered list can't see them even for an org owner/superuser.
# Enumerate via Quay's own model instead (same in-pod approach as the
# admin/org/robot setup above) and purge via `data.model.gc.purge_repository`
# — the same GC entrypoint the REST delete endpoint itself calls — which
# sees every repo regardless of permission rows and tears down all
# dependent rows correctly. Restricted to the orphan name list from above.
- name: Purge mirror org repositories left with orphaned (placement-less) storage
  ansible.builtin.shell: |
    cat << 'PYEOF' | {{ bin_dir }}/oc exec -i -n {{ quay_mirror_namespace }} \
      --kubeconfig {{ target_kubeconfig }} \
      {{ _quay_app_pod.stdout | trim }} \
      -- python3 -
    import sys, os, json
    sys.path.insert(0, '/quay-registry')
    os.chdir('/quay-registry')
    from app import app
    from data.database import Repository, User
    from data.model.gc import purge_repository

    orphan_names = set(json.loads('{{ _quay_orphan_repo_names | to_json }}'))

    with app.app_context():
        repos = list(
            Repository.select()
            .join(User, on=Repository.namespace_user)
            .where(User.username == '{{ quay_mirror_org }}')
        )
        purged = 0
        for repo in repos:
            if repo.name in orphan_names:
                purge_repository(repo, force=True)
                purged += 1
        print('PURGED_COUNT=' + str(purged))
    PYEOF
  args:
    executable: /bin/bash
  register: _quay_repos_purge
  changed_when: "'PURGED_COUNT=0' not in _quay_repos_purge.stdout"
  failed_when: "'PURGED_COUNT=' not in _quay_repos_purge.stdout"
  no_log: true

- name: Parse robot account credentials from Quay setup output
  ansible.builtin.set_fact:
    quay_robot_username: "{{ quay_mirror_org }}+{{ quay_mirror_robot_account }}"
    quay_robot_token: >-
      {{
        _quay_setup.stdout_lines
        | select('match', '^ROBOT_TOKEN=')
        | first
        | replace('ROBOT_TOKEN=', '')
      }}
  no_log: true

- name: Check if Quay robot credentials already exist in global pull secret
  ansible.builtin.shell: |
    set -e
    CURRENT=$({{ bin_dir }}/oc get secret pull-secret \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d)
    EXISTING_AUTH=$(echo "$CURRENT" | jq -r '.auths["{{ quay_registry_url }}"].auth // ""')
    if [ "$EXISTING_AUTH" = "{{ (quay_robot_username ~ ':' ~ quay_robot_token) | b64encode }}" ]; then
      echo "present"
    else
      echo "missing"
    fi
  args:
    executable: /bin/bash
  register: _quay_pull_secret_check
  changed_when: false
  no_log: true

- name: Merge Quay robot credentials into cluster global pull secret
  ansible.builtin.shell: |
    set -e
    MERGED=$({{ bin_dir }}/oc get secret pull-secret \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.data.\.dockerconfigjson}' \
      | base64 -d \
      | jq -c \
          --arg host "{{ quay_registry_url }}" \
          --arg auth "{{ (quay_robot_username ~ ':' ~ quay_robot_token) | b64encode }}" \
          '.auths[$host] = {"auth": $auth, "email": ""}')

    {{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: pull-secret
      namespace: openshift-config
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: "$(echo -n "$MERGED" | base64 -w 0)"
    EOF
  args:
    executable: /bin/bash
  register: _quay_pull_secret_merge
  changed_when: true
  no_log: true
  when: _quay_pull_secret_check.stdout | trim == "missing"

# A pull-secret rotation is only actually complete once every node has
# rolled the MachineConfig carrying it -- not when the Secret object is
# written. Confirmed live: writing the Secret and moving on left most of the
# fleet pulling through Quay with a stale, no-longer-valid token, because
# the MachineConfigPool rollout that delivers it to nodes takes much longer
# than this task and can itself stall (e.g. on an unrelated stuck drain).
# Block here until it actually lands everywhere, so later phases (and
# disconnected-update.yaml's routine re-runs of this same role) never
# proceed while part of the fleet is still on an old credential.
- name: Wait for master MachineConfigPool to finish updating after pull secret rotation
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp master
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}'
  register: _quay_pull_secret_master_mcp
  until: _quay_pull_secret_master_mcp.stdout == "True"
  retries: 60
  delay: 30
  changed_when: false
  when: _quay_pull_secret_merge is changed

- name: Wait for worker MachineConfigPool to finish updating after pull secret rotation
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get mcp worker
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}'
  register: _quay_pull_secret_worker_mcp
  until: _quay_pull_secret_worker_mcp.stdout == "True"
  retries: 60
  delay: 30
  changed_when: false
  when: _quay_pull_secret_merge is changed

- name: Display Quay mirror configuration summary
  ansible.builtin.debug:
    msg:
      - "Quay mirror registry configured"
      - "Registry URL:  {{ quay_registry_url }}"
      - "Push target:   {{ quay_mirror_push_url }}"
      - "Robot account: {{ quay_robot_username }}"
