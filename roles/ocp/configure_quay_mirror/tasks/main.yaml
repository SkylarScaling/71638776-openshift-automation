---
# ==============================================================================
# CONFIGURE QUAY AS MIRROR REGISTRY
#
# Waits for Quay to be healthy on the hub cluster, then configures it as a
# mirror target: creates org + robot account, and merges the robot credentials
# into the cluster global pull secret so nodes can pull from Quay.
# ==============================================================================

- name: Wait for QuayRegistry to be Available
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get quayregistry {{ quay_mirror_registry_name }}
    -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{range .status.conditions[*]}{.type}={.status}{"\n"}{end}' 2>/dev/null || true
  register: _quay_conditions
  changed_when: false
  until: "'Available=True' in _quay_conditions.stdout"
  retries: 60
  delay: 30

- name: Get Quay Route hostname
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get route
    -n {{ quay_mirror_namespace }}
    -l "quay-component=quay-app-route,quay-operator/quayregistry={{ quay_mirror_registry_name }}"
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.items[0].spec.host}' 2>/dev/null || true
  register: _quay_route_raw
  changed_when: false
  retries: 10
  delay: 10
  until: _quay_route_raw.stdout != ""

- name: Set Quay registry URL facts
  ansible.builtin.set_fact:
    quay_registry_url: "{{ _quay_route_raw.stdout | trim }}"
    quay_mirror_push_url: "{{ _quay_route_raw.stdout | trim }}/{{ quay_mirror_org }}"

- name: Attempt Quay superuser account initialization via /user/initialize
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/api/v1/user/initialize"
    method: POST
    validate_certs: false
    body_format: json
    body:
      username: "{{ quay_mirror_admin_user }}"
      password: "{{ quay_mirror_admin_password }}"
      email: "{{ quay_mirror_admin_user }}@local.invalid"
      access_token: false
    status_code: [200, 201, 400, 403, 409]
  register: _quay_init
  no_log: true

# initialize fails with 400 if the DB is non-empty (e.g. internal Quay setup rows exist)
# even when quayadmin hasn't been created yet. Bypass HTTP entirely — exec into the
# Quay app pod and call Quay's own Python model layer to create the user, which avoids
# CSRF entirely and works regardless of Quay's HTTP security settings.
- name: Get Quay app pod name
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get pod -n {{ quay_mirror_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -l quay-component=quay-app
    --no-headers -o custom-columns=NAME:.metadata.name | head -1
  register: _quay_app_pod
  changed_when: false
  when: _quay_init.status in [400, 403, 409]

- name: Create quayadmin via Quay Python model (bypasses CSRF)
  ansible.builtin.shell: |
    cat << 'PYEOF' | {{ bin_dir }}/oc exec -i -n {{ quay_mirror_namespace }} \
      --kubeconfig {{ target_kubeconfig }} \
      {{ _quay_app_pod.stdout | trim }} \
      -- python3 -
    import sys, os
    sys.path.insert(0, '/quay-registry')
    os.chdir('/quay-registry')
    from app import app
    from data.model import user as user_model
    from data.database import User
    with app.app_context():
        existing = None
        try:
            existing = user_model.get_user('{{ quay_mirror_admin_user }}')
        except Exception:
            pass
        if existing:
            try:
                user_model.change_password(existing, '{{ quay_mirror_admin_password }}')
                User.update(verified=True).where(User.username == '{{ quay_mirror_admin_user }}').execute()
                print('updated')
            except Exception as e:
                print('error resetting password: ' + str(e), file=sys.stderr)
                sys.exit(1)
        else:
            try:
                u = user_model.create_user('{{ quay_mirror_admin_user }}', '{{ quay_mirror_admin_password }}', '{{ quay_mirror_admin_user }}@local.invalid')
                User.update(verified=True).where(User.username == '{{ quay_mirror_admin_user }}').execute()
                print('created')
            except Exception as e:
                print('error: ' + str(e), file=sys.stderr)
                sys.exit(1)
    PYEOF
  args:
    executable: /bin/bash
  register: _quay_user_create
  changed_when: "_quay_user_create.stdout | trim in ['created', 'updated']"
  no_log: true
  when: _quay_init.status in [400, 403, 409]

- name: Verify quayadmin authentication succeeds
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/api/v1/user/"
    method: GET
    validate_certs: false
    user: "{{ quay_mirror_admin_user }}"
    password: "{{ quay_mirror_admin_password }}"
    force_basic_auth: true
    status_code: 200
  register: _quay_auth_check
  # TODO UNCOMMENT no_log: true
  failed_when: _quay_auth_check.status != 200

- name: Create mirror organization in Quay
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/api/v1/organization/"
    method: POST
    validate_certs: false
    user: "{{ quay_mirror_admin_user }}"
    password: "{{ quay_mirror_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ quay_mirror_org }}"
      email: "mirror@local.invalid"
    status_code: [200, 201, 400]
  register: _quay_org_result
  no_log: true

- name: Create mirror robot account in Quay
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/api/v1/organization/{{ quay_mirror_org }}/robots/{{ quay_mirror_robot_account }}"
    method: PUT
    validate_certs: false
    user: "{{ quay_mirror_admin_user }}"
    password: "{{ quay_mirror_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      description: "oc-mirror push/pull account"
    status_code: [200, 201]
  register: _quay_robot_result
  no_log: true

- name: Set robot account facts
  ansible.builtin.set_fact:
    quay_robot_username: "{{ quay_mirror_org }}+{{ quay_mirror_robot_account }}"
    quay_robot_token: "{{ _quay_robot_result.json.token }}"
  no_log: true

- name: Grant robot account admin access to mirror org
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/api/v1/organization/{{ quay_mirror_org }}/teams/owners/members/{{ quay_mirror_org }}+{{ quay_mirror_robot_account }}"
    method: PUT
    validate_certs: false
    user: "{{ quay_mirror_admin_user }}"
    password: "{{ quay_mirror_admin_password }}"
    force_basic_auth: true
    body_format: json
    body: {}
    status_code: [200, 201]
  no_log: true

- name: Merge Quay robot credentials into cluster global pull secret
  ansible.builtin.shell: |
    set -e
    MERGED=$({{ bin_dir }}/oc get secret pull-secret \
      -n openshift-config \
      --kubeconfig {{ target_kubeconfig }} \
      -o jsonpath='{.data.\.dockerconfigjson}' \
      | base64 -d \
      | jq -c \
          --arg host "{{ quay_registry_url }}" \
          --arg auth "{{ (quay_robot_username ~ ':' ~ quay_robot_token) | b64encode }}" \
          '.auths[$host] = {"auth": $auth, "email": ""}')

    {{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: pull-secret
      namespace: openshift-config
    type: kubernetes.io/dockerconfigjson
    data:
      .dockerconfigjson: "$(echo -n "$MERGED" | base64 -w 0)"
    EOF
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true

- name: Display Quay mirror configuration summary
  ansible.builtin.debug:
    msg:
      - "Quay mirror registry configured"
      - "Registry URL: {{ quay_registry_url }}"
      - "Push target:  {{ quay_mirror_push_url }}"
      - "Robot user:   {{ quay_robot_username }}"
