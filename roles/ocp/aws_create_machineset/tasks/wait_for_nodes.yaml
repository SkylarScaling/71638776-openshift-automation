---
- name: Wait for {{ pool_name }} Machines to be created and Running
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get machine.machine.openshift.io -n openshift-machine-api
    -l "machine.openshift.io/cluster-api-machine-role={{ pool_name }}"
    --kubeconfig {{ target_kubeconfig }}
    -o json 2>/dev/null || echo '{"items":[]}'
  register: _machine_status_raw
  changed_when: false
  until: >
    (_machine_status_raw.stdout | from_json)['items'] | length >= pool_replicas | int and
    ((_machine_status_raw.stdout | from_json)['items'] | selectattr('status.phase', 'defined') |
     selectattr('status.phase', 'equalto', 'Running') | list | length) >= pool_replicas | int
  retries: 360 # Check every 10 seconds for 60 minutes
  delay: 10

- name: Wait for {{ pool_name }} Nodes to join the cluster and be Ready
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get node
    -l "node-role.kubernetes.io/{{ pool_name }}="
    --kubeconfig {{ target_kubeconfig }}
    -o json 2>/dev/null || echo '{"items":[]}'
  register: _node_status_raw
  changed_when: false
  until: >
    (_node_status_raw.stdout | from_json)['items'] | length >= pool_replicas | int and
    ((_node_status_raw.stdout | from_json)['items'] | selectattr('status.conditions', 'defined') |
     map(attribute='status.conditions') | flatten |
     selectattr('type', 'equalto', 'Ready') |
     selectattr('status', 'equalto', 'True') | list | length) >= pool_replicas | int
  retries: 360
  delay: 10
