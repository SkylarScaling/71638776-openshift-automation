---
# ArgoCD RBAC is managed through the ArgoCD CR (spec.rbac), not by patching
# argocd-rbac-cm directly. The ArgoCD operator owns that ConfigMap and reverts
# any direct edits. Patching the CR causes the operator to reconcile and
# update the ConfigMap, then ArgoCD hot-reloads the policy without a restart.
#
# For groups to appear in the JWT, the user must log out and back in after
# this change — old tokens don't carry the new group claim.

- name: Derive ArgoCD admin groups from rbac_bindings
  ansible.builtin.set_fact:
    _argocd_admin_groups: >-
      {{ argocd_rbac.admin_groups
         | default(
             (rbac_bindings | default([]) | selectattr('cluster_role', 'equalto', 'cluster-admin') | map(attribute='group') | list) +
             (rbac_bindings | default([]) | selectattr('cluster_role', 'equalto', 'admin') | map(attribute='group') | list)
           ) }}

- name: Derive ArgoCD readonly groups from rbac_bindings
  ansible.builtin.set_fact:
    _argocd_readonly_groups: >-
      {{ argocd_rbac.readonly_groups
         | default(
             rbac_bindings | default([])
             | rejectattr('cluster_role', 'equalto', 'cluster-admin')
             | rejectattr('cluster_role', 'equalto', 'admin')
             | map(attribute='group') | list
           ) }}

- name: Build ArgoCD policy lines
  ansible.builtin.set_fact:
    _argocd_policy_lines: >-
      {{
        (_argocd_admin_groups | map('regex_replace', '^(.*)$', 'g, \1, role:admin') | list) +
        (_argocd_readonly_groups | map('regex_replace', '^(.*)$', 'g, \1, role:readonly') | list)
      }}

- name: Patch ArgoCD CR spec.rbac (operator propagates to argocd-rbac-cm)
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: argoproj.io/v1alpha1
      kind: ArgoCD
      metadata:
        name: openshift-gitops
        namespace: {{ argocd_namespace }}
      spec:
        rbac:
          defaultPolicy: 'role:readonly'
          policy: "{{ _argocd_policy_lines | join('\n') }}"
          scopes: '[groups]'
  changed_when: true

- name: Wait for ArgoCD operator to reconcile RBAC ConfigMap
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get configmap argocd-rbac-cm
    -n {{ argocd_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.data.policy\.csv}'
  register: _rbac_cm_check
  until: _argocd_admin_groups | first in _rbac_cm_check.stdout
  retries: 12
  delay: 10
  changed_when: false
  when: _argocd_admin_groups | length > 0
