---
# Build cluster-facing LDAP URL using IP (not hostname) so cluster pods/nodes
# can authenticate without needing external DNS. Extract public IP from EC2
# hostname format to avoid getting the private IP from AWS internal DNS.
- name: Resolve LDAP hostname to public IP for in-cluster connectivity
  ansible.builtin.shell: |
    python3 -c "
    import re, socket
    import urllib.parse
    parsed = urllib.parse.urlparse('{{ ldap.url | default('') }}')
    host = parsed.hostname or ''
    m = re.match(r'^ec2-(\d+-\d+-\d+-\d+)\..*\.compute\.amazonaws\.com$', host)
    if m:
        ip = m.group(1).replace('-', '.')
    else:
        try:
            ip = socket.gethostbyname(host)
        except:
            ip = ''
    print(ip if ip else '')
    "
  register: _auth_host_ip
  changed_when: false
  failed_when: false
  when: ldap is defined

- name: Set cluster-facing LDAP URL (IP instead of hostname)
  ansible.builtin.set_fact:
    _ldap_url_for_cluster: >-
      {{ ldap.url | regex_replace('://([^:/]+)', '://' + _auth_host_ip.stdout | trim)
         if (_auth_host_ip.stdout | default('') | trim) != ''
         else ldap.url }}
  when: ldap is defined

- name: Assert required LDAP vars are defined
  ansible.builtin.assert:
    that:
      - ldap.url is defined and ldap.url != ""
      - ldap.bind_dn is defined and ldap.bind_dn != ""
    fail_msg: "ldap.url and ldap.bind_dn must be defined"

- name: Ensure openshift-config namespace exists
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: openshift-config
  changed_when: true

- name: Create LDAP bind password Secret
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ldap_bind_secret_name }}"
        namespace: openshift-config
      type: Opaque
      stringData:
        bindPassword: "{{ ldap.bind_password }}"
  changed_when: true

- name: Create LDAP CA ConfigMap
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ ldap_ca_configmap_name }}"
        namespace: openshift-config
      data:
        ca.crt: |
          {{ ldap.ca_cert | indent(10) }}
  changed_when: true
  when: ldap.ca_cert | default('') != ''

- name: Apply OAuth cluster CR with LDAP identity provider
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'oauth-ldap.yaml.j2') }}"
  changed_when: true
