---
# ==============================================================================
# DEPLOY GITEA
# ==============================================================================
- name: Create Gitea namespace
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitea_namespace }}"
  changed_when: true

- name: Create Gitea ServiceAccount
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: gitea
        namespace: "{{ gitea_namespace }}"
  changed_when: true

- name: Grant anyuid SCC to Gitea ServiceAccount
  ansible.builtin.shell: >
    {{ bin_dir }}/oc adm policy add-scc-to-user anyuid
    system:serviceaccount:{{ gitea_namespace }}:gitea
    --kubeconfig {{ target_kubeconfig }}
  changed_when: true

- name: Create Gitea PVC
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: gitea-data
        namespace: "{{ gitea_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ gitea_pvc_size }}"
  changed_when: true

- name: Create Gitea Service
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Service
      metadata:
        name: gitea
        namespace: "{{ gitea_namespace }}"
        labels:
          app: gitea
      spec:
        selector:
          app: gitea
        ports:
          - name: http
            port: 3000
            targetPort: http
            protocol: TCP
  changed_when: true

- name: Create Gitea Route
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: gitea
        namespace: "{{ gitea_namespace }}"
      spec:
        to:
          kind: Service
          name: gitea
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
  changed_when: true

- name: Get Gitea Route hostname
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get route gitea
    -n {{ gitea_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.spec.host}'
  register: _gitea_route_hostname
  changed_when: false
  retries: 10
  delay: 5
  until: _gitea_route_hostname.stdout != ""

- name: Set Gitea Route hostname fact
  ansible.builtin.set_fact:
    gitea_route_host: "{{ _gitea_route_hostname.stdout }}"

- name: Verify Gitea image is available in mirror registry
  ansible.builtin.uri:
    url: "https://{{ mirror_registry_url }}/v2/{{ mirror_base_path | default('ocp4') }}/gitea/gitea/tags/list"
    validate_certs: false
    user: "{{ mirror_registry_init_user }}"
    password: "{{ mirror_registry_init_password }}"
    force_basic_auth: true
    status_code: 200
  register: _gitea_image_check
  failed_when: false
  changed_when: false

- name: Fail with actionable message if Gitea image is missing from mirror registry
  ansible.builtin.fail:
    msg: >-
      Gitea image not found in mirror registry at
      {{ mirror_registry_url }}/{{ mirror_base_path | default('ocp4') }}/gitea/gitea.
      The oc-mirror run likely failed to mirror docker.io/gitea/gitea:1.22-rootless.
      Check the oc-mirror error log and re-mirror manually if needed:
        oc image mirror docker.io/gitea/gitea:1.22-rootless
          {{ mirror_registry_url }}/{{ mirror_base_path | default('ocp4') }}/gitea/gitea:1.22-rootless
          --insecure=true
  when: _gitea_image_check.status | default(0) != 200

- name: Deploy Gitea
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'gitea-deployment.yaml.j2') }}"
  changed_when: true

- name: Wait for Gitea Deployment to be available
  ansible.builtin.shell: >
    {{ bin_dir }}/oc rollout status deployment/gitea
    -n {{ gitea_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    --timeout=60s
  register: _gitea_rollout
  until: _gitea_rollout.rc == 0
  retries: 15
  delay: 20
  changed_when: false

- name: Wait for Gitea API to respond
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/version"
    validate_certs: false
    status_code: 200
  register: gitea_api_check
  until: gitea_api_check.status == 200
  retries: 30
  delay: 10

# ==============================================================================
# CONFIGURE GITEA (admin user, organization, repos)
# ==============================================================================
- name: Check if Gitea admin user already exists
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/users/{{ gitea_admin_user }}"
    validate_certs: false
    status_code: [200, 404]
  register: admin_user_check

- name: Create Gitea admin user
  ansible.builtin.shell: >
    {{ bin_dir }}/oc exec deploy/gitea
    -n {{ gitea_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -- gitea admin user create
    --admin
    --username {{ gitea_admin_user }}
    --password {{ gitea_admin_password }}
    --email {{ gitea_admin_email }}
    --must-change-password=false
  when: admin_user_check.status == 404

- name: Check if Gitea organization exists
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/orgs/{{ gitea_org }}"
    validate_certs: false
    status_code: [200, 404]
    user: "{{ gitea_admin_user }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
  register: org_check

- name: Create Gitea organization
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/orgs"
    method: POST
    validate_certs: false
    user: "{{ gitea_admin_user }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ gitea_org }}"
      full_name: "OpenShift GitOps Repos"
      visibility: "public"
    status_code: 201
  when: org_check.status == 404

# ==============================================================================
# SEED REPOS FROM JUMPHOST
# ==============================================================================
- name: Find cloned GitOps repositories
  ansible.builtin.find:
    paths: "{{ gitops_repos_dir }}"
    file_type: directory
    recurse: false
  register: cloned_repos

- name: Create repos in Gitea and push content
  ansible.builtin.include_tasks: seed-repo.yaml
  loop: "{{ cloned_repos.files | map(attribute='path') | map('basename') | list }}"
  loop_control:
    loop_var: repo_name
    label: "{{ repo_name }}"

- name: Set internal Git server URL fact for ArgoCD apps
  ansible.builtin.set_fact:
    internal_gitserver_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000"
    internal_gitserver_org: "{{ gitea_org }}"
    acm_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-acm.git"
    odf_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-odf.git"
    mco_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-mco.git"
    quay_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-quay.git"

- name: Display internal Git server info
  ansible.builtin.debug:
    msg:
      - "Internal Git server deployed at: https://{{ gitea_route_host }}"
      - "ArgoCD in-cluster URL: {{ internal_gitserver_url }}"
      - "Organization: {{ gitea_org }}"
      - "Repos seeded: {{ cloned_repos.files | map(attribute='path') | map('basename') | list }}"
