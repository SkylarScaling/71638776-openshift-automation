---
# ==============================================================================
# DEPLOY GITEA
# ==============================================================================
- name: Create Gitea namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ target_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitea_namespace }}"

- name: Create Gitea ServiceAccount
  kubernetes.core.k8s:
    kubeconfig: "{{ target_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: gitea
        namespace: "{{ gitea_namespace }}"

- name: Grant anyuid SCC to Gitea ServiceAccount
  ansible.builtin.shell: >
    {{ bin_dir }}/oc adm policy add-scc-to-user anyuid
    -z gitea -n {{ gitea_namespace }}
    --kubeconfig {{ target_kubeconfig }}
  changed_when: true

- name: Create Gitea PVC
  kubernetes.core.k8s:
    kubeconfig: "{{ target_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: gitea-data
        namespace: "{{ gitea_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ gitea_pvc_size }}"

- name: Create Gitea Service
  kubernetes.core.k8s:
    kubeconfig: "{{ target_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: gitea
        namespace: "{{ gitea_namespace }}"
        labels:
          app: gitea
      spec:
        selector:
          app: gitea
        ports:
          - name: http
            port: 3000
            targetPort: http
            protocol: TCP

- name: Create Gitea Route
  kubernetes.core.k8s:
    kubeconfig: "{{ target_kubeconfig }}"
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: gitea
        namespace: "{{ gitea_namespace }}"
      spec:
        to:
          kind: Service
          name: gitea
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
  register: gitea_route_result

- name: Get Gitea Route hostname
  kubernetes.core.k8s_info:
    kubeconfig: "{{ target_kubeconfig }}"
    api_version: route.openshift.io/v1
    kind: Route
    name: gitea
    namespace: "{{ gitea_namespace }}"
  register: gitea_route_info

- name: Set Gitea Route hostname fact
  ansible.builtin.set_fact:
    gitea_route_host: "{{ gitea_route_info.resources[0].spec.host }}"

- name: Deploy Gitea
  kubernetes.core.k8s:
    kubeconfig: "{{ target_kubeconfig }}"
    state: present
    template: "gitea-deployment.yaml.j2"

- name: Wait for Gitea Deployment to be available
  ansible.builtin.shell: >
    {{ bin_dir }}/oc rollout status deployment/gitea
    -n {{ gitea_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    --timeout=300s
  changed_when: false

- name: Wait for Gitea API to respond
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/version"
    validate_certs: false
    status_code: 200
  register: gitea_api_check
  until: gitea_api_check.status == 200
  retries: 30
  delay: 10

# ==============================================================================
# CONFIGURE GITEA (admin user, organization, repos)
# ==============================================================================
- name: Check if Gitea admin user already exists
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/users/{{ gitea_admin_user }}"
    validate_certs: false
    status_code: [200, 404]
  register: admin_user_check

- name: Create Gitea admin user
  ansible.builtin.shell: >
    {{ bin_dir }}/oc exec deploy/gitea
    -n {{ gitea_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -- gitea admin user create
    --admin
    --username {{ gitea_admin_user }}
    --password {{ gitea_admin_password }}
    --email {{ gitea_admin_email }}
    --must-change-password=false
  when: admin_user_check.status == 404

- name: Check if Gitea organization exists
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/orgs/{{ gitea_org }}"
    validate_certs: false
    status_code: [200, 404]
    user: "{{ gitea_admin_user }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
  register: org_check

- name: Create Gitea organization
  ansible.builtin.uri:
    url: "https://{{ gitea_route_host }}/api/v1/orgs"
    method: POST
    validate_certs: false
    user: "{{ gitea_admin_user }}"
    password: "{{ gitea_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      username: "{{ gitea_org }}"
      full_name: "OpenShift GitOps Repos"
      visibility: "public"
    status_code: 201
  when: org_check.status == 404

# ==============================================================================
# SEED REPOS FROM JUMPHOST
# ==============================================================================
- name: Find cloned GitOps repositories
  ansible.builtin.find:
    paths: "{{ gitops_repos_dir }}"
    file_type: directory
    recurse: false
  register: cloned_repos

- name: Create repos in Gitea and push content
  ansible.builtin.include_tasks: seed-repo.yaml
  loop: "{{ cloned_repos.files | map(attribute='path') | map('basename') | list }}"
  loop_control:
    loop_var: repo_name
    label: "{{ repo_name }}"

- name: Set internal Git server URL fact for ArgoCD apps
  ansible.builtin.set_fact:
    internal_gitserver_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000"
    internal_gitserver_org: "{{ gitea_org }}"
    acm_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-acm.git"
    odf_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-odf.git"
    mco_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-mco.git"
    quay_git_repo_url: "http://gitea.{{ gitea_namespace }}.svc.cluster.local:3000/{{ gitea_org }}/gitops-install-quay.git"

- name: Display internal Git server info
  ansible.builtin.debug:
    msg:
      - "Internal Git server deployed at: https://{{ gitea_route_host }}"
      - "ArgoCD in-cluster URL: {{ internal_gitserver_url }}"
      - "Organization: {{ gitea_org }}"
      - "Repos seeded: {{ cloned_repos.files | map(attribute='path') | map('basename') | list }}"
