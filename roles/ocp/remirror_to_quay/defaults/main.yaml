---
# Mirror org — matches disconnected.quay_mirror.org; also set as fact by configure_quay_mirror
quay_mirror_org: "{{ disconnected.quay_mirror.org | default(disconnected.mirror_base_path | default('ocp4')) }}"

# Source workspace from the initial jumphost mirror run (for the imageset-config)
initial_mirror_workspace: "{{ oc_mirror_workspace | default(working_dir ~ '/oc-mirror-workspace') }}"

# Dedicated fresh workspace for the Quay remirror run. Must be distinct from the
# initial workspace — oc-mirror v2 treats a reused workspace as already-synced and
# generates IDMS pointing at the new destination without actually pushing images.
quay_mirror_workspace: "{{ working_dir }}/quay-mirror-workspace"

# Directory where oc-mirror writes the Quay-targeted cluster resources
quay_mirror_results_dir: "{{ tmp_dir }}/quay-mirror-results"
