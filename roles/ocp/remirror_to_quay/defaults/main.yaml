---
# Mirror org — matches disconnected.quay_mirror.org; also set as fact by configure_quay_mirror
quay_mirror_org: "{{ disconnected.quay_mirror.org | default(disconnected.mirror_base_path | default('ocp4')) }}"

# Source workspace from the initial jumphost mirror run (for the auth.json)
initial_mirror_workspace: "{{ oc_mirror_workspace | default(working_dir ~ '/oc-mirror-workspace') }}"

# Directory for skopeo auth file and results
quay_mirror_results_dir: "{{ tmp_dir }}/quay-mirror-results"

# Source mirror registry — set by setup_mirror_registry; default derives from inventory
mirror_registry_url: "{{ disconnected.mirror_registry.hostname }}:{{ disconnected.mirror_registry.port | default(8443) }}"
mirror_base_path: "{{ disconnected.mirror_base_path | default('ocp4') }}"
