---
# ==============================================================================
# REMIRROR OCP CONTENT TO QUAY
#
# Copies all content from the jumphost mirror registry to the Quay instance
# on the hub cluster using skopeo sync (direct registry-to-registry copy).
# oc-mirror is not used here: it generates cluster-resources based on the
# imageset-config regardless of whether it actually pushes images, making it
# unreliable for the remirror step when the initial mirror workspace state
# treats content as already-synced.
#
# After the sync, Quay IDMS manifests are derived by substituting the Quay
# hostname into the existing jumphost IDMS facts (paths are identical).
# The CatalogSource image is constructed from the known path pattern.
#
# Prerequisites: configure_quay_mirror must have run first (sets quay_registry_url,
# quay_mirror_org, quay_robot_username, quay_robot_token).
# ==============================================================================

- name: Verify skopeo is installed
  ansible.builtin.command: skopeo --version
  changed_when: false
  register: _skopeo_check
  failed_when: _skopeo_check.rc != 0

- name: Verify Quay registry is reachable from this host
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/health/instance"
    validate_certs: false
    status_code: [200, 301]
  register: _quay_health
  failed_when: _quay_health.status | default(0) not in [200, 301]

- name: Create Quay results directory
  ansible.builtin.file:
    path: "{{ quay_mirror_results_dir }}"
    state: directory
    mode: '0755'

# Build a combined auth file that covers both the jumphost source registry
# and the Quay destination registry.
- name: Build auth.json with jumphost and Quay credentials for skopeo
  ansible.builtin.shell: |
    set -e
    mkdir -p "{{ quay_mirror_results_dir }}/containers"
    AUTH_FILE="{{ quay_mirror_results_dir }}/containers/auth.json"
    cp "{{ initial_mirror_workspace }}/containers/auth.json" "$AUTH_FILE"
    jq -c \
      --arg host "{{ quay_registry_url }}" \
      --arg auth "{{ (quay_robot_username ~ ':' ~ quay_robot_token) | b64encode }}" \
      '.auths[$host] = {"auth": $auth, "email": ""}' \
      "$AUTH_FILE" > "${AUTH_FILE}.tmp" && mv "${AUTH_FILE}.tmp" "$AUTH_FILE"
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true

# skopeo sync copies every image under the jumphost ocp4/ namespace to the
# Quay ocp4/ org in one pass. It handles multi-arch manifests, digest
# references, and partial failures more reliably than oc-mirror for a
# registry-to-registry copy.
- name: Sync all content from jumphost registry to Quay with skopeo
  ansible.builtin.shell: |
    skopeo sync \
      --authfile "{{ quay_mirror_results_dir }}/containers/auth.json" \
      --src docker \
      --dest docker \
      --src-tls-verify=false \
      --dest-tls-verify=false \
      --preserve-digests \
      --all \
      "{{ mirror_registry_url }}/{{ mirror_base_path }}" \
      "{{ quay_registry_url }}" \
      2>&1
  async: 7200
  poll: 0
  register: _skopeo_sync_job
  changed_when: true

- name: Wait for skopeo sync to complete (up to 2 hours)
  ansible.builtin.async_status:
    jid: "{{ _skopeo_sync_job.ansible_job_id }}"
  register: _skopeo_sync_result
  until: _skopeo_sync_result.finished
  retries: 240
  delay: 30
  failed_when:
    - _skopeo_sync_result.finished
    - _skopeo_sync_result.rc != 0

- name: Display skopeo sync output summary
  ansible.builtin.debug:
    msg: "{{ (_skopeo_sync_result.stdout_lines | default([])) | list | last(10) }}"
  failed_when: false

# Derive Quay IDMS by replacing the jumphost hostname with the Quay hostname
# in every jumphost IDMS manifest. The repository path structure is identical
# on both registries since skopeo preserves it.
- name: Build Quay IDMS manifests by substituting Quay hostname into jumphost IDMS
  ansible.builtin.set_fact:
    quay_idms_manifests: >-
      {{
        oc_mirror_idms_manifests
        | map('regex_replace', mirror_registry_url | regex_escape, quay_registry_url ~ '/' ~ quay_mirror_org)
        | list
      }}

# Verify that the catalog index image is present in Quay before referencing it.
- name: Get Bearer token to query Quay catalog image tags
  ansible.builtin.shell: |
    curl -sk \
      -u "{{ quay_robot_username }}:{{ quay_robot_token }}" \
      "https://{{ quay_registry_url }}/v2/auth?service={{ quay_registry_url }}&scope=repository:{{ quay_mirror_org }}/redhat/redhat-operator-index:pull" \
      | python3 -c "import sys,json; print(json.load(sys.stdin).get('token',''))"
  register: _quay_bearer_token
  changed_when: false
  no_log: true

- name: Verify catalog index image exists in Quay
  ansible.builtin.uri:
    url: "https://{{ quay_registry_url }}/v2/{{ quay_mirror_org }}/redhat/redhat-operator-index/tags/list"
    headers:
      Authorization: "Bearer {{ _quay_bearer_token.stdout | trim }}"
    validate_certs: false
    status_code: 200
  register: _quay_catalog_tags
  failed_when: false

- name: Fail if catalog index image is missing from Quay after sync
  ansible.builtin.fail:
    msg: >-
      The redhat-operator-index image was not found in Quay after skopeo sync.
      Check skopeo output above and verify that
      {{ mirror_registry_url }}/{{ mirror_base_path }}/redhat/redhat-operator-index
      exists on the jumphost registry.
  when: _quay_catalog_tags.status | default(0) != 200

- name: Set Quay catalog image fact
  ansible.builtin.set_fact:
    quay_catalog_image: >-
      {{ quay_registry_url }}/{{ quay_mirror_org }}/redhat/redhat-operator-index:v{{ openshift_version }}

- name: Display remirror summary
  ansible.builtin.debug:
    msg:
      - "skopeo sync to Quay complete"
      - "Source:        {{ mirror_registry_url }}/{{ mirror_base_path }}"
      - "Destination:   {{ quay_registry_url }}/{{ quay_mirror_org }}"
      - "Catalog image: {{ quay_catalog_image }}"
      - "IDMS manifests derived: {{ quay_idms_manifests | length }}"
