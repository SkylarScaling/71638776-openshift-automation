---
# ==============================================================================
# REMIRROR OCP CONTENT TO QUAY
#
# Runs oc-mirror from a fresh workspace to push all OCP release and operator
# content to the Quay instance on the hub cluster. Uses a dedicated workspace
# (quay_mirror_workspace) rather than the initial mirror workspace so that
# oc-mirror has no prior sync state and actually pushes all images to Quay
# instead of treating them as already synced.
#
# Prerequisites: configure_quay_mirror must have run first (sets quay_registry_url,
# quay_mirror_org, quay_robot_username, quay_robot_token).
# ==============================================================================

- name: Create Quay results directory
  ansible.builtin.file:
    path: "{{ quay_mirror_results_dir }}"
    state: directory
    mode: '0755'

# Use a fresh workspace so oc-mirror has no prior sync state for the Quay
# destination. Reusing the initial mirror workspace causes oc-mirror v2 to
# treat all content as already synced and generate IDMS pointing at Quay
# without actually pushing the images there.
- name: Create fresh Quay mirror workspace
  ansible.builtin.file:
    path: "{{ quay_mirror_workspace }}"
    state: directory
    mode: '0755'

- name: Copy imageset-config from initial workspace to Quay workspace
  ansible.builtin.copy:
    src: "{{ initial_mirror_workspace }}/imageset-config.yaml"
    dest: "{{ quay_mirror_workspace }}/imageset-config.yaml"
    remote_src: true
    mode: '0644'

- name: Build auth.json with pull-secret credentials plus Quay robot credentials
  ansible.builtin.shell: |
    set -e
    mkdir -p "{{ quay_mirror_workspace }}/containers"
    AUTH_FILE="{{ quay_mirror_workspace }}/containers/auth.json"
    # Seed with the full merged pull secret so oc-mirror can pull from all
    # source registries (registry.redhat.io, quay.io, etc.)
    cp "{{ initial_mirror_workspace }}/containers/auth.json" "$AUTH_FILE"
    # Add Quay push credentials so oc-mirror can push to the destination
    jq -c \
      --arg host "{{ quay_registry_url }}" \
      --arg auth "{{ (quay_robot_username ~ ':' ~ quay_robot_token) | b64encode }}" \
      '.auths[$host] = {"auth": $auth, "email": ""}' \
      "$AUTH_FILE" > "${AUTH_FILE}.tmp" && mv "${AUTH_FILE}.tmp" "$AUTH_FILE"
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true

- name: Run oc-mirror to push content to Quay
  ansible.builtin.command: >
    {{ bin_dir }}/oc-mirror
    --v2
    --config {{ quay_mirror_workspace }}/imageset-config.yaml
    --workspace file://{{ quay_mirror_workspace }}
    --dest-tls-verify=false
    docker://{{ quay_registry_url }}/{{ quay_mirror_org }}
  environment:
    XDG_RUNTIME_DIR: "{{ quay_mirror_workspace }}"
  args:
    chdir: "{{ quay_mirror_workspace }}"
  async: 7200
  poll: 0
  register: _quay_mirror_job
  changed_when: true

- name: Wait for oc-mirror to Quay to complete (up to 2 hours)
  ansible.builtin.async_status:
    jid: "{{ _quay_mirror_job.ansible_job_id }}"
  register: _quay_mirror_result
  until: _quay_mirror_result.finished
  retries: 240
  delay: 30
  # rc=0: success; rc=4: partial (some images failed, IDMS still generated);
  # rc=14: oc-mirror v2 partial success with more failures — treat same as rc=4
  failed_when:
    - _quay_mirror_result.finished
    - _quay_mirror_result.rc not in [0, 4, 14]

- name: Find oc-mirror error log for failed images
  ansible.builtin.find:
    paths: "{{ quay_mirror_workspace }}/working-dir/logs"
    patterns: "mirroring_errors_*.txt"
    file_type: file
  register: _quay_error_logs
  when: _quay_mirror_result.rc in [4, 14]

- name: Retry failed non-bundle images via oc image mirror
  ansible.builtin.shell: >
    {{ bin_dir }}/oc image mirror
    {{ item }}
    {{ quay_registry_url }}/{{ quay_mirror_org }}/{{ item | regex_replace('^docker://[^/]+/', '') | regex_replace('@sha256:[a-f0-9]+$', '') }}
    --registry-config={{ quay_mirror_workspace }}/containers/auth.json
    --insecure=true
    --filter-by-os=linux/amd64
    --skip-missing=true
  loop: >-
    {{
      lookup('file', (_quay_error_logs.files | sort(attribute='path') | last).path)
      | regex_findall('docker://\\S+')
      | reject('match', '.*operator-bundle.*')
      | unique
      | list
    }}
  loop_control:
    label: "{{ item | regex_replace('^docker://', '') | truncate(80, True, '...') }}"
  when:
    - _quay_error_logs is defined
    - _quay_error_logs.files | default([]) | length > 0
  changed_when: true
  failed_when: false

- name: Find Quay IDMS manifest files from oc-mirror output
  ansible.builtin.find:
    paths: "{{ quay_mirror_workspace }}/working-dir/cluster-resources"
    patterns:
      - "idms-*.yaml"
      - "imageDigestMirrorSet*.yaml"
      - "imageContentSourcePolicy*.yaml"
    file_type: file
  register: _quay_idms_files

- name: Find Quay CatalogSource manifest files from oc-mirror output
  ansible.builtin.find:
    paths: "{{ quay_mirror_workspace }}/working-dir/cluster-resources"
    patterns: "cs-*.yaml"
    file_type: file
  register: _quay_cs_files

- name: Read Quay IDMS manifests
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ _quay_idms_files.files }}"
  register: _quay_idms_raw

- name: Read Quay CatalogSource manifests
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ _quay_cs_files.files }}"
  register: _quay_cs_raw

- name: Set Quay IDMS manifest facts
  ansible.builtin.set_fact:
    quay_idms_manifests: "{{ _quay_idms_raw.results | map(attribute='content') | map('b64decode') | list }}"

- name: Extract Quay catalog index image reference from CatalogSource file
  ansible.builtin.shell: >
    grep -h '^\s*image:' {{ quay_mirror_workspace }}/working-dir/cluster-resources/cs-*.yaml
    | head -1 | awk '{print $2}'
  register: _quay_catalog_image_raw
  changed_when: false

- name: Set Quay catalog image fact
  ansible.builtin.set_fact:
    quay_catalog_image: "{{ _quay_catalog_image_raw.stdout | trim }}"

- name: Display remirror summary
  ansible.builtin.debug:
    msg:
      - "oc-mirror to Quay complete"
      - "Target: docker://{{ quay_registry_url }}/{{ quay_mirror_org }}"
      - "IDMS manifests:        {{ _quay_idms_files.files | length }}"
      - "CatalogSource manifests: {{ _quay_cs_files.files | length }}"
