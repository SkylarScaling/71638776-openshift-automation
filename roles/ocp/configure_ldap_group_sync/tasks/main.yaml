---
- name: Assert required groupsync vars are defined
  ansible.builtin.assert:
    that:
      - groupsync.ldap_url is defined and groupsync.ldap_url != ""
      - groupsync.bind_dn is defined and groupsync.bind_dn != ""
      - groupsync.groups_base_dn is defined and groupsync.groups_base_dn != ""
      - groupsync.users_base_dn is defined and groupsync.users_base_dn != ""
    fail_msg: "groupsync.ldap_url, bind_dn, groups_base_dn, and users_base_dn must all be defined"

# In disconnected OCP clusters, CoreDNS cannot resolve external hostnames.
# Resolve the LDAP hostname to an IP HERE (on the Ansible controller, which
# has internet DNS access) and inject it as a hostAlias in the CronJob pod
# spec so the pod bypasses DNS and connects directly by IP.
- name: Extract LDAP hostname from ldap_url
  ansible.builtin.set_fact:
    _ldap_host: "{{ groupsync.ldap_url | regex_replace('^ldaps?://([^:/]+).*', '\\1') }}"

# On AWS jumphost, socket.gethostbyname() returns the PRIVATE IP because
# AWS internal DNS resolves EC2 public hostnames to private IPs within the VPC.
# The cluster nodes are in a DIFFERENT VPC and cannot reach the private IP.
# Extract the PUBLIC IP directly from the EC2 hostname format:
#   ec2-18-222-106-115.us-east-2.compute.amazonaws.com → 18.222.106.115
# Fall back to DNS lookup for non-EC2 hostnames.
- name: Resolve LDAP hostname to PUBLIC IP
  ansible.builtin.shell: |
    python3 -c "
    import re, socket
    host = '{{ _ldap_host }}'
    m = re.match(r'^ec2-(\d+-\d+-\d+-\d+)\\..*\\.compute\\.amazonaws\\.com$', host)
    if m:
        print(m.group(1).replace('-', '.'))
    else:
        try:
            print(socket.gethostbyname(host))
        except:
            print('')
    "
  register: _ldap_resolved_ip
  changed_when: false
  failed_when: false

- name: Set LDAP host IP fact
  ansible.builtin.set_fact:
    _ldap_host_ip: "{{ _ldap_resolved_ip.stdout | trim }}"

- name: Create ServiceAccount for LDAP group sync
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ groupsync_serviceaccount }}"
        namespace: "{{ groupsync_namespace }}"
  changed_when: true

- name: Create ClusterRole for LDAP group sync
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ groupsync_clusterrole }}"
      rules:
        - apiGroups:
            - user.openshift.io
          resources:
            - groups
          verbs:
            - get
            - list
            - create
            - update
            - patch
            - delete
  changed_when: true

- name: Bind ClusterRole to ServiceAccount
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ groupsync_clusterrole }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ groupsync_serviceaccount }}"
          namespace: "{{ groupsync_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ groupsync_clusterrole }}"
  changed_when: true

- name: Create LDAP bind password Secret
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ groupsync_secret }}"
        namespace: "{{ groupsync_namespace }}"
      type: Opaque
      stringData:
        bindPassword: "{{ groupsync.bind_password }}"
  changed_when: true

- name: Create LDAP CA ConfigMap
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ groupsync_ca_configmap }}"
        namespace: "{{ groupsync_namespace }}"
      data:
        ca.crt: |
          {{ groupsync.ca_cert | indent(10) }}
  changed_when: true
  when: groupsync.ca_cert | default('') != ''

- name: Create LDAPSyncConfig ConfigMap
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'ldap-sync-config.yaml.j2') }}"
  changed_when: true

- name: Create LDAP group sync CronJob
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'ldap-group-sync-cronjob.yaml.j2') }}"
  changed_when: true
