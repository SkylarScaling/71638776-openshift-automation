---
- name: Assert required groupsync vars are defined
  ansible.builtin.assert:
    that:
      - groupsync.ldap_url is defined and groupsync.ldap_url != ""
      - groupsync.bind_dn is defined and groupsync.bind_dn != ""
      - groupsync.groups_base_dn is defined and groupsync.groups_base_dn != ""
      - groupsync.users_base_dn is defined and groupsync.users_base_dn != ""
    fail_msg: "groupsync.ldap_url, bind_dn, groups_base_dn, and users_base_dn must all be defined"

- name: Create ServiceAccount for LDAP group sync
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ groupsync_serviceaccount }}"
        namespace: "{{ groupsync_namespace }}"
  changed_when: true

- name: Create ClusterRole for LDAP group sync
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: "{{ groupsync_clusterrole }}"
      rules:
        - apiGroups:
            - user.openshift.io
          resources:
            - groups
          verbs:
            - get
            - list
            - create
            - update
            - patch
            - delete
  changed_when: true

- name: Bind ClusterRole to ServiceAccount
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ groupsync_clusterrole }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ groupsync_serviceaccount }}"
          namespace: "{{ groupsync_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: "{{ groupsync_clusterrole }}"
  changed_when: true

- name: Create LDAP bind password Secret
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ groupsync_secret }}"
        namespace: "{{ groupsync_namespace }}"
      type: Opaque
      stringData:
        bindPassword: "{{ groupsync.bind_password }}"
  changed_when: true

- name: Create LDAP CA ConfigMap
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ groupsync_ca_configmap }}"
        namespace: "{{ groupsync_namespace }}"
      data:
        ca.crt: |
          {{ groupsync.ca_cert | indent(10) }}
  changed_when: true
  when: groupsync.ca_cert | default('') != ''

# --------------------------------------------------------------------------
# Extract LDAP host for CronJob pod hostAliases.
# If groupsync.ldap_url contains an EC2 hostname (ec2-A-B-C-D.region...),
# extract the IP so pods can resolve it without external DNS.
# If the URL already contains an IP, _ldap_host_ip stays empty (no alias needed).
# --------------------------------------------------------------------------
- name: Extract LDAP host from groupsync URL
  ansible.builtin.set_fact:
    _ldap_host: "{{ groupsync.ldap_url | regex_search('ldap://([^:/?]+)', '\\1') | first | default('') }}"

- name: Extract IP from EC2-format hostname for disconnected pod DNS bypass
  ansible.builtin.set_fact:
    _ldap_host_ip: >-
      {{ (_ldap_host
          | regex_search('^ec2-(\d+)-(\d+)-(\d+)-(\d+)\.', '\1', '\2', '\3', '\4')
          | default([], true))
         | join('.') }}

# The CronJob previously hardcoded
# image-registry.openshift-image-registry.svc:5000/openshift/cli:latest,
# assuming an `openshift/cli` imagestream tag exists on every cluster. It
# only ever worked on the hub "by luck" -- spokes have no such imagestream,
# so the CronJob pod permanently sat ImagePullBackOff and every hourly sync
# was skipped with JobAlreadyActive. Resolve the cli image directly from
# each cluster's own release payload instead: `oc adm release info
# --image-for=cli` returns the canonical quay.io/openshift-release-dev/...
# digest reference (not a mirrored one) -- that's fine, since that source is
# already covered by the same ImageDigestMirrorSet/ITMS objects this
# playbook applies for every other release/operator image, so CRI-O on the
# node transparently redirects the actual pull to the mirror. Query using
# the target cluster's own merged pull-secret (not local/jumphost auth) so
# this resolves identically on hub and spoke.
- name: Get target cluster's pull-secret for release-info lookup
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get secret pull-secret -n openshift-config
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d
  register: _groupsync_pull_secret
  changed_when: false
  no_log: true

- name: Write target cluster's pull-secret to a temp file
  ansible.builtin.copy:
    content: "{{ _groupsync_pull_secret.stdout }}"
    dest: "/tmp/groupsync-pull-secret-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}.json"
    mode: '0600'
  no_log: true

- name: Resolve cli image from the cluster's own release payload
  ansible.builtin.shell: >
    {{ bin_dir }}/oc adm release info --image-for=cli
    --kubeconfig {{ target_kubeconfig }}
    --registry-config=/tmp/groupsync-pull-secret-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}.json
  register: _groupsync_cli_image
  changed_when: false

- name: Clean up temp pull-secret file
  ansible.builtin.file:
    path: "/tmp/groupsync-pull-secret-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}.json"
    state: absent

- name: Create LDAPSyncConfig ConfigMap
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'ldap-sync-config.yaml.j2') }}"
  changed_when: true

- name: Create LDAP group sync CronJob
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'ldap-group-sync-cronjob.yaml.j2') }}"
  changed_when: true

# --------------------------------------------------------------------------
# Initial group sync — seeds groups immediately so they exist before the
# first scheduled CronJob run.
# LDAP now runs on the jumphost (same machine running this playbook), so
# groupsync.ldap_url is directly reachable — no port-forward required.
# The only substitution needed: replace the k8s secret path with a local file.
# --------------------------------------------------------------------------
- name: Check if groups already exist (skip initial sync if present)
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get group {{ (rbac_bindings | default([]) | map(attribute='group') | list | first) | default('openshift-admins') | quote }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _group_exists_check
  changed_when: false
  failed_when: false

- name: Run initial GroupSync directly (LDAP is on jumphost, same machine)
  when: _group_exists_check.stdout == ""
  block:
    - name: Write bind password to temp file
      ansible.builtin.copy:
        content: "{{ groupsync.bind_password }}"
        dest: "/tmp/ldap-sync-bindpw-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}"
        mode: '0600'
      no_log: true

    - name: Write local sync config (raw LDAPSyncConfig — no ConfigMap wrapper)
      ansible.builtin.copy:
        content: >-
          {{ lookup('template', 'ldap-sync-config-raw.yaml.j2')
             | replace('file: /etc/secrets/bindPassword',
                       'file: /tmp/ldap-sync-bindpw-' + (inventory_hostname | regex_replace('[^a-z0-9]', '-'))) }}
        dest: "/tmp/ldap-sync-init-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}.yaml"
        mode: '0600'
      no_log: true

    - name: Run initial GroupSync with --confirm
      ansible.builtin.shell: >
        {{ bin_dir }}/oc adm groups sync
        --sync-config=/tmp/ldap-sync-init-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}.yaml
        --confirm
        --kubeconfig {{ target_kubeconfig }}
        2>&1
      register: _initial_sync
      changed_when: "'group/' in _initial_sync.stdout"

    - name: Display initial sync result
      ansible.builtin.debug:
        msg: "Initial GroupSync: {{ _initial_sync.stdout_lines }}"

  always:
    - name: Clean up temp files
      ansible.builtin.shell: |
        rm -f "/tmp/ldap-sync-bindpw-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}" \
              "/tmp/ldap-sync-init-{{ inventory_hostname | regex_replace('[^a-z0-9]', '-') }}.yaml"
      changed_when: false
      failed_when: false
