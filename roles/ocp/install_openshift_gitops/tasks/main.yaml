---
- name: "Ensure the Operator Namespace Exists"
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitops_operator_namespace }}"
  changed_when: true

# Note: If installing to 'openshift-operators', the OperatorGroup already exists.
# We only create one if we are using a custom namespace.
- name: "Create OperatorGroup for GitOps (if custom namespace)"
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: operators.coreos.com/v1
      kind: OperatorGroup
      metadata:
        name: openshift-gitops-operator-group
        namespace: "{{ gitops_operator_namespace }}"
  changed_when: true
  when: gitops_operator_namespace != "openshift-operators"

- name: "Subscribe to OpenShift GitOps Operator"
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: operators.coreos.com/v1alpha1
      kind: Subscription
      metadata:
        name: openshift-gitops-operator
        namespace: "{{ gitops_operator_namespace }}"
      spec:
        channel: "{{ gitops_operator_channel }}"
        installPlanApproval: Automatic
        name: openshift-gitops-operator
        source: "{{ gitops_operator_source }}"
        sourceNamespace: "{{ gitops_operator_source_namespace }}"
  changed_when: true

- name: "Wait for redhat-operators CatalogSource to be READY"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get catalogsource {{ gitops_operator_source }}
    -n {{ gitops_operator_source_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.connectionState.lastObservedState}' 2>/dev/null || true
  register: _cs_state
  until: _cs_state.stdout == "READY"
  retries: 60
  delay: 15
  changed_when: false
  when: wait_for_operator_ready
  # Non-fatal on re-runs: CatalogSource may be TRANSIENT_FAILURE if the Quay
  # migration ingress CA trust (patch_cluster_idms) hasn't run yet. If GitOps
  # is already installed, the subscription and CSV already exist and this wait
  # is not needed. The migrate_mirror play will resolve CatalogSource health.
  failed_when: false

# If the CatalogSource never became READY, check whether GitOps is already
# installed before allowing the CSV wait to spin for 15 minutes. On a fresh
# install a non-READY catalog means the operator image was not mirrored — fail
# fast with a diagnostic message. On a re-run the CSV already exists so we can
# skip the wait entirely.
- name: "Check for pre-existing GitOps CSV (re-run guard)"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get subscription openshift-gitops-operator
    -n {{ gitops_operator_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.installedCSV}' 2>/dev/null || true
  register: _preexisting_csv
  changed_when: false
  failed_when: false
  when:
    - wait_for_operator_ready
    - _cs_state.stdout | default('') != "READY"

- name: "Fail fast if CatalogSource is not READY and no CSV is installed yet"
  ansible.builtin.fail:
    msg: >-
      {{ gitops_operator_source }} CatalogSource is
      "{{ _cs_state.stdout | default('unknown') }}" (expected READY).
      OLM cannot resolve the openshift-gitops-operator Subscription.
      On a disconnected cluster this usually means the operator catalog image
      was not successfully mirrored. Check:
        oc get pods -n {{ gitops_operator_source_namespace }}
          --kubeconfig {{ target_kubeconfig }}
      to see if the catalog pod is in ImagePullBackOff or CrashLoopBackOff,
      and verify the oc-mirror run mirrored all operator images without errors.
  when:
    - wait_for_operator_ready
    - _cs_state.stdout | default('') != "READY"
    - _preexisting_csv.stdout | default('') == ""

- name: "Wait for GitOps Operator CSV to be installed"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get subscriptions.operators.coreos.com openshift-gitops-operator
    -n {{ gitops_operator_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.status.installedCSV}{.status.currentCSV}' 2>/dev/null || true
  register: gitops_sub
  until: gitops_sub.stdout != ""
  retries: 90
  delay: 10
  changed_when: false
  when:
    - wait_for_operator_ready
    - _cs_state.stdout | default('') == "READY" or _preexisting_csv.stdout | default('') != ""

- name: "Wait for the GitOps Operator Deployment to be Ready"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get deployment
    -n {{ gitops_operator_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -l operators.coreos.com/openshift-gitops-operator.{{ gitops_operator_namespace }}
    -o jsonpath='{.items[0].status.availableReplicas}' 2>/dev/null || true
  register: gitops_deployment
  until: (gitops_deployment.stdout | default('0') | int) > 0
  retries: 60
  delay: 10
  changed_when: false
  when: wait_for_operator_ready

- name: "Wait for the default openshift-gitops ArgoCD instance to be auto-created by the Operator"
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get argocd openshift-gitops
    -n {{ acm_argocd_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: default_argocd
  until: default_argocd.stdout == "openshift-gitops"
  retries: 60
  delay: 10
  changed_when: false

- name: "Teach ArgoCD how to evaluate OLM health (Patch)"
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: |
      apiVersion: argoproj.io/v1beta1
      kind: ArgoCD
      metadata:
        name: openshift-gitops
        namespace: "{{ acm_argocd_namespace }}"
      spec:
        resourceHealthChecks:
          - group: operators.coreos.com
            kind: Subscription
            check: |
              hs = {}
              hs.status = "Progressing"
              hs.message = "Waiting for Subscription to resolve..."
              if obj.status ~= nil then
                if obj.status.conditions ~= nil then
                  for i, condition in ipairs(obj.status.conditions) do
                    if condition.status == "True" then
                      if condition.type == "ResolutionFailed" or
                         condition.type == "CatalogSourcesUnhealthy" or
                         condition.type == "InstallPlanMissing" then
                        hs.status = "Degraded"
                        hs.message = (condition.reason or condition.type) .. ": " .. (condition.message or "Unknown error")
                        return hs
                      end
                    end
                  end
                end
                if obj.status.installedCSV ~= nil then
                  hs.status = "Healthy"
                  hs.message = "CSV " .. obj.status.installedCSV .. " is installed"
                  return hs
                end
              end
              return hs

          - group: operators.coreos.com
            kind: ClusterServiceVersion
            check: |
              hs = {}
              hs.status = "Progressing"
              hs.message = "Waiting for CSV phase..."
              if obj.status ~= nil and obj.status.phase ~= nil then
                local phase = obj.status.phase
                local message = obj.status.message or obj.status.reason or ("CSV is " .. phase)

                if phase == "Succeeded" then
                  hs.status = "Healthy"
                  hs.message = "Operator is running: " .. message
                  return hs
                end
                if phase == "Failed" then
                  hs.status = "Degraded"
                  hs.message = "Operator failed: " .. message
                  return hs
                end
                if phase == "Pending" or phase == "Installing" or phase == "Replacing" then
                  hs.status = "Progressing"
                  hs.message = message
                  return hs
                end

                hs.status = "Unknown"
                hs.message = "Unknown CSV phase: " .. phase
                return hs
              end
              return hs
  register: argocd_patch
  changed_when: true
  until: argocd_patch.rc == 0
  retries: 12
  delay: 10

- debug:
    msg: "OpenShift GitOps installed successfully. The default 'openshift-gitops' namespace should now be initializing."
