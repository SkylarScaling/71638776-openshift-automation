---
- name: Verify that the openshift-gitops namespace exists
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get namespace {{ odf_argocd_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _gitops_ns_check
  changed_when: false
  until: _gitops_ns_check.stdout != ""
  retries: 30
  delay: 10

- name: Wait for ArgoCD Application Controller ServiceAccount to be scaffolded
  ansible.builtin.shell: >
    {{ bin_dir }}/oc get serviceaccount openshift-gitops-argocd-application-controller
    -n {{ odf_argocd_namespace }}
    --kubeconfig {{ target_kubeconfig }}
    -o jsonpath='{.metadata.name}' 2>/dev/null || true
  register: _argocd_sa_check
  changed_when: false
  until: _argocd_sa_check.stdout != ""
  retries: 30
  delay: 10

- name: Grant ArgoCD Application Controller cluster-admin permissions
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'argocd-rbac.yaml.j2') }}"
  changed_when: true

- name: Create the OpenShift GitOps Application
  ansible.builtin.shell:
    cmd: "{{ bin_dir }}/oc apply --kubeconfig {{ target_kubeconfig }} -f -"
    stdin: "{{ lookup('template', 'odf-argocd-app.yaml.j2') }}"
  changed_when: true
